<title>Whale Mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
/* layout: one screen — a slim title row, the canvas taking all spare height, a wrapping row of controls beneath */
:root{
  --paper:#f6f4ee; --ink:#27303f; --soft:#6d7686; --line:#d6d2c6; --panel:#ece9df; --accent:#3f5f8f;
  --display:"Klee One","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif; --body:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#171b23; --ink:#e6e8ee; --soft:#9aa3b3; --line:#323949; --panel:#1f2530; --accent:#8fb0e6; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#171b23; --ink:#e6e8ee; --soft:#9aa3b3; --line:#323949; --panel:#1f2530; --accent:#8fb0e6; color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:600 20px/1.2 var(--display);margin:0;text-wrap:balance}
header p{margin:0;color:var(--soft);font-size:13px}
#stage{flex:1 1 auto;min-height:220px;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:100%}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.controls label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);min-width:0}
.controls input[type=range]{width:120px;max-width:38vw;accent-color:var(--accent)}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 10px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--paper)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tog{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
.tog[aria-pressed=true]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
</style>

<header>
  <h1>Whale Mockup</h1>
  <p>A humpback for level 2, drawn in the game's style. Nothing here is in the game yet.</p>
</header>
<div id="stage"><canvas id="cv" aria-label="A drawn humpback whale swimming slowly around the canvas"></canvas></div>
<div class="controls">
  <div class="seg" role="group" aria-label="Background">
    <button type="button" id="bgBlank" aria-pressed="true">Blank</button>
    <button type="button" id="bgDay" aria-pressed="false">Day sky</button>
    <button type="button" id="bgNight" aria-pressed="false">Night sky</button>
  </div>
  <label for="size">Size <input id="size" type="range" min="40" max="160" value="100"></label>
  <label for="speed">Swim speed <input id="speed" type="range" min="0" max="200" value="100"></label>
  <label for="beat">Tail beat <input id="beat" type="range" min="20" max="200" value="100"></label>
  <button type="button" class="tog" id="still" aria-pressed="false">Hold in the middle</button>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
let W=0,H=0,DPR=1;
function fit(){ const r=stage.getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2); W=Math.max(50,r.width); H=Math.max(50,r.height); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
new ResizeObserver(fit).observe(stage); fit();
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches?0.35:1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const h2=(a,b)=>{ let n=Math.sin(a*127.1+b*311.7)*43758.5453; return n-Math.floor(n); };

/* ---- the whale, in its own space: nose at +x, length 2 (x from 1 to -1), y up negative ---- */
// half-heights of the body above and below the spine, by s (0 nose .. 1 tail stock)
// The humpback's outline, as heights above and below a straight line from the tip of the jaw to the tail stock.
// Above: a low flat head, a small rise at the blowhole, a long back, the hump that carries the fin, then the thin stock.
// Below: the jaw swelling at once into a deep throat, deepest about a quarter of the way back, rising slowly to the stock.
const PT=[[0,0.012],[0.012,0.03],[0.05,0.054],[0.11,0.08],[0.17,0.098],[0.21,0.108],[0.24,0.112],[0.32,0.13],[0.45,0.15],[0.56,0.142],[0.63,0.14],[0.7,0.112],[0.8,0.07],[0.9,0.04],[1,0.026]];
const PB=[[0,0.012],[0.012,0.05],[0.045,0.11],[0.09,0.17],[0.16,0.235],[0.26,0.288],[0.36,0.27],[0.47,0.215],[0.58,0.16],[0.7,0.105],[0.82,0.06],[0.92,0.036],[1,0.026]];
function prof(T,s){ let k=1; while(k<T.length-1 && T[k][0]<s) k++; const a=T[k-1], b=T[k], p=T[Math.max(0,k-2)], n=T[Math.min(T.length-1,k+1)], u=clamp((s-a[0])/(b[0]-a[0]),0,1);
  const m0=(b[1]-p[1])/(b[0]-p[0])*(b[0]-a[0]), m1=(n[1]-a[1])/(n[0]-a[0])*(b[0]-a[0]), u2=u*u, u3=u2*u;   // a smooth curve through the points
  return Math.max(0.003,(2*u3-3*u2+1)*a[1]+(u3-2*u2+u)*m0+(-2*u3+3*u2)*b[1]+(u3-u2)*m1); }
const TOP=s=>prof(PT,s);
const BOT=s=>prof(PB,s);
function spine(t,beat){   // the whale bends up and down along its length, more toward the tail
  const P=[]; const N=132;
  for(let i=0;i<=N;i++){ const s=i/N, x=1-2*s, w=Math.sin(t*beat-s*3.3), y=0.02*Math.sin(t*beat*0.5)+ (0.012+0.2*s*s)*w*calm; P.push([x,y,s]); }
  for(let i=0;i<=N;i++){ const a=P[Math.max(0,i-1)], b=P[Math.min(N,i+1)], dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1; P[i][3]=-dy/l; P[i][4]=dx/l; }   // normal pointing "up" for a whale facing +x
  return P;
}
function drawWhale(t,beat,night){
  const P=spine(t,beat), N=P.length-1;
  const top=i=>{ const n=P[i]; return [n[0]+n[3]*TOP(n[2]), n[1]+n[4]*TOP(n[2])]; };   // note: normal computed so that +normal is toward the back
  const bot=i=>{ const n=P[i]; return [n[0]-n[3]*BOT(n[2]), n[1]-n[4]*BOT(n[2])]; };
  const mid=(i,k)=>{ const n=P[i], a=TOP(n[2]), b=BOT(n[2]), o=a-(a+b)*k; return [n[0]+n[3]*o, n[1]+n[4]*o]; };   // k=0 back, k=1 belly
  const C=night?{back:'#1f2250',back2:'#2a2e62',belly:'#8fa6bd',groove:'#6c86a0',fin:'#1c1e48',finPale:'#9db1c6',finUnder:'#6f84a8',eye:'#0d0f22',spot:'#3a3f6a',knob:'#565b86',white:'#dfe6f2'}
               :{back:'#2e3168',back2:'#3b3f80',belly:'#b9d0dc',groove:'#8fb1c0',fin:'#292b5e',finPale:'#c6d8e2',finUnder:'#93a8cc',eye:'#12142c',spot:'#474c7c',knob:'#7479a2',white:'#ffffff'};
  const path=(pts)=>{ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); };

  // far flipper, behind the body
  const attS=0.34, att=0.086;   // where the flippers leave the body: in the dark of the flank, just above the pale line
  flipper(P, attS+0.01, t, beat, C, true, att+0.04);

  // tail flukes. The stock does not end before the tail begins: it spreads out into the two lobes, and its ridge carries on through
  // the middle of them to the notch. The lobe on the far side is a little smaller and darker and lies behind the near one. As the tail
  // beats it shows its dark top on the way down and its white underside, edged with dark, on the way up.
  { const e=P[N], a=Math.atan2(P[N][1]-P[N-9][1], P[N][0]-P[N-9][0]), tipS=Math.sin(Math.cos(t*beat-3.6)*0.6*calm), sy=(0.3+0.5*Math.abs(tipS)/Math.sin(0.6))*1.15, under=tipS<0;
    const hs=TOP(1)/sy*1.05;                                                       // half the stock's thickness, in the tail's own squashed space
    ctx.save(); ctx.translate(e[0],e[1]); ctx.rotate(a); ctx.scale(-1.15,sy);
    const edgeL=(sg,k)=>[[0.16,-hs*sg],[0.05,-hs*1.2*sg],[-0.03,-0.13*sg*k],[-0.13,-0.31*sg*k],[-0.37*k,-0.5*sg*k]];                                   // leading edge, from the stock out to the tip
    const edgeT=(sg,k)=>[[-0.37*k,-0.5*sg*k],[-0.3*k,-0.37*sg*k],[-0.32*k,-0.25*sg*k],[-0.24,-0.16*sg*k],[-0.25,-0.06*sg*k],[-0.17,0]];             // wavy trailing edge, back to the notch
    const run=(q,start)=>{ if(start) ctx.moveTo(q[0][0],q[0][1]); for(let j=1;j<q.length-1;j++) ctx.quadraticCurveTo(q[j][0],q[j][1],(q[j][0]+q[j+1][0])/2,(q[j][1]+q[j+1][1])/2); ctx.lineTo(q[q.length-1][0],q[q.length-1][1]); };
    const lobe=(sg,k)=>{ ctx.beginPath(); run(edgeL(sg,k),true); run(edgeT(sg,k),false); ctx.lineTo(0.16,0); ctx.closePath(); };
    const paint=(sg,k,far)=>{ lobe(sg,k); ctx.fillStyle=under?(far?C.finUnder:C.belly):(far?C.fin:C.back); ctx.fill();
      ctx.save(); lobe(sg,k); ctx.clip(); ctx.lineCap='round'; ctx.lineJoin='round';
      if(under){ ctx.strokeStyle=C.back; ctx.lineWidth=0.075; ctx.beginPath(); run(edgeT(sg,k),true); ctx.stroke(); }                                   // the dark border along the trailing edge of the white underside
      ctx.strokeStyle=under?C.back:C.fin; ctx.lineWidth=under?0.03:0.05; ctx.beginPath(); run(edgeL(sg,k),true); ctx.stroke();                          // a heavier leading edge: a blade, not a sheet
      if(!under && !far){ ctx.fillStyle=C.back2; ctx.globalAlpha=0.55; ctx.beginPath(); ctx.moveTo(0.02,-0.03*sg); ctx.quadraticCurveTo(-0.12,-0.2*sg,-0.3,-0.4*sg); ctx.quadraticCurveTo(-0.2,-0.2*sg,-0.16,-0.03*sg); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
      ctx.restore(); };
    paint(1,0.9,true); paint(-1,1,false);
    // the ridge of the stock, running on through the tail to the notch
    ctx.fillStyle=under?C.back:C.fin; ctx.beginPath(); ctx.moveTo(0.18,-hs); ctx.quadraticCurveTo(0,-hs*0.9,-0.17,0); ctx.quadraticCurveTo(0,hs*0.9,0.18,hs); ctx.closePath(); ctx.fill();
    if(!under){ ctx.fillStyle=C.back2; ctx.globalAlpha=0.6; ctx.beginPath(); ctx.moveTo(0.18,-hs*0.6); ctx.quadraticCurveTo(0.02,-hs*0.55,-0.13,0); ctx.quadraticCurveTo(0.02,-hs*0.1,0.18,-hs*0.1); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }
    ctx.restore(); }

  // body: dark back
  const body=()=>{ const pts=[]; for(let i=0;i<=N;i++) pts.push(top(i)); for(let i=N;i>=0;i--) pts.push(bot(i)); path(pts); };
  const off=(i,o)=>{ const n=P[i]; return [n[0]-n[3]*o, n[1]-n[4]*o]; };          // a point o below the spine line (above it when o is negative)
  const I=f=>Math.round(N*f);
  body(); ctx.fillStyle=C.back; ctx.fill();
  // the small hooked fin on its hump, and the knuckles along the tail stock
  { const i=I(0.64), n=P[i], a=top(i-5), b=top(i+7); ctx.fillStyle=C.back; ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.quadraticCurveTo(n[0]+n[3]*(TOP(n[2])+0.05)+0.01, n[1]+n[4]*(TOP(n[2])+0.05), n[0]+n[3]*(TOP(n[2])+0.055)-0.035, n[1]+n[4]*(TOP(n[2])+0.055)); ctx.quadraticCurveTo(n[0]+n[3]*(TOP(n[2])+0.02)-0.03, n[1]+n[4]*(TOP(n[2])+0.02), b[0],b[1]); ctx.closePath(); ctx.fill();
    for(let j=0;j<5;j++){ const q=top(I(0.74+0.045*j)); ctx.beginPath(); ctx.arc(q[0],q[1]+0.004,0.012-0.0015*j,0,7); ctx.fill(); } }
  // the mouth: from the tip of the jaw it runs back just under the top of the head, bows, and drops to its corner below the eye
  const mouth=s=>0.006+0.04*Math.pow(Math.sin(clamp(s/0.29,0,1)*Math.PI*0.5),1.3);   // the mouth is the line where the dark upper jaw meets the pale lower one: from the tip, running back and a little down to the eye
  // pale underside: the lower jaw and throat below the mouth, then a falling line along the flank that breaks into patches
  const edge=s=>{ if(s<0.258) return mouth(s); const d0=clamp((s-0.258)/0.03,0,1), d=d0*d0*(3-2*d0), low=0.096+0.018*Math.sin(s*14)*clamp((s-0.4)/0.06,0,1)+(s-0.27)*-0.03+Math.pow(clamp((s-0.5)/0.3,0,1),1.5)*0.02; return mouth(s)+(low-mouth(s))*d; };   // at the eye the dark drops, and stays low all the way back to the flipper, as on a real humpback
  { ctx.save(); body(); ctx.clip();
    const pts=[], palTop=sv=>{ if(sv<=0.56) return edge(sv); const back=BOT(sv)*(0.6-0.3*(sv-0.6)), m=clamp((sv-0.56)/0.1,0,1); return edge(sv)+(back-edge(sv))*m; };   // the white carries on, narrowing, under the tail stock to the root of the tail
    for(let i=0;i<=N;i++) pts.push(off(i,palTop(P[i][2]))); for(let i=N;i>=0;i--) pts.push(bot(i));
    path(pts); ctx.fillStyle=C.belly; ctx.fill();
    for(let k=0;k<7;k++){ const sv=0.5+0.045*k, i=I(sv), q=off(i,edge(sv)-0.022-0.03*h2(k,7)); ctx.beginPath(); ctx.ellipse(q[0],q[1],0.02+0.018*h2(k,9),0.008+0.007*h2(k,5),-0.2,0,7); ctx.fill(); }
    // throat grooves: long lines from the chin back to the navel, following the curve of the belly
    ctx.strokeStyle=C.groove; ctx.lineWidth=0.0065; ctx.lineCap='round';
    for(let g2=0;g2<7;g2++){ const f=0.2+g2*0.115, i0=I(0.02+0.012*g2), iE=I(0.56-0.035*g2); ctx.beginPath();
      for(let i=i0;i<=iE;i+=2){ const sv=P[i][2], e0=edge(sv), q=off(i,e0+(BOT(sv)-e0)*f); if(i===i0) ctx.moveTo(q[0],q[1]); else ctx.lineTo(q[0],q[1]); } ctx.stroke(); }
    ctx.restore(); }
  // a lighter sweep along the back
  { const pts=[]; for(let i=I(0.1);i<=I(0.86);i++) pts.push(off(i,-TOP(P[i][2])*0.72)); for(let i=I(0.86);i>=I(0.1);i--) pts.push(off(i,-TOP(P[i][2])*0.22)); path(pts); ctx.fillStyle=C.back2; ctx.fill(); }
  // mouth line, eye, the blowhole's rise, and the knobs on the head and along the jaw
  { const iM=I(0.272); ctx.strokeStyle=C.eye; ctx.lineWidth=0.006; ctx.lineCap='round'; ctx.beginPath();
    for(let i=0;i<=iM;i++){ const q=off(i,mouth(P[i][2])); if(i===0) ctx.moveTo(q[0],q[1]); else ctx.lineTo(q[0],q[1]); } ctx.stroke();
    const e=off(I(0.283),mouth(0.283)+0.014);
    ctx.save(); body(); ctx.clip(); ctx.fillStyle=C.back; ctx.beginPath(); ctx.ellipse(e[0]+0.004,e[1]-0.012,0.05,0.04,0.1,0,7); ctx.fill(); ctx.restore();   // the dark of the head dips down round the eye, into the pale
    ctx.fillStyle=C.white; ctx.beginPath(); ctx.ellipse(e[0],e[1],0.014,0.012,0,0,7); ctx.fill(); ctx.fillStyle=C.eye; ctx.beginPath(); ctx.arc(e[0]+0.002,e[1]+0.001,0.0085,0,7); ctx.fill();
    ctx.fillStyle=C.knob; for(let j=0;j<9;j++){ const sv=0.03+0.018*j+0.006*h2(j,31), q=off(I(sv),-TOP(sv)*(0.35+0.5*h2(j,33))); ctx.beginPath(); ctx.arc(q[0],q[1],0.0075+0.004*h2(j,35),0,7); ctx.fill(); }
    ctx.fillStyle=C.spot; for(let j=0;j<7;j++){ const sv=0.03+0.02*j, q=off(I(sv),mouth(sv)+0.022+0.03*h2(j,37)); ctx.beginPath(); ctx.arc(q[0],q[1],0.007+0.004*h2(j,39),0,7); ctx.fill(); } }
  // near flipper, in front
  flipper(P, attS, t, beat, C, false, att);
  { const e=off(I(0.283),mouth(0.283)+0.014); ctx.fillStyle=C.white; ctx.beginPath(); ctx.ellipse(e[0],e[1],0.014,0.012,0,0,7); ctx.fill(); ctx.fillStyle=C.eye; ctx.beginPath(); ctx.arc(e[0]+0.002,e[1]+0.001,0.0085,0,7); ctx.fill(); }   // the eye once more, last of all, so nothing can ever hide it
}
function flipper(P,s,t,beat,C,far,att){   // the humpback's very long flipper: a pointed blade, dark blue on top, set into the dark of the flank behind the eye
  // and hanging down and back. It is built on five joints like the flamingos' wings, so it bends softly as it sweeps: each joint follows
  // the one before a little late. The far one shows its pale underside.
  const N=P.length-1, i=Math.round(N*s), n=P[i], ox=n[0]-n[3]*att, oy=n[1]-n[4]*att;
  const ph=t*beat*0.5+(far?1.2:0), sw=Math.sin(ph)*0.3*calm, back=(far?0.66+sw*0.8:0.38+sw*0.8), L=far?0.6:0.74, J=5, seg=L/J;
  ctx.save(); ctx.translate(ox,oy); ctx.rotate(back); ctx.scale(far?-0.85:-1,1);   // mirrored, so the knobbly leading edge faces forward and the tip trails
  const jt=[[0,0,0]]; let th=0, x=0, y=0;
  for(let k=1;k<=J;k++){ th+=(0.035+0.11*Math.sin(ph-k*0.62))*calm+0.02; x+=Math.sin(th)*seg; y+=Math.cos(th)*seg; jt.push([x,y,th]); }
  const wide=u=>0.165*Math.pow(Math.sin(Math.PI*Math.pow(clamp(u*0.94+0.06,0,1),0.62)),0.9)+0.012*(1-u);   // broad a third of the way out, running to a point
  const lead=[], trail=[];
  for(let k=0;k<=J;k++){ const u=k/J, q=jt[k], a=k===0?jt[1][2]*0.5:q[2], nx=Math.cos(a), ny=-Math.sin(a), w=wide(u);
    lead.push([q[0]-nx*w*0.42-0.004*((k%2)?1:0), q[1]-ny*w*0.42]); trail.push([q[0]+nx*w*0.58, q[1]+ny*w*0.58]); }
  const tip=[jt[J][0]+Math.sin(jt[J][2])*0.075, jt[J][1]+Math.cos(jt[J][2])*0.075];
  const soft=(pts,start)=>{ if(start) ctx.moveTo(pts[0][0],pts[0][1]); else ctx.lineTo(pts[0][0],pts[0][1]); for(let k=1;k<pts.length-1;k++){ const mx=(pts[k][0]+pts[k+1][0])/2, my=(pts[k][1]+pts[k+1][1])/2; ctx.quadraticCurveTo(pts[k][0],pts[k][1],mx,my); } const e=pts[pts.length-1]; ctx.lineTo(e[0],e[1]); };
  // the root: where the flipper leaves the body it has no cut edge. It swells into a wide rounded shoulder that lies inside the flank,
  // in the flank's own colour, so the body simply runs out into the blade.
  const RL=[lead[0][0]*1.15,-0.026], RT=[trail[0][0]*1.7+0.02,-0.034], RU=[(lead[0][0]+trail[0][0])*0.5+0.03,-0.062];   // the shoulder spreads back along the flank, away from the eye
  const shape=()=>{ ctx.beginPath(); ctx.moveTo((RU[0]+RL[0])/2,(RU[1]+RL[1])/2); ctx.quadraticCurveTo(RL[0],RL[1],(RL[0]+lead[0][0])/2,(RL[1]+lead[0][1])/2);
    ctx.quadraticCurveTo(lead[0][0],lead[0][1],(lead[0][0]+lead[1][0])/2,(lead[0][1]+lead[1][1])/2);
    for(let k=1;k<lead.length-1;k++) ctx.quadraticCurveTo(lead[k][0],lead[k][1],(lead[k][0]+lead[k+1][0])/2,(lead[k][1]+lead[k+1][1])/2);
    ctx.lineTo(lead[J][0],lead[J][1]); ctx.lineTo(tip[0],tip[1]); ctx.lineTo(trail[J][0],trail[J][1]);
    for(let k=J-1;k>=1;k--) ctx.quadraticCurveTo(trail[k][0],trail[k][1],(trail[k][0]+trail[k-1][0])/2,(trail[k][1]+trail[k-1][1])/2);
    ctx.quadraticCurveTo(trail[0][0],trail[0][1],(trail[0][0]+RT[0])/2,(trail[0][1]+RT[1])/2); ctx.quadraticCurveTo(RT[0],RT[1],(RT[0]+RU[0])/2,(RT[1]+RU[1])/2); ctx.quadraticCurveTo(RU[0],RU[1],(RU[0]+RL[0])/2,(RU[1]+RL[1])/2); ctx.closePath(); };
  const rgb=h=>parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
  const fadeIn=(hex,y0,y1,a)=>{ const g=ctx.createLinearGradient(0,y0,0,y1); g.addColorStop(0,'rgba('+rgb(hex)+',0)'); g.addColorStop(1,'rgba('+rgb(hex)+','+a+')'); return g; };   // nothing at the join, full strength a way down the blade
  if(far){ shape(); ctx.fillStyle=C.finUnder; ctx.fill();
    ctx.fillStyle=C.finPale; for(let k=0;k<10;k++){ const u=0.3+0.65*h2(k,43), f=u*J, a=Math.min(J-1,Math.floor(f)), q0=jt[a], q1=jt[a+1], fr=f-a; ctx.beginPath(); ctx.arc(q0[0]+(q1[0]-q0[0])*fr+(h2(k,41)-0.5)*wide(u)*0.7, q0[1]+(q1[1]-q0[1])*fr, 0.006+0.007*h2(k,47), 0, 7); ctx.fill(); }
    ctx.restore(); return; }
  ctx.save(); ctx.translate(0.012,0.014); shape(); ctx.fillStyle=fadeIn(C.finUnder,L*0.16,L*0.42,1); ctx.fill(); ctx.restore();   // a sliver of the pale underside along its edge
  shape(); ctx.fillStyle=C.back; ctx.fill();
  ctx.save(); shape(); ctx.clip();
  ctx.fillStyle=C.back2; ctx.beginPath(); soft(jt.map(q=>[q[0]-0.012,q[1]]),true); ctx.lineTo(tip[0],tip[1]); soft(trail.slice().reverse(),false); ctx.closePath(); ctx.fillStyle=fadeIn(C.back2,L*0.08,L*0.4,0.5); ctx.fill();   // a little lighter toward the trailing edge, coming in gradually
  ctx.fillStyle=C.white;                                                           // white flecks, thick toward the tip and the edges
  for(let k=0;k<46;k++){ const u=0.22+0.78*Math.pow(h2(k,51),0.6), f=Math.min(J-0.001,u*J), a=Math.floor(f), q0=jt[a], q1=jt[a+1], fr=f-a, side=(h2(k,53)-0.5), w=wide(u);
    const edgey=Math.abs(side)*2, keep=h2(k,55)<0.25+0.75*Math.max(u*u,edgey*edgey); if(!keep) continue;
    ctx.globalAlpha=0.9; ctx.beginPath(); ctx.arc(q0[0]+(q1[0]-q0[0])*fr+side*w*0.95, q0[1]+(q1[1]-q0[1])*fr+(h2(k,57)-0.5)*0.03, 0.0035+0.008*h2(k,59)*h2(k,61), 0, 7); ctx.fill(); }
  ctx.globalAlpha=1; ctx.restore();
  ctx.restore();
}

/* ---- the stage ---- */
let bg='blank', still=false, face=1, px=0, py=0, pitch=0, swimT=0, last=performance.now();
function paper(){ return getComputedStyle(document.documentElement).getPropertyValue('--paper').trim()||'#f6f4ee'; }
function drawBg(t){
  if(bg==='blank'){ ctx.fillStyle=paper(); ctx.fillRect(0,0,W,H); return; }
  const g=ctx.createLinearGradient(0,0,0,H);
  if(bg==='day'){ g.addColorStop(0,'#3aa6a0'); g.addColorStop(0.55,'#cfe0b4'); g.addColorStop(1,'#f6e2ea'); } else { g.addColorStop(0,'#16224a'); g.addColorStop(0.6,'#2a3f7a'); g.addColorStop(1,'#4a5aa6'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(bg==='night'){ ctx.fillStyle='rgba(220,230,255,.8)'; for(let i=0;i<70;i++){ const x=h2(i,1)*W, y=h2(i,2)*H*0.8, r=0.5+h2(i,3)*1.1; ctx.globalAlpha=0.4+0.5*h2(i,4); ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); } ctx.globalAlpha=1; }
  // a floor of cloud, as in the cloud field
  const base=H*0.86; for(let r=0;r<3;r++){ ctx.fillStyle=bg==='day'?['#f3cfe0','#f8dce8','#fdeef2'][r]:['#2c3c8c','#3447a0','#4155b4'][r]; ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W+40;x+=40){ const y=base+r*16-14*Math.abs(Math.sin(x*0.02+r*1.7+t*0.05*(r+1)))-8*Math.sin(x*0.007+r); ctx.lineTo(x,y); } ctx.lineTo(W,H); ctx.closePath(); ctx.fill(); }
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  const size=+document.getElementById('size').value/100, speed=+document.getElementById('speed').value/100, beat=1.6*(+document.getElementById('beat').value/100);
  swimT+=dt*speed; const t=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0); drawBg(t);
  // a slow wandering loop around the canvas
  const ax=W*0.3, ay=H*0.2, tx=still?0:ax*Math.sin(swimT*0.13), ty=still?0:ay*Math.sin(swimT*0.21+1), vx=still?1:Math.cos(swimT*0.13)*0.13*ax, vy=still?0:Math.cos(swimT*0.21+1)*0.21*ay;
  px+=(tx-px)*Math.min(1,dt*3); py+=(ty-py)*Math.min(1,dt*3);
  const want=vx>=0?1:-1; face+=(want-face)*Math.min(1,dt*1.1);                                   // it turns by swinging round, never by snapping
  const wp=clamp(Math.atan2(vy,Math.abs(vx)+1e-3)*0.6,-0.3,0.3); pitch+=(wp-pitch)*Math.min(1,dt*1.5);
  const S=Math.min(W,H*1.9)*0.24*size, sx=Math.sign(face||1)*Math.max(0.16,Math.abs(face));
  ctx.save(); ctx.translate(W/2+px, H*0.46+py+Math.sin(t*0.7)*H*0.012*calm); ctx.scale(S*sx,S); ctx.rotate(pitch*Math.sign(face||1)*-1+0);
  ctx.lineJoin='round'; drawWhale(t,beat,bg==='night'); ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
const seg=[['bgBlank','blank'],['bgDay','day'],['bgNight','night']];
for(const [id,v] of seg) document.getElementById(id).addEventListener('click',()=>{ bg=v; for(const [i2,v2] of seg) document.getElementById(i2).setAttribute('aria-pressed',String(v2===v)); });
const stillB=document.getElementById('still'); stillB.addEventListener('click',()=>{ still=!still; stillB.setAttribute('aria-pressed',String(still)); });
</script>
