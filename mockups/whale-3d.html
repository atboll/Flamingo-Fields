<title>Whale 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
/* layout: one screen — a slim title row, the canvas taking all spare height, a wrapping row of controls beneath */
:root{
  --paper:#f6f4ee; --ink:#27303f; --soft:#6d7686; --line:#d6d2c6; --panel:#ece9df; --accent:#3f5f8f;
  --display:"Klee One","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif; --body:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#171b23; --ink:#e6e8ee; --soft:#9aa3b3; --line:#323949; --panel:#1f2530; --accent:#8fb0e6; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#171b23; --ink:#e6e8ee; --soft:#9aa3b3; --line:#323949; --panel:#1f2530; --accent:#8fb0e6; color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:600 20px/1.2 var(--display);margin:0;text-wrap:balance}
header p{margin:0;color:var(--soft);font-size:13px}
#stage{flex:1 1 auto;min-height:260px;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.controls label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);min-width:0}
.controls input[type=range]{width:120px;max-width:38vw;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 10px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--paper)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tog{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
.tog[aria-pressed=true]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
[hidden]{display:none!important}
output{font-variant-numeric:tabular-nums;min-width:2ch;color:var(--ink)}
#slots button{min-width:44px;font-variant-numeric:tabular-nums;color:var(--soft)}
#slots button[data-full]{color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent)}
#slots button[data-cur]{background:var(--accent);color:var(--paper);box-shadow:none}
#curS{font-size:13px;font-weight:600;color:var(--ink)}
#hint,.note{font-size:13px;color:var(--soft)}
.lib{display:flex;flex-wrap:wrap;gap:6px 8px;flex-basis:100%;align-items:center}
.grp{font-size:12px;color:var(--soft);flex-basis:100%;margin-top:2px}
.snd{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.snd button{font:inherit;font-size:12px;padding:6px 9px;border:0;background:transparent;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.snd .pv{border-left:1px solid var(--line);color:var(--accent)}
.snd .pick[aria-pressed=true]{background:var(--accent);color:var(--paper)}
.snd .pv.on{background:var(--accent);color:var(--paper)}
#listtxt{flex:1 1 260px;min-width:0;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
</style>

<header>
  <h1>Whale 3D</h1>
  <p>Make whales from the base humpback: set the markings, save up to ten. Drag the picture to turn it. Nothing here is in the game yet.</p>
</header>
<div id="stage"><canvas id="cv" aria-label="A solid humpback whale that can be turned by dragging"></canvas></div>
<div class="controls">
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="side">Side</button>
    <button type="button" data-view="above">Above</button>
    <button type="button" data-view="below">Below</button>
    <button type="button" data-view="front">Front</button>
    <button type="button" data-view="behind">Behind</button>
  </div>
  <button type="button" class="tog" id="swim" aria-pressed="false">Swim around</button>
  <button type="button" class="tog" id="kidsB" aria-pressed="true">Kids</button>
  <label for="size">Zoom <input id="size" type="range" min="40" max="200" value="100"></label>
  <label for="beat">Tail beat <input id="beat" type="range" min="0" max="200" value="100"></label>
  <div class="seg" role="group" aria-label="Background">
    <button type="button" id="bgBlank" aria-pressed="true">Blank</button>
    <button type="button" id="bgDay" aria-pressed="false">Day sky</button>
    <button type="button" id="bgNight" aria-pressed="false">Night sky</button>
  </div>
</div>
<div class="controls" aria-label="This whale">
  <label for="pat">Pattern <input id="pat" type="range" min="1" max="99" value="12"><output id="patO">12</output></label>
  <label for="str">Strength <input id="str" type="range" min="0" max="100" value="70"></label>
  <label for="pur">Purple <input id="pur" type="range" min="0" max="100" value="60"></label>
  <label for="wsize">Whale size <input id="wsize" type="range" min="4" max="80" value="12"><output id="sizeO">12 kids long</output></label>
  <label for="dots">White dots <input id="dots" type="range" min="0" max="100" value="45"></label>
  <label for="dsz">Dot size <input id="dsz" type="range" min="0" max="100" value="50"></label>
  <label for="knob">Head knobs <input id="knob" type="range" min="0" max="100" value="50"></label>
  <label for="flank">Flank patches <input id="flank" type="range" min="0" max="100" value="40"></label>
  <label for="tailm">Tail edge <input id="tailm" type="range" min="0" max="100" value="35"></label>
  <label for="bspot">Belly spots <input id="bspot" type="range" min="0" max="100" value="30"></label>
  <label for="btint">Belly tint <input id="btint" type="range" min="0" max="100" value="0"><output id="tintO">white</output></label>
  <label for="reach">White reach <input id="reach" type="range" min="0" max="100" value="50"></label>
  <button type="button" class="tog" id="rand">Random</button>
  <button type="button" class="tog" id="calf" aria-pressed="false">Add calf</button>
</div>
<div class="controls" aria-label="This whale's voice">
  <label for="vpitch">Pitch <input id="vpitch" type="range" min="50" max="160" value="100"><output id="vpO">as recorded</output></label>
  <label for="vpause">Pause <input id="vpause" type="range" min="2" max="120" value="10"><output id="vwO">10 s</output></label>
  <label for="vvol">Volume <input id="vvol" type="range" min="0" max="150" value="100"></label>
  <button type="button" class="tog" id="vplay" aria-pressed="false">Play this whale</button>
  <span id="vcount" class="note">0 of 6 sounds</span>
  <div id="lib" class="lib"></div>
</div>
<div class="controls" aria-label="Saved whales">
  <button type="button" class="tog" id="save" aria-pressed="false">Save</button>
  <div class="seg" id="slots" role="group" aria-label="Save slots"></div>
  <button type="button" class="tog" id="list" aria-pressed="false">Show list</button>
  <span id="curS"></span>
  <span id="hint" role="status"></span>
</div>
<div class="controls" id="listbox" hidden>
  <textarea id="listtxt" readonly rows="4" aria-label="The saved whales as text"></textarea>
  <button type="button" class="tog" id="copy">Copy</button>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
let W=0,H=0,DPR=1;
function fit(){ const r=stage.getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2); W=Math.max(50,r.width); H=Math.max(50,r.height); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
new ResizeObserver(fit).observe(stage); fit();
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches?0.35:1;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---- the whale's shape: nose at x=+1, tail stock at x=-1, y up, z out to its sides ---- */
// The same outline as the flat whale: heights above and below a straight line from jaw tip to tail stock, by s (0 nose .. 1 stock).
const PT=[[0,0.012],[0.012,0.03],[0.05,0.054],[0.11,0.08],[0.17,0.098],[0.21,0.108],[0.24,0.112],[0.32,0.13],[0.45,0.15],[0.56,0.142],[0.63,0.14],[0.7,0.112],[0.8,0.07],[0.9,0.04],[1,0.026]];
const PB=[[0,0.012],[0.012,0.05],[0.045,0.11],[0.09,0.17],[0.16,0.235],[0.26,0.288],[0.36,0.27],[0.47,0.215],[0.58,0.16],[0.7,0.105],[0.82,0.06],[0.92,0.036],[1,0.026]];
// New for the solid whale: how wide it is, seen from above. A broad rounded head, widest behind the flippers, a stock that is taller than it is wide.
const PW=[[0,0.035],[0.015,0.07],[0.05,0.112],[0.11,0.15],[0.2,0.186],[0.3,0.203],[0.42,0.194],[0.55,0.155],[0.68,0.1],[0.8,0.052],[0.9,0.025],[0.96,0.021],[1,0.03]];
function prof(T,s){ s=clamp(s,0,1); let k=1; while(k<T.length-1 && T[k][0]<s) k++; const a=T[k-1], b=T[k], p=T[Math.max(0,k-2)], n=T[Math.min(T.length-1,k+1)], u=clamp((s-a[0])/(b[0]-a[0]),0,1);
  const m0=(b[1]-p[1])/(b[0]-p[0])*(b[0]-a[0]), m1=(n[1]-a[1])/(n[0]-a[0])*(b[0]-a[0]), u2=u*u, u3=u2*u;
  return Math.max(0.003,(2*u3-3*u2+1)*a[1]+(u3-2*u2+u)*m0+(-2*u3+3*u2)*b[1]+(u3-u2)*m1); }
const TOP=s=>prof(PT,s), BOT=s=>prof(PB,s), WID=s=>prof(PW,s);
// where the dark back ends and the pale underside begins, as a depth below the middle line (taken from the flat whale)
const mouth=s=>0.006+0.04*Math.pow(Math.sin(clamp(s/0.29,0,1)*Math.PI*0.5),1.3);
const edge=s=>{ if(s<0.258) return mouth(s); const d0=clamp((s-0.258)/0.03,0,1), d=d0*d0*(3-2*d0), low=0.096+0.018*Math.sin(s*14)*clamp((s-0.4)/0.06,0,1)+(s-0.27)*-0.03+Math.pow(clamp((s-0.5)/0.3,0,1),1.5)*0.02; return mouth(s)+(low-mouth(s))*d; };
const palBase=sv=>{ if(sv<=0.56) return edge(sv); const back=BOT(sv)*(0.6-0.3*(sv-0.6)), m=clamp((sv-0.56)/0.1,0,1); const m2=clamp((sv-0.78)/0.13,0,1), top=edge(sv)+(back-edge(sv))*m; return Math.min(top+(BOT(sv)+0.01-top)*m2*m2, BOT(sv)*0.7); };   // unlike the flat whale, a strip of white stays under the stock right to the tail

/* ---- movement: the whole body bends up and down along its length, more toward the tail ---- */
let TB=0, INIT=true;   // tail-beat clock
const spineY=s=>INIT?0:(0.012+0.2*s*s)*Math.sin(TB-s*3.3)*calm;   // laid out straight the first time, so every patch can be told which way is out
const FR=[0,0,0,0,0];   // scratch: the spine's place and its "up" at s
function frame(s){ const y=spineY(s), dy=(spineY(s+0.004)-spineY(s-0.004))/0.008, l=Math.hypot(dy,2); FR[0]=y; FR[1]=dy/l; FR[2]=2/l; }   // up = (FR[1], FR[2]), toward the nose = (FR[2], -FR[1])

/* ---- the mesh: points written fresh every frame, four-cornered patches listed once ---- */
const MV=[]; let vi=0; const QUADS=[];
function put(x,y,z){ MV[vi++]=x; MV[vi++]=y; MV[vi++]=z; return vi/3-1; }
function bent(x,yl,z){ const s=(1-x)/2; frame(s); return put(x+FR[1]*yl, FR[0]+FR[2]*yl, z); }                                   // each point follows the spine where it sits
function bentAt(sr,x,yl,z){ const xr=1-2*sr; frame(sr); return put(xr+FR[2]*(x-xr)+FR[1]*yl, FR[0]-FR[1]*(x-xr)+FR[2]*yl, z); }   // a stiff part follows the spine at its root
const DARK=0, PALE=1;
const FLIP_S=0.34, FLIP_Y=-0.06;   // the flipper's root: where the drawing has it, in the dark of the flank behind and below the eye
// the border as drawn, plus the dark dipping down round the eye into the pale
let RW=null;   // this whale's own reach of the white: {k: -1 a narrow strip .. +1 high up the flank, amp/f/ph: the waviness of its edge}
const palTop=sv=>{ let b=palBase(sv);
  if(RW){ const g=clamp((sv-0.27)/0.1,0,1), gg=g*g*(3-2*g), lowest=BOT(sv)*0.86;
    if(RW.k<0) b+=(Math.max(b,lowest)-b)*(-RW.k)*gg; else b-=b*0.88*RW.k*gg;
    b+=RW.amp*(Math.sin(sv*RW.f+RW.ph)+0.5*Math.sin(sv*RW.f*2.3+RW.ph*1.9))*gg*clamp((0.92-sv)/0.1,0,1);
    b=clamp(b,0.004,Math.max(lowest,palBase(sv)));
    const q=clamp(1-(Math.abs(sv-FLIP_S)-0.035)/0.05,0,1); b=Math.max(b,(-FLIP_Y+0.028)*q*q*(3-2*q));   // the dark always comes down far enough to carry the flipper
  }
  const e=(sv-0.281)/0.026; return e*e<1?Math.max(b,0.048+0.04*Math.sqrt(1-e*e)):b; };
function quad(a,b,c,d,kind,hint,groove,mix){   // hint: roughly which way the patch faces, so the corners get wound the right way
  const P=i=>[MV[i*3],MV[i*3+1],MV[i*3+2]], A=P(a),B=P(b),C=P(c),D=P(d);
  const ux=C[0]-A[0],uy=C[1]-A[1],uz=C[2]-A[2], vx=D[0]-B[0],vy=D[1]-B[1],vz=D[2]-B[2];
  const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
  const mx=(A[0]+B[0]+C[0]+D[0])/4, my=(A[1]+B[1]+C[1]+D[1])/4, mz=(A[2]+B[2]+C[2]+D[2])/4;   // where the patch sits on the straight whale, for the markings
  if(nx*hint[0]+ny*hint[1]+nz*hint[2]<0) QUADS.push([a,d,c,b,kind,groove||null,mix||0,mx,my,mz]); else QUADS.push([a,b,c,d,kind,groove||null,mix||0,mx,my,mz]);
}

const NR=100, K1=7, K2=7, M=2*(K1+K2);
function body(){
  const first=vi/3;
  for(let i=-1;i<=NR+1;i++){
    const s=i<0?-0.003:i>NR?1.004:Math.pow(i/NR,1.2), cap=(i<0||i>NR)?0.02:1, sc=clamp(s,0,1);
    const t=TOP(sc)*cap, b=BOT(sc)*cap, w=WID(sc)*cap, tb=Math.acos(clamp(-palTop(sc)/BOT(sc),-1,0));
    for(let j=0;j<M;j++){
      const side=j<=K1+K2?1:-1, jj=side>0?j:M-j;   // down the right side, back up the left
      const th=jj<=K1? tb*jj/K1 : tb+(Math.PI-tb)*(jj-K1)/K2, c=Math.cos(th);
      bent(1-2*s, c>0?t*c:b*c, side*w*Math.sin(th));
    }
  }
  if(!INIT) return;
  for(let i=0;i<NR+2;i++) for(let j=0;j<M;j++){
    const a=first+i*M+j, b=first+i*M+(j+1)%M, c=first+(i+1)*M+(j+1)%M, d=first+(i+1)*M+j;
    const pale=j>=K1 && j<K1+2*K2, s=Math.pow(clamp((i-0.5)/NR,0,1),1.2);
    const row=r=>r>K1 && r<K1+2*K2 && s>0.012 && s<0.68;   // throat grooves run along the lines between pale patches
    const cy=(MV[a*3+1]+MV[c*3+1])/2, cz=(MV[a*3+2]+MV[c*3+2])/2;
    const g=[]; if(row(j+1)) g.push(b,c,(j+1)%M); if(row(j)) g.push(a,d,j);   // each groove line remembers which row it is, so it can end at its own place
    quad(a,b,c,d,pale?PALE:DARK,[i===0?0.4:i>NR?-0.4:0,cy,cz],g.length?g:null); QUADS[QUADS.length-1][10]=s;
  }
}
// a thin lens-shaped blade through a row of stations, each with a leading point A, a trailing point B, an "up" n and a half thickness
function blade(st,kTop,kBot,map){   // stations may carry "rim": a pale edge strip of that share of the width, on the dark face too
  const rimmed=st[0].rim!==undefined, Mx=rimmed?6:4, first=vi/3;
  for(const q of st){ const r=rimmed?clamp(q.rim,0.001,0.3):0, US=rimmed?[0,r,0.25,0.5,0.75,1-r,1]:[0,0.25,0.5,0.75,1];
    for(let side=1;side>=-1;side-=2) for(let m=0;m<=Mx;m++){
      const u=US[m], bulge=Math.pow(Math.sin(Math.PI*u),0.7)*q.t*side;
      map(q.A[0]+(q.B[0]-q.A[0])*u+q.n[0]*bulge, q.A[1]+(q.B[1]-q.A[1])*u+q.n[1]*bulge, q.A[2]+(q.B[2]-q.A[2])*u+q.n[2]*bulge);
    } }
  if(!INIT) return;
  const row=2*(Mx+1);
  for(let k=0;k<st.length-1;k++) for(let side=0;side<2;side++) for(let m=0;m<Mx;m++){
    const o=first+k*row+side*(Mx+1)+m, n=st[k].n, sg=side?-1:1, mix=((st[k].mix||0)+(st[k+1].mix||0))/2, edge=rimmed && !side && (m===0||m===Mx-1);
    quad(o,o+1,o+row+1,o+row,side?kBot:edge?PALE:kTop,[n[0]*sg,n[1]*sg,n[2]*sg],null,(side||edge)?mix:0);
  }
}
const norm=v=>{ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; };
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
// The flipper's outline, traced from the reference picture: how far its front and back edges lie from a straight middle line,
// as fractions of its length, from the body (0) to the tip (1). Broadest in the upper part, narrowing in a step, the front edge
// then swinging round the end to meet the back edge, so the tip leans toward the tail.
const FF=[[0,0.07],[0.12,0.096],[0.3,0.132],[0.45,0.138],[0.6,0.128],[0.68,0.114],[0.78,0.084],[0.87,0.04],[0.94,-0.012],[0.985,-0.062],[1,-0.097]];   // the outer third of the front edge is cut away in a curve back to the tip
const FB=[[0,-0.08],[0.15,-0.106],[0.3,-0.128],[0.45,-0.126],[0.6,-0.114],[0.8,-0.102],[0.92,-0.099],[0.975,-0.1],[1,-0.094]];
function prof2(T,s){ let k=1; while(k<T.length-1 && T[k][0]<s) k++; const a=T[k-1], b=T[k], p=T[Math.max(0,k-2)], n=T[Math.min(T.length-1,k+1)], u=clamp((s-a[0])/(b[0]-a[0]),0,1);
  const m0=(b[1]-p[1])/(b[0]-p[0])*(b[0]-a[0]), m1=(n[1]-a[1])/(n[0]-a[0])*(b[0]-a[0]), u2=u*u, u3=u2*u;
  return (2*u3-3*u2+1)*a[1]+(u3-2*u2+u)*m0+(-2*u3+3*u2)*b[1]+(u3-u2)*m1; }
function flipper(sg,t){
  const xr=1-2*FLIP_S, zr=WID(FLIP_S)*Math.sqrt(1-Math.pow(FLIP_Y/BOT(FLIP_S),2));
  let c=[xr,FLIP_Y,sg*zr*0.8]; const S=56, L=0.7, st=[], ph=t*1.25+(sg>0?0:0.9);
  for(let k=0;k<=S;k++){ const u=1-Math.pow(1-k/S,1.6), un=1-Math.pow(1-Math.min(1,(k+1)/S),1.6);   // stations crowd toward the tip so the end comes out round
    const flap=Math.sin(ph-u*1.3)*calm;                                 // a slow stroke up and down that runs out along the flipper
    const be=0.78+0.8*Math.pow(u,2.2)+0.06*Math.sin(ph*0.5)*calm, out=0.45+0.45*flap*(0.35+0.65*u);   // swept back at the picture's angle, curving further back toward the tip
    const dir=norm([-Math.sin(be),-Math.cos(be),sg*out]);
    const dx=dir[0], ch=norm([1-dx*dx,-dx*dir[1],-dx*dir[2]]); let n=cross(dir,ch); if(n[1]*0.4+n[2]*sg<0) n=[-n[0],-n[1],-n[2]];   // the dark face is the outer one
    const kn=clamp((u-0.45)/0.15,0,1)*clamp((0.98-u)/0.06,0,1);
    const fr=(prof2(FF,u)+0.007*Math.sin(u*46)*kn)*L, bk=(prof2(FB,u)+0.004*Math.sin(u*38+1)*kn)*L, wd=Math.max(0,fr-bk), rw=0.02*clamp((u-0.06)/0.16,0,1);   // small knobs only along the outer part
    const root=Math.pow(clamp(1-u/0.24,0,1),2), m=clamp((u-0.1)/0.16,0,1);

}
function pass(w,P){

      ctx.save(); ctx.transform((fw[0]-p[0])/0.02,(fw[1]-p[1])/0.02,(up[0]-p[0])/0.02,(up[1]-p[1])/0.02,p[0],p[1]);
      ctx.fillStyle=E[6]==='d'?(night?'#232658':'#33377a'):E[6]==='w'?(night?'#dfe6f2':'#ffffff'):E[6]==='k'?(night?'#5b6090':'#7d83b0'):(night?'#3a3f6a':'#474c7c');

    if(it[1]<0){   // the eye, drawn lying on the skin: a dark almond with a fine pale rim, a soft paler lid round it and two creases arching over it
      const E=it[2], S=i=>{ const k=E[i]*3, z=SV[k+2]; return [cx+SV[k]*f/z, cy-SV[k+1]*f/z]; }, p=S(0), fw=S(2), up=S(3), R=0.014;   // (the three points are 0.02 apart on the whale itself, so the drawing scales with it)

const SND=[]; for(let i=0;i<7;i++) SND.push({id:'b'+i,name:'Big '+i,file:'whale_big_'+i+'.mp3',grp:'Big whale calls'}); for(let i=0;i<14;i++) SND.push({id:'s'+i,name:'Singing '+i,file:'whale_sing_'+i+'.mp3',grp:'Singing'});
let AC=null, cur=null, curG=null, curBtn=null, looping=false, loopT=0, lastSnd=null; const BUF={};
function ac(){ if(!AC){ const C=window.AudioContext||window.webkitAudioContext; AC=new C(); } if(AC.state==='suspended') AC.resume(); return AC; }

function stopAll(){ looping=false; clearTimeout(loopT); stopSnd(); const b=document.getElementById('vplay'); if(b){ b.setAttribute('aria-pressed','false'); b.textContent='Play this whale'; } }
function playSnd(id,then,btn){ const a=ac(); loadSnd(id).then(buf=>{ stopSnd(); const src=a.createBufferSource(), g=a.createGain(); src.buffer=buf; src.playbackRate.value=cfg.sp/100; g.gain.value=cfg.sv/100; src.connect(g); g.connect(a.destination);

  playSnd(id,()=>{ if(looping) loopT=setTimeout(loopNext,cfg.sw*1000*(0.8+0.4*Math.random())); },document.querySelector('.pv[data-id="'+id+'"]')); }
let curSlot=-1;   // which slot the whale on show came from, if any
const KEYS=['p','s','u','z','c','d','ds','k','f','t','bs','bt','wr','sp','sw','sv'];

{ const lib=document.getElementById('lib'); let grp='';
  for(const x of SND){ if(x.grp!==grp){ grp=x.grp; const h=document.createElement('span'); h.className='grp'; h.textContent=grp+' (tick up to six for this whale, ▶ to listen)'; lib.appendChild(h); }

  document.getElementById('vplay').addEventListener('click',()=>{ const b=document.getElementById('vplay'); if(looping){ stopAll(); return; }

const $=id=>document.getElementById(id), IN={p:'pat',s:'str',u:'pur',z:'wsize',d:'dots',ds:'dsz',k:'knob',f:'flank',t:'tailm',bs:'bspot',bt:'btint',wr:'reach',sp:'vpitch',sw:'vpause',sv:'vvol'};

function slotRow(){ const row=$('slots'); row.textContent='';
