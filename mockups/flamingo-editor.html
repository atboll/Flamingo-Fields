<title>Flamingo Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
/* layout: one screen — a slim title row, the canvas taking all spare height, a wrapping row of controls beneath */
:root{
  --paper:#f6f4ee; --ink:#27303f; --soft:#6d7686; --line:#d6d2c6; --panel:#ece9df; --accent:#3f5f8f;
  --display:"Klee One","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif; --body:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#171b23; --ink:#e6e8ee; --soft:#9aa3b3; --line:#323949; --panel:#1f2530; --accent:#8fb0e6; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#171b23; --ink:#e6e8ee; --soft:#9aa3b3; --line:#323949; --panel:#1f2530; --accent:#8fb0e6; color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:12px;box-sizing:border-box}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:600 20px/1.2 var(--display);margin:0;text-wrap:balance}
header p{margin:0;color:var(--soft);font-size:13px}
#stage{flex:1 1 auto;min-height:260px;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.controls label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--soft);min-width:0}
.controls input[type=range]{width:120px;max-width:38vw;accent-color:var(--accent)}
.seg{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;padding:6px 10px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--paper)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tog{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
.tog[aria-pressed=true]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
[hidden]{display:none!important}
output{font-variant-numeric:tabular-nums;min-width:2ch;color:var(--ink)}
#slots button{min-width:44px;font-variant-numeric:tabular-nums;color:var(--soft)}
#slots button[data-full]{color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--accent)}
#slots button[data-cur]{background:var(--accent);color:var(--paper);box-shadow:none}
#curS{font-size:13px;font-weight:600;color:var(--ink)}
#hint,.note{font-size:13px;color:var(--soft)}
.lib{display:flex;flex-wrap:wrap;gap:6px 8px;flex-basis:100%;align-items:center}
.grp{font-size:12px;color:var(--soft);flex-basis:100%;margin-top:2px}
.snd{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.snd button{font:inherit;font-size:12px;padding:6px 9px;border:0;background:transparent;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.snd .pv{border-left:1px solid var(--line);color:var(--accent)}
.snd .pick[aria-pressed=true]{background:var(--accent);color:var(--paper)}
.snd .pv.on{background:var(--accent);color:var(--paper)}
#listtxt{flex:1 1 260px;min-width:0;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px;resize:vertical}
</style>
<header>
  <h1>Flamingo Editor</h1>
  <p>The game's own flamingo, in every pose, next to a reference picture. Drag the picture to turn the bird. Nothing here changes the game yet.</p>
</header>
<div id="stage"><canvas id="cv" aria-label="The game's flamingo, which can be turned by dragging"></canvas></div>
<div class="controls" aria-label="Pose">
  <div class="seg" role="group" aria-label="Pose">
    <button type="button" data-pose="stand">Standing</button>
    <button type="button" data-pose="rest">One leg</button>
    <button type="button" data-pose="feed">Feeding</button>
    <button type="button" data-pose="walk">Walking</button>
    <button type="button" data-pose="run">Running</button>
    <button type="button" data-pose="open">Wings opening</button>
    <button type="button" data-pose="fly">Flying</button>
    <button type="button" data-pose="far">Far away</button>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button type="button" data-view="side">Side</button>
    <button type="button" data-view="front">Front</button>
    <button type="button" data-view="behind">Behind</button>
    <button type="button" data-view="below">Below</button>
  </div>
</div>
<div class="controls" aria-label="Looking">
  <label for="zoom">Zoom <input id="zoom" type="range" min="40" max="220" value="100"></label>
  <label for="spd">Speed <input id="spd" type="range" min="0" max="200" value="100"></label>
  <button type="button" class="tog" id="kidsB" aria-pressed="true">Kids</button>
  <div class="seg" role="group" aria-label="Background">
    <button type="button" id="bgBlank" aria-pressed="true">Blank</button>
    <button type="button" id="bgDay" aria-pressed="false">Day sky</button>
    <button type="button" id="bgNight" aria-pressed="false">Night sky</button>
  </div>
</div>
<div class="controls" aria-label="Reference picture">
  <div class="seg" role="group" aria-label="Reference">
    <button type="button" id="refOff" aria-pressed="false">No picture</button>
    <button type="button" id="refSide" aria-pressed="true">Picture beside</button>
    <button type="button" id="refOver" aria-pressed="false">Picture over the bird</button>
  </div>
  <label for="refA">Picture strength <input id="refA" type="range" min="10" max="100" value="100"></label>
  <label for="refS">Picture size <input id="refS" type="range" min="40" max="200" value="100"></label>
  <label class="tog" for="refFile" style="cursor:pointer">Add your own picture<input id="refFile" type="file" accept="image/*" style="position:absolute;width:1px;height:1px;opacity:0"></label>
  <span id="hint" role="status"></span>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
let W=0,H=0,DPR=1;
function fit(){ const r=stage.getBoundingClientRect(); DPR=Math.min(window.devicePixelRatio||1,2); W=Math.max(50,r.width); H=Math.max(50,r.height); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); }
new ResizeObserver(fit).observe(stage); fit();
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches?0.4:1;

/* ---- what the game's flamingo code expects to find around it ---- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function h2(i,j){ let n=(Math.imul(i,374761393)+Math.imul(j,668265263))|0; n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; }
let time=0, rgtX=1, rgtZ=0, fwdX=0, fwdZ=1, camY=0, focal=600, lowFx=false;
const flock={dx:0,dz:1}, BIRD_PH=[1.3];

/* ---- the flamingo, exactly as index.html draws it (copied from the game by the build script; do not edit here) ---- */
function drawBird(o,sx,sy,s){   // o: {hx,hz heading, ph, id, y absolute height, sc size}
  const cfx=o.hx*rgtX+o.hz*rgtZ, cfz=o.hx*fwdX+o.hz*fwdZ, S=(o.tiny?s:Math.max(s,0.17))*(o.sc||1.9), ph=o.ph;
  // seen a little from above (or from below when the camera is under the flock), so the wing surfaces show instead of lying edge-on
  const elev=clamp(Math.atan2(camY-o.y,Math.max(200,focal/s)),-0.7,0.7)+0.3, ce=Math.cos(elev), se=Math.sin(elev);
  const roll=o.roll||0, cr=Math.cos(roll), sr=Math.sin(roll);
  const P=(lat0,fwd,up0)=>{ const lat=lat0*cr+up0*sr, up=up0*cr-lat0*sr, d=-lat*cfx+fwd*cfz, k=S*(1-0.0065*d); return [sx+(lat*cfz+fwd*cfx)*k, sy-(up*ce+d*se)*k]; };
  const ln=(pts,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,w*S); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke(); };
  const poly=(pts,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.closePath(); ctx.fill(); };
  const dot=(p,r,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(0.7,r*S),0,7); ctx.fill(); };
  const DARK='#2a1e24';
  // Wingbeat. Each bird keeps its own tempo; the down-stroke is quicker than the up-stroke; now and then a bird rests on a short glide.
  const glide=clamp((Math.sin(time*0.37+ph*3.1)-0.82)/0.12,0,1), beat=time*4.2*(0.92+0.16*h2(o.id,3))+ph, phi=beat+0.4*Math.sin(beat);
  // The body rides the wingbeat (up as the wings come down) while the head holds level, as a real bird's does; the neck takes up the difference.
  const bob=-Math.sin(phi)*2.6*(1-glide), sway=Math.sin(time*0.9+ph*2)*0.7;
  // The wing is four jointed parts: upper arm, forearm, hand and tip. Each joint follows the one before it a moment later,
  // so the beat travels out along the wing; on the up-stroke the outer parts fold, and the black flight feathers close up, then spread on the way down.
  // Unfolding from closed to full spread happens in three moves: the upper arm swings out from the body, then the forearm
  // straightens, then the hand opens and the flight feathers fan out. Folding runs the same three moves backwards.
  const open=o.open===undefined?1:o.open, ss=(a,b)=>{ const t=clamp((open-a)/(b-a),0,1); return t*t*(3-2*t); };
  const OP=[ss(0,0.42),ss(0.3,0.72),ss(0.58,1),ss(0.58,1)], FOLD=[-0.9,0.75,-0.95,-0.6], chord=0.4+0.6*(OP[0]+OP[1]+OP[2])/3;
  const amp=(1-0.82*glide)*OP[2], down=clamp(-Math.cos(phi),0,1)*amp, upst=clamp(Math.cos(phi),0,1)*amp, SEG=[16,15,14,13];
  const ang=[0,1,2,3].map(k=>Math.sin(phi-0.38*k)*(0.46+0.2*k)*amp+0.12*glide-upst*0.16*k);
  const wing=sd=>{
    const far=(-sd*cfx>0), base=far?'#ee8fb0':'#fbbccd', sec1=far?'#c93c6c':'#e8477a', sec2=far?'#d9578a':'#f0709a';
    const xs=[3], us=[2+bob], fs=[0];
    for(let k=0;k<4;k++){ const e=OP[k]; xs.push(xs[k]+SEG[k]*Math.cos(ang[k])*e); us.push(us[k]+SEG[k]*Math.sin(ang[k])*e); fs.push(fs[k]+SEG[k]*FOLD[k]*(1-e)*0.55); }   // a closed part lies folded along the body
    // a point on the wing: t runs 0..4 along the four parts, f is how far forward of the spar it sits
    const Wp=(t,f)=>{ const k=Math.min(3,Math.floor(t)), r=t-k; return P(sd*(xs[k]+(xs[k+1]-xs[k])*r), f*chord+fs[k]+(fs[k+1]-fs[k])*r, us[k]+(us[k+1]-us[k])*r); };
    poly([Wp(0,9),Wp(1,8.5),Wp(2,7.5),Wp(2,-4),Wp(1,-4.5),Wp(0,-5)],base);                      // coverts on the arm
    for(let j=0;j<7;j++){ const t0=j*2/7, t1=(j+1)*2/7; poly([Wp(t0,-4),Wp(t1,-4),Wp(t1,-15),Wp((t0+t1)/2,-17.5),Wp(t0,-14.5)], j%2?sec2:sec1); }   // crimson secondaries, scalloped
    poly([Wp(2,7.5),Wp(3,5.5),Wp(3.3,3.5),Wp(3.1,-2.5),Wp(2,-4)],base);                         // coverts on the hand
    ctx.shadowColor='rgba(42,30,36,.85)'; ctx.shadowBlur=lowFx?0:clamp(5*S,2,9);                       // soft, slightly blurred edges on the black feathers
    for(let j=0;j<8;j++){ const tr=2.05+j*0.13, tt=Math.min(4,2.5+j*0.215), ft=(-17+j*2.1)*(0.72+0.5*down)*(0.35+0.65*OP[3]);   // black primaries fanning to the tip
      poly([Wp(tr,0.5),Wp(tr+0.12,-1.5),Wp(Math.min(4,tt+0.1),ft-1.7),Wp(tt,ft)],'rgba(42,30,36,.8)'); }
    ctx.shadowBlur=0;
    ln([Wp(0,9),Wp(1,8.5),Wp(2,7.5),Wp(3,5.5),Wp(3.3,3.5)], far?'#f09ab0':'#ffd3dc',1.1);       // light leading edge
    for(let j=1;j<6;j++) ln([Wp(j/3,6.5),Wp(j/3,-3)], far?'#d6688a':'#ee8fa6',0.5);             // rows of covert feathers
  };
  const legs=()=>{ for(const o of [-1.4,1.4]){                                                  // held straight; only the hips ride the body
    const hp=P(o,-9,-2+bob), kn=P(o,-27,-2.4+bob*0.6), ft=P(o,-44,-2.2+bob*0.3);
    ln([hp,kn],'#ee5f8c',1.6); dot(kn,1.15,'#dc4c7c'); ln([kn,ft],'#ee5f8c',1.35);
    poly([P(o-1.7,-44,-2.2+bob*0.3),P(o+1.7,-44,-2.2+bob*0.3),P(o,-48.5,-2.5+bob*0.25)],'#d0406f'); } };
  const body=()=>{
    const tail=()=>poly([P(-3.6,-8,1.5+bob),P(3.6,-8,1.5+bob),P(1.6,-19,0.8+bob*0.8),P(0,-22,1+bob*0.75),P(-1.6,-19,0.8+bob*0.8)],'#e2557f');
    if(cfz<=0) tail();
    { const a=P(0,-10.5,0.2+bob), b=P(0,11,0.9+bob), cx=(a[0]+b[0])/2, cy=(a[1]+b[1])/2, L=Math.hypot(b[0]-a[0],b[1]-a[1])/2, rot=Math.atan2(b[1]-a[1],b[0]-a[0]), w=5.6*S, R=Math.max(L,w);   // a full rounded body, darker along the belly
      const el=(dy,k,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(cx,cy+dy*S,R*k,w*k,rot,0,7); ctx.fill(); };
      el(1.3,1,'#e46f99'); el(-0.5,0.96,'#f58fb0'); }
    ln([P(0,-5,2.9+bob),P(0,7,3.4+bob)],'#fcc6d5',3.2);                                                    // the pale back
    if(cfz>0) tail();                                                                           // flying away: the tail is the nearest part of the body
  };
  const neck=()=>{
    { const cl=[0,sway*0.5,sway,sway*0.4], cf=[9,18,27,35.5], cu=[1.5+bob,5.2+bob*0.62,4.2+bob*0.25,2.7], pts=[];   // one smooth line, stretched out ahead
      for(let i=0;i<=9;i++){ const t=i/9, a=(1-t)*(1-t)*(1-t), b=3*(1-t)*(1-t)*t, c=3*(1-t)*t*t, d=t*t*t; pts.push(P(b*cl[1]+c*cl[2]+d*cl[3], a*cf[0]+b*cf[1]+c*cf[2]+d*cf[3], a*cu[0]+b*cu[1]+c*cu[2]+d*cu[3])); }
      ln(pts,'#f48aab',3.5); ln(pts.slice(3),'#fbbdcd',1.3); }
    const h=P(0,37.5,2.8), hk=1-0.0065*37.5*cfz;
    const bill=()=>{ ln([P(0,39.4,2.7),P(0,42.4,2.6),P(0,44.6,1.9)],'#fbe3da',3.3*hk); ln([P(0,44.6,1.9),P(0,46.1,0.6),P(0,45.5,-1.5)],DARK,2.4*hk); };   // pale bill hooking down to a black tip
    if(cfz>0.15){ if(cfz<0.72) bill(); dot(h,3.4*hk,'#f58fb0'); }                               // from behind: the bill is hidden past the head and no eyes show
    else { dot(h,3.3*hk,'#f79bb8'); for(const o of [-1.7,1.7]){ const e=P(o,38.6,3.5); dot(e,1*hk,'#fff3c8'); dot(e,0.5*hk,DARK); } bill(); }
    if(Math.abs(cfx)>0.35 && cfz>-0.6 && S>0.3) dot(P(-far*1.9,38.2,3.7),0.75*hk,DARK);        // the eye, seen from the side
  };
  const far=cfx>0?-1:1;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(cfz>0){ neck(); wing(far); body(); wing(-far); legs(); } else { legs(); wing(far); body(); wing(-far); neck(); }
}
function drawBirdFar(i,sx,sy,s){   // a far-off bird: a pink stroke for the body and two flapping wing strokes, all pink
  const cfx=flock.dx*rgtX+flock.dz*rgtZ, cfz=flock.dx*fwdX+flock.dz*fwdZ, S=s*1.9, ph=BIRD_PH[i];
  const beat=time*4.2*(0.92+0.16*h2(i,3))+ph, a=Math.sin(beat+0.4*Math.sin(beat))*0.75, lw=Math.max(1,2.6*S);
  const P=(lat,fwd,up)=>[sx+(lat*cfz+fwd*cfx)*S, sy-(up*0.95+(-lat*cfx+fwd*cfz)*0.3)*S];
  ctx.lineCap='round'; ctx.lineWidth=lw;
  ctx.strokeStyle='#ee8ba3'; ctx.beginPath(); let p=P(0,-44,-2), q=P(0,44,2); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
  for(const sd of [-1,1]){ const m=P(sd*34*Math.cos(a),-2,34*Math.sin(a)), t=P(sd*58*Math.cos(a*1.2),-6,58*Math.sin(a*1.2)); p=P(sd*3,0,2);
    ctx.strokeStyle='#f39bb0'; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(m[0],m[1]); ctx.stroke();
    ctx.strokeStyle='#e9879f'; ctx.beginPath(); ctx.moveTo(m[0],m[1]); ctx.lineTo(t[0],t[1]); ctx.stroke(); }
}
function drawBirdWalk(m,sx,sy,s){   // a companion on the ground: long legs striding through the grass, wings folded, neck up (stretched forward at a run)
  const cfx=m.hx*rgtX+m.hz*rgtZ, cfz=m.hx*fwdX+m.hz*fwdZ, S=(m.beach?s:Math.max(s,0.17))*1.08, ce=Math.cos(0.14), se=Math.sin(0.14), DARK='#2a1e24';
  const P=(lat,fwd,up)=>{ const d=-lat*cfx+fwd*cfz, k=S*(1-0.0065*d); return [sx+(lat*cfz+fwd*cfx)*k, sy-(up*ce+d*se)*k]; };
  const ln=(pts,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,w*S); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke(); };
  const dot=(p,r,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(0.7,r*S),0,7); ctx.fill(); };
  const run=clamp(m.sp/300,0,1), mv=Math.min(1,m.sp/40), wp=m.wp, bob=Math.abs(Math.sin(wp))*1.6*mv;
  const poly=(pts,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.closePath(); ctx.fill(); };
  // A flamingo leg has four parts: a short feathered thigh, the long shin, the long lower leg below the backward-bending
  // ankle (the joint that looks like a knee), and a webbed foot. The foot is planted while it carries weight, then lifts, folds and swings through.
  const lerp=(a,b,t)=>a+(b-a)*t, HOT='#e8477a', MID='#f58fb0', PALE='#fcc6d5';
  const ell=(c,rx,ry,rot,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(c[0],c[1],Math.max(0.6,rx),Math.max(0.6,ry),rot,0,7); ctx.fill(); };
  const leg=sd=>{
    const p2=wp+(sd>0?Math.PI:0), stride=(7+12*run)*mv, sw=Math.sin(p2)*stride, swing=Math.max(0,Math.cos(p2)), lift=swing*(3+9*run)*mv;
    const farLeg=(-sd*cfx>0), c1=farLeg?'#d64a78':'#ee5f8c', c2=farLeg?'#c23a69':'#dc4c7c', x=sd*1.7;
    const R=sd===(m.restSide||1)?(m.rest||0):0, Re=R*R*(3-2*R);                                // resting: this leg is drawn up and tucked under the body
    const hipF=-1, hipU=35+bob, kneeF=lerp(hipF+2.2+sw*0.12,2.6,Re), kneeU=lerp(hipU-6.5,28,Re);
    const fF=lerp(sw,-7.5,Re), fU=lerp(lift,26.5,Re);
    const ankF=lerp((kneeF+sw)/2-(3.5+lift*0.9+2*run),-4.2,Re), ankU=lerp((kneeU+lift)/2+1+lift*0.35,30.8,Re);   // the ankle folds backward as the foot lifts
    const hip=P(x,hipF,hipU), knee=P(x,kneeF,kneeU), ank=P(x,ankF,ankU), foot=P(x,fF,fU);
    ln([hip,knee],farLeg?'#e2729a':'#f48aab',3.4);                                             // feathered thigh
    ln([knee,ank],c1,1.6); ln([ank,foot],c1,1.35); dot(knee,1.15,c2); dot(ank,1.3,c2);
    const tf=lerp(4.6-swing*3.2*mv,1.6,Re), tu=lerp(-swing*3.4*mv,-3.2,Re);                    // toes point forward on the ground and hang when lifted
    const t0=P(x,fF+tf,fU+tu), t1=P(x-1.9,fF+tf*0.8,fU+tu*0.8), t2=P(x+1.9,fF+tf*0.8,fU+tu*0.8);
    poly([foot,t1,t0,t2],'#d0406f'); ln([foot,t0],c2,0.8); ln([foot,P(x,fF-1.6,fU+0.4)],c2,0.9);   // webbed toes and a small back toe
  };
  // The folded wing lies along the flamingo's side as one pale shape, rounded over the back and cut into pointed feathers along its

let refImg=new Image(); refImg.src=REF0;
let pose='rest', yaw=-1.95, pitch=0.1, yawTo=null, pitchTo=null, bg='blank', kidsOn=true, refMode='side', T=0, wp=0, last=0;
const $=id=>document.getElementById(id);
const VIEWS={side:[-1.5708,0.05], front:[3.1416,0.05], behind:[0,0.05], below:[-1.5708,-0.7]};
function drawBg(){
  if(bg==='blank'){ ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--paper'); ctx.fillRect(0,0,W,H); return; }
  const g=ctx.createLinearGradient(0,0,0,H);
  if(bg==='day'){ g.addColorStop(0,'#8fc3e8'); g.addColorStop(0.6,'#cfe6f2'); g.addColorStop(1,'#f4efe2'); } else { g.addColorStop(0,'#0c1030'); g.addColorStop(0.7,'#232a5c'); g.addColorStop(1,'#3a3f74'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function tick(now){ const dt=Math.min(0.05,(now-last)/1000||0), sp=+$('spd').value/100; last=now; T+=dt; time+=dt*sp;
  if(yawTo!==null){ const k=1-Math.exp(-dt*6); let d=yawTo-yaw; d=Math.atan2(Math.sin(d),Math.cos(d)); yaw+=d*k; pitch+=(pitchTo-pitch)*k; if(Math.abs(d)<0.002 && Math.abs(pitchTo-pitch)<0.002) yawTo=null; }
  ctx.setTransform(DPR,0,0,DPR,0,0); drawBg();
  const zoom=+$('zoom').value/100, air=pose==='fly'||pose==='open'||pose==='far';
  const side=refMode==='side' && refImg.complete && refImg.naturalWidth>0, bx=side?W*(kidsOn&&!air?0.42:0.34):W*(kidsOn&&!air?0.58:0.5);     // the bird moves left to make room for the picture
  const s=zoom*Math.min(W*(side?0.5:0.9),H*1.25)/(air?215:(kidsOn?165:130)), gy=H*0.86, hx=Math.sin(yaw), hz=Math.cos(yaw);
  // the reference picture, beside the bird or laid over it
  if(refMode!=='off' && refImg.complete && refImg.naturalWidth>0){ const k=+$('refS').value/100, ih=H*0.84*k, iw=ih*refImg.naturalWidth/refImg.naturalHeight;
    ctx.globalAlpha=(+$('refA').value/100)*(refMode==='over'?0.55:1); ctx.drawImage(refImg, (side?W*0.74:bx)-iw/2, (refMode==='over'?gy-ih*0.9:H*0.5-ih/2), iw, ih); ctx.globalAlpha=1; }
  if(!air){ ctx.fillStyle='rgba(20,24,50,0.12)'; ctx.beginPath(); ctx.ellipse(bx,gy,26*s,3.2*s,0,0,6.2832); ctx.fill(); }   // a little shadow where it stands
  if(pose==='fly' || pose==='open'){ const D=Math.max(200,focal/s); camY=Math.tan(clamp(pitch-0.3,-0.69,0.69))*D;
    drawBird({hx,hz,ph:1.3,id:51,y:0,sc:1.3,open:pose==='open'?0.5+0.5*Math.sin(time*0.8):1,roll:0,tiny:true}, bx, H*0.5, s); }
  else if(pose==='far'){ flock.dx=hx; flock.dz=hz; drawBirdFar(0, bx, H*0.5, s*0.68); }
  else { const v=pose==='walk'?70:pose==='run'?300:0; wp+=dt*sp*(2+v*0.035)*(v>10?1:0);
    drawBirdWalk({hx,hz,ph:1.3,id:51,sp:v,wp, feed:pose==='feed'?1:0, rest:pose==='rest'?1:0, restSide:1, beach:true}, bx, gy, s); }
  if(kidsOn && !air){ const hk=98*s;   // the kids at their true size beside it: the big one is 98 high, a standing flamingo about 77
    for(let i=0;i<2;i++){ const im=KIDIMG[i]; if(!im.complete || !im.naturalWidth) continue; const kk=KIDS[i], scl=hk/KIDS[0].h*(i?1/1.15:1), w=kk.w*scl, h=kk.h*scl, x=bx-34*s-(i?0.5:0.98)*hk; ctx.drawImage(im,x,gy-h,w,h); } }
  requestAnimationFrame(tick); }
requestAnimationFrame(tick);

let dragging=false, lx=0, ly=0;
cv.addEventListener('pointerdown',e=>{ dragging=true; lx=e.clientX; ly=e.clientY; yawTo=null; cv.classList.add('drag'); try{ cv.setPointerCapture(e.pointerId); }catch(_){} mark('view',null); });
cv.addEventListener('pointermove',e=>{ if(!dragging) return; yaw+=(e.clientX-lx)*0.01; pitch=clamp(pitch+(e.clientY-ly)*0.008,-0.7,1); lx=e.clientX; ly=e.clientY; });
const up=()=>{ dragging=false; cv.classList.remove('drag'); }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
function mark(kind,v){ document.querySelectorAll('[data-'+kind+']').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset[kind]===v))); }
document.querySelectorAll('[data-pose]').forEach(b=>b.addEventListener('click',()=>{ pose=b.dataset.pose; mark('pose',pose); }));
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{ const v=VIEWS[b.dataset.view]; yawTo=v[0]; pitchTo=v[1]; mark('view',b.dataset.view); }));
mark('pose',pose); mark('view',null);
$('kidsB').addEventListener('click',()=>{ kidsOn=!kidsOn; $('kidsB').setAttribute('aria-pressed',String(kidsOn)); });
const bgs={blank:'bgBlank',day:'bgDay',night:'bgNight'}; for(const k in bgs) $(bgs[k]).addEventListener('click',()=>{ bg=k; for(const j in bgs) $(bgs[j]).setAttribute('aria-pressed',String(j===k)); });
const refs={off:'refOff',side:'refSide',over:'refOver'}; for(const k in refs) $(refs[k]).addEventListener('click',()=>{ refMode=k; for(const j in refs) $(refs[j]).setAttribute('aria-pressed',String(j===k)); });
$('refFile').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ const im=new Image(); im.onload=()=>{ refImg=im; $('hint').textContent='Showing your picture. It stays only until you close the page.'; if(refMode==='off') $('refSide').click(); }; im.onerror=()=>{ $('hint').textContent='That file could not be shown as a picture.'; }; im.src=r.result; };
  r.readAsDataURL(f); });
