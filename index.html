<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Flamingo Fields</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed painted scene; a quiet title top-left and a hint pill at the bottom, nothing else. */
:root{
  --sky-deep:#1f7f8c;
  --sky-warm:#f7d894;
  --wheat:#d9a531;
  --wheat-shade:#7a4c0e;
  --ink:#3a2a12;
  --paper:#fff6dc;
  --font-display:"Klee One","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--wheat-shade);color:var(--ink);font-family:var(--font-display);overflow:hidden}
#stage{position:relative;width:100%;height:100%}
#field{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:crosshair}
#field:focus-visible{box-shadow:inset 0 0 0 3px var(--paper)}
.name{position:absolute;left:20px;top:16px;margin:0;font-size:1.5rem;font-weight:600;letter-spacing:.04em;color:var(--paper);text-shadow:0 1px 10px rgba(20,70,80,.55);pointer-events:none}
.hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;margin:0;padding:8px 16px;border-radius:18px;background:rgba(58,42,18,.62);color:var(--paper);font-size:.95rem;text-align:center;pointer-events:none;transition:opacity .8s}
.hint.gone{opacity:0}
.snd{position:absolute;right:16px;top:14px;padding:7px 14px;border:0;border-radius:999px;background:rgba(58,42,18,.55);color:var(--paper);font:inherit;font-size:.9rem;cursor:pointer}
.snd:hover{background:rgba(58,42,18,.75)}
.snd:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.snd:disabled{opacity:.6;cursor:default}
.test{position:absolute;right:16px;top:56px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.test button{padding:6px 12px;border:1px dashed var(--paper);border-radius:999px;background:rgba(58,42,18,.55);color:var(--paper);font:inherit;font-size:.82rem;cursor:pointer}
.test button:hover{background:rgba(58,42,18,.75)}
.test button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.hint b{font-weight:600;color:var(--sky-warm)}
</style>

</head>
<body>
<div id="stage">
  <canvas id="field" tabindex="0" aria-label="Two kids running through a windy golden field. Use the arrow keys or WASD to steer."></canvas>
  <h1 class="name">Flamingo Fields</h1>
  <button class="snd" id="sound" type="button" aria-pressed="true">Sound on</button>
  <div class="test" id="test" hidden>
    <button type="button" id="testFlock">Test: full flock</button>
    <button type="button" id="testOne">Test: +1 flamingo</button>
    <button type="button" id="testNight">Test: go to dusk</button>
  </div>
  <p class="hint" id="hint"><span id="hintText"></span></p>
</div>

<script>
(function(){
"use strict";
const cv = document.getElementById('field');
let ctx = cv.getContext('2d');
const mainCtx = ctx;
const hint = document.getElementById('hint');
const touchy = matchMedia('(pointer: coarse)').matches;
document.getElementById('hintText').innerHTML = touchy
  ? 'Drag to run &middot; tap to <b>hop</b> &middot; collect <b>10 feathers</b>, then tap twice to <b>fly</b>'
  : 'Click the field, then <b>WASD</b> or arrows to run &middot; <b>Shift</b> sprints &middot; <b>Space</b> hops &middot; collect <b>10 feathers</b>, then jump twice to <b>fly</b>';
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.4 : 1;

/* ---------- helpers ---------- */
function h2(i,j){ let n = (Math.imul(i,374761393) + Math.imul(j,668265263))|0; n = Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mix(a,b,t){ return 'rgb('+((a[0]+(b[0]-a[0])*t)|0)+','+((a[1]+(b[1]-a[1])*t)|0)+','+((a[2]+(b[2]-a[2])*t)|0)+')'; }
function rng(seed){ let s=seed>>>0; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }

/* ---------- view ---------- */
let W=0,H=0,DPR=1,horizon=0,focal=0;
const CAM_H=90, CAM_BACK=440;
let dprCap=2, bladeCut=0, slow=0; // quality steps down by itself on slower devices
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, dprCap);
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  horizon = H*0.5; focal = H*0.9;
}
new ResizeObserver(resize).observe(cv); resize();

/* ---------- world state (y = height above ground, ready for flying later) ---------- */
function makeKid(x,z,shirt,hair){ return {x,z,y:0,vx:0,vz:0,vy:0,phase:0,run:0,fx:0,fz:1,sprint:0,hopAt:-1,shirt,hair}; }
const kids = [ makeKid(0,0,'#f3efe6','#3b2416'), makeKid(40,-10,'#c8442f','#2a1a12') ];
const lead = kids[0], pal = kids[1];
let headX=0, headZ=1;
// Camera: orbits a focus point near the lead kid and slowly swings round to sit behind their heading.
let focX=0, focZ=0, camYaw=0, inputYaw=0, lastSig='', camPx=0, camPz=-CAM_BACK, fwdX=0, fwdZ=1, rgtX=1, rgtZ=0;
const WIND_X=1, WIND_Z=0, SUN_B=0.64;
// Terrain: wide rolling swells. ground() returns the height and leaves the slope in gSlopeX / gSlopeZ.
let gSlopeX=0, gSlopeZ=0, camY=CAM_H;
const SUNDX=Math.sin(SUN_B), SUNDZ=Math.cos(SUN_B);
function ground(x,z){
  const a=x*0.0019+0.5, b=z*0.0023+1.1, c=(x*0.8+z*0.6)*0.0041, sa=Math.sin(a), sb=Math.sin(b), cc=Math.cos(c);
  gSlopeX=90*0.0019*Math.cos(a)*sb+30*0.8*0.0041*cc; gSlopeZ=90*0.0023*sa*Math.cos(b)+30*0.6*0.0041*cc;
  return 90*sa*sb+30*Math.sin(c);
}
function windR(){ return WIND_X*rgtX+WIND_Z*rgtZ; }
function proj(x,z){ const rx=x-camPx, rz=z-camPz; return [rx*rgtX+rz*rgtZ, rx*fwdX+rz*fwdZ]; }
function bearingX(th){ let d=th-camYaw; d=Math.atan2(Math.sin(d),Math.cos(d)); return Math.abs(d)>1.4?null:W/2+focal*Math.tan(d); }
let time=0;
// Time of day. One full turn takes DAY_LEN seconds: a long golden evening, a minute of dusk, a moonlit night, a minute of dawn.
const DAY_LEN=480, EVENING=180, DUSK=60, NIGHT_LEN=180;
let night=0, dayOffset=0;
function updateNight(){
  const p=(((time+dayOffset)%DAY_LEN)+DAY_LEN)%DAY_LEN, sm=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
  night = p<EVENING ? 0 : p<EVENING+DUSK ? sm((p-EVENING)/DUSK) : p<EVENING+DUSK+NIGHT_LEN ? 1 : 1-sm((p-EVENING-DUSK-NIGHT_LEN)/(DAY_LEN-EVENING-DUSK-NIGHT_LEN));
}
const NSTARS=[], RIDGE=new Float32Array(512), GLOWS=[], FARDOTS=[], OCC=[];
// Night glows are painted over the finished frame, so each one is checked against the kids and flamingos in front of it.
function glowHidden(x,y,d){ for(let i=0;i<OCC.length;i+=5){ if(d>OCC[i+4]+8){ const u=(x-OCC[i])/OCC[i+2], v=(y-OCC[i+1])/OCC[i+3]; if(u*u+v*v<1) return true; } } return false; }
// Feathers: collect NEED of them, then jump again in mid-air to fly for FLY_TIME seconds.
const NEED=10, FLY_TIME=10, FC=220, got=new Set();
let feathers=0, flightLeft=0, lastGot=-9, lift=0, camBack=CAM_BACK;
// Flamingos: a flock of ten crosses the sky once a minute. Fly close and the kids fall in with them;
// while they are with the flock the flight clock stops.
const FLOCK_EVERY=60, FLOCK_SPEED=230, FLOCK_FIRST=30;
let flock=null, nextFlock=FLOCK_FIRST;
const FLOCK_GONE=19000;   // farther than this a bird is under two pixels wide and fully faded
const FLOCK_FAR=24000, FLOCK_NEAR=2700;   // they set out FLOCK_FAR away, too small to see; within FLOCK_NEAR they slow to cruising speed
const BIRDS=[[0,0]]; for(let r=1;r<=5;r++){ BIRDS.push([-r*80,-r*60]); if(r<=4) BIRDS.push([r*80,-r*60]); }
const BIRD_PH=BIRDS.map((_,i)=>h2(i*7+1,i*3+5)*6.28);
// Your own flock: fly a good part of a pass with the wild flamingos and one of them stays with you,
// walking through the grass beside the kids and taking to the air when they do.
const MATES_MAX=5, PASS_NEEDED=8, mates=[];
const freeFly=()=>mates.length>=MATES_MAX;
const CRUISE=260, CEILING=2400, FAST=800;   // full-flock flight: cruising height, how high Space can take you, and Shift speed   // with a full flock the kids fly whenever they like, for as long as they like
let mateMsgT=-99;
function addMate(x,z,y,hx,hz){
  mates.push({x,z,y,open:y>6?1:0,vx:hx*200,vz:hz*200,vy:0,hx,hz,ph:h2(mates.length*5+2,9)*6.28,id:50+mates.length,wp:0,sp:0});
}
function updateMates(dt){
  const air=lead.fly||lead.y>30;
  mates.forEach((m,i)=>{
    // a place behind the kids, two abreast, wider and looser in the air
    const row=Math.floor(i/2), side=i%2?1:-1, wob=Math.sin(time*0.4+m.ph*3)*18;
    const tight=1-0.35*pathAlign, back=((air?80:85)+row*(air?60:52))*tight, lat=(side*((air?75:58)+row*(air?55:26))+wob)*tight;
    const tx=lead.x-headX*back+headZ*lat, tz=lead.z-headZ*back-headX*lat;
    const dx=tx-m.x, dz=tz-m.z, d=Math.hypot(dx,dz), want=Math.min(m.y>3?1000:400,d*2.2), e=1-Math.exp(-dt*3.5);
    m.vx+=((d>2?dx/d*want:0)-m.vx)*e; m.vz+=((d>2?dz/d*want:0)-m.vz)*e;
    m.x+=m.vx*dt; m.z+=m.vz*dt;
    const sp=m.sp=Math.hypot(m.vx,m.vz);
    if(sp>15){ const eh=1-Math.exp(-dt*5); m.hx+=(m.vx/sp-m.hx)*eh; m.hz+=(m.vz/sp-m.hz)*eh; const hm=Math.hypot(m.hx,m.hz)||1; m.hx/=hm; m.hz/=hm; }
    { const ang=Math.atan2(m.hx,m.hz); let da=ang-(m.ang===undefined?ang:m.ang); da=Math.atan2(Math.sin(da),Math.cos(da)); m.ang=ang;
      m.turn=(m.turn||0)+(clamp(da/Math.max(dt,0.004),-3,3)-(m.turn||0))*(1-Math.exp(-dt*3)); }
    m.wp+=dt*(2+sp*0.035)*(sp>10?1:0);
    // in the air with the kids, down in the grass otherwise; a bird left far behind flies to catch up
    const tgt=(air||d>900)?Math.max(40,(air?lead.y:120)+12+row*10):0;
    m.open=clamp((m.open||0)+(tgt>0?dt/0.9:(m.y<28?-dt/0.8:0)),0,1);
    m.vy+=((tgt-m.y)*3-m.vy*2.8)*dt; m.y=Math.max(0,m.y+m.vy*dt); if(tgt===0&&m.y<1.5){ m.y=0; m.vy=0; }
  });
}
function spawnFlock(){
  // a line that crosses a little ahead of the kids, from one side of the view to the other
  const side=h2(Math.floor(time),7)<0.5?-1:1, ang=night>0.5?SUN_B:Math.atan2(headX,headZ)+side*(1.25+0.4*h2(Math.floor(time),11));   // by night they fly for the moon
  const dx=Math.sin(ang), dz=Math.cos(ang), px=lead.x+headX*900, pz=lead.z+headZ*900;
  flock={x:px-dx*FLOCK_FAR, z:pz-dz*FLOCK_FAR, dx, dz, y:430, t:0, s:-FLOCK_FAR, joined:false, sp:560, withKids:0, done:false};
}
function updateFlock(dt){
  if(!flock){ if(time>=nextFlock){ spawnFlock(); nextFlock=time+FLOCK_EVERY; } return; }
  const f=flock; f.t+=dt;
  if(night>0.5){   // when night comes, a flock already in the air swings round toward the moon
    let a=Math.atan2(f.dx,f.dz), d=SUN_B-a; d=Math.atan2(Math.sin(d),Math.cos(d));
    if(Math.abs(d)>0.001){ a+=clamp(d,-0.16*dt,0.16*dt); f.dx=Math.sin(a); f.dz=Math.cos(a); }
  }
  const dK=Math.hypot(lead.x-f.x,lead.z-f.z);
  if(f.s<-FLOCK_NEAR){
    // Coming in: aim to cross a little ahead of wherever the kids are now, fast while far off and easing down to cruising speed.
    const px=lead.x+headX*900, pz=lead.z+headZ*900, off=(px-f.x)*f.dz-(pz-f.z)*f.dx, step=clamp(off,-320*dt,320*dt);
    f.x+=f.dz*step; f.z-=f.dx*step;
    f.s=-((px-f.x)*f.dx+(pz-f.z)*f.dz);
    const want=FLOCK_SPEED+clamp((-f.s-FLOCK_NEAR)/1500,0,1)*(560-FLOCK_SPEED)+clamp((-f.s-6000)/6000,0,1)*1000;
    f.sp+=(want-f.sp)*(1-Math.exp(-dt*2)); f.y=430+Math.sin(f.t*0.5)*18;
  } else {
    // Passing, and afterwards: they keep cruising for as long as the kids fly near them, and only head off once left alone.
    f.away=(f.s>FLOCK_NEAR && !(lead.fly && dK<1600)) ? Math.min(1,(f.away||0)+dt/2) : Math.max(0,(f.away||0)-dt);
    f.sp+=((FLOCK_SPEED+f.away*520)-f.sp)*(1-Math.exp(-dt*1.2));
    f.y+=((430+Math.sin(f.t*0.5)*18)-f.y)*(1-Math.exp(-dt*1.5))*(1-f.away)+f.away*22*dt;
  }
  f.s+=f.sp*dt;
  f.x+=f.dx*f.sp*dt; f.z+=f.dz*f.sp*dt;
  const d=Math.hypot(lead.x-(f.x-f.dx*95), lead.z-(f.z-f.dz*95)), was=f.joined;
  if(lead.fly){ if(d<340) f.joined=true; else if(d>560) f.joined=false; } else f.joined=false;
  if(f.joined&&!was){ chime(7); chime(12); chime(16); }
  if(f.joined) f.withKids+=dt;
  if(!f.gave && f.withKids>=PASS_NEEDED && mates.length<MATES_MAX){ f.gave=true; const o=BIRDS[BIRDS.length-1];   // flown with them long enough: the last bird of the V leaves it and joins the kids
    addMate(f.x+o[0]*f.dz+o[1]*f.dx, f.z-o[0]*f.dx+o[1]*f.dz, Math.max(60,f.y-ground(f.x,f.z)), f.dx, f.dz);
    mateMsgT=time; [0,5,9,12].forEach((n,q)=>setTimeout(()=>chime(n),q*110)); }
  // A flock is only retired once nobody could see it: shrunk to nothing in the distance, or long gone behind the camera.
  { const p=proj(f.x,f.z), gone=p[1]>FLOCK_GONE || (p[1]<0 && Math.hypot(p[0],p[1])>9000);
    f.unseen=(f.s>FLOCK_NEAR && gone)?(f.unseen||0)+dt:0;
    if(f.unseen>2){ flock=null; nextFlock=Math.max(nextFlock,time+15); } }
}
function featherAt(ci,cj){
  if(got.has((ci+32768)*65536+(cj+32768))) return null;
  if(Math.abs(ci)<1&&Math.abs(cj)<1) return null;
  // a rare great feather: about one cell in eight hundred, worth a whole flight on its own
  if(h2(ci*13+7,cj*11+3)<0.0012) return {x:(ci+0.5)*FC, z:(cj+0.5)*FC, ph:h2(ci-3,cj+8), ci, cj, big:true};
  const rich=vnoise(ci/4,cj/4,555)>0.5;                       // feathers lie in loose patches and trails
  if(h2(ci*5+3,cj*7-11)>(rich?0.21:0.05)) return null;
  return {x:(ci+0.2+0.6*h2(ci+17,cj))*FC, z:(cj+0.2+0.6*h2(ci,cj+29))*FC, ph:h2(ci-3,cj+8), ci, cj};
}
let sunX=0, sunI=1; // the sun sits at a fixed bearing, so it slides across the view as the kids run sideways

/* ---------- input ---------- */
const keys = new Set();
let stick = null, moved=false;
addEventListener('keydown',e=>{
  startSound();
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(k===' ' && !e.repeat){ spaceAt=performance.now(); hop(); }
  keys.add(k);
});
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); keys.delete(k);
  if(k===' ' && freeFly() && performance.now()-spaceAt<230) land(); });   // a quick tap lands; holding still soars
addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{ cv.focus(); startSound(); try{cv.setPointerCapture(e.pointerId);}catch(_){ } stick={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t:performance.now(),far:0}; });
cv.addEventListener('pointermove',e=>{ if(stick&&e.pointerId===stick.id){ stick.x=e.clientX; stick.y=e.clientY; stick.far=Math.max(stick.far,Math.hypot(stick.x-stick.x0,stick.y-stick.y0)); } });
function endStick(e){ if(stick&&e.pointerId===stick.id){ if(stick.far<10 && performance.now()-stick.t<260){ if(lead.fly && freeFly()) land(); else hop(); } stick=null; } }
cv.addEventListener('pointerup',endStick); cv.addEventListener('pointercancel',endStick);
function hop(){
  if(lead.fly) return;
  if(lead.y===0){ lead.vy=240; pal.hopAt=time+0.16; }
  else if(feathers>=NEED||freeFly()){ lead.fly=true; lead.glide=false; lead.alt=CRUISE; flightLeft=FLY_TIME; if(!freeFly()) feathers=0; pal.flyAt=time+0.25; flyStart=time; chime(12); chime(19); }
}
let flyStart=0, spaceAt=0;
function land(){ if(lead.fly && time-flyStart>0.6){ flightLeft=0; for(const k of kids){ k.fly=false; k.glide=true; } } }   // free flight ends when the player chooses

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  let ix=0, iz=0, sprint=keys.has('shift');
  if(keys.has('a')||keys.has('arrowleft')) ix-=1;
  if(keys.has('d')||keys.has('arrowright')) ix+=1;
  if(keys.has('w')||keys.has('arrowup')) iz+=1;
  if(keys.has('s')||keys.has('arrowdown')) iz-=1;
  if(lead.fly && freeFly()){                                 // height stays where you leave it
    if(keys.has(' ')) lead.alt=Math.min(CEILING,lead.alt+380*dt);
    if(iz<0){ lead.alt=Math.max(110,lead.alt-460*dt); iz=0; }   // "back" means down while flying free
  }
  let m=Math.hypot(ix,iz); if(m>1){ix/=m;iz/=m;}
  if(stick){
    const dx=stick.x-stick.x0, dy=stick.y-stick.y0, d=Math.hypot(dx,dy);
    if(d>10){ const q=Math.min(1,d/70); ix=dx/d*q; iz=-dy/d*q; if(d>95) sprint=true; }
  }
  // Steering is always read against where the camera looks now, so holding left or right keeps the kids turning as the camera follows them round.
  // Only a straight "back" keeps the direction it had when first pressed: the kids turn round once and run that way, instead of spinning on the spot.
  { const back=iz<0 && Math.abs(ix)<-iz*0.5; if(back && lastSig!=='back') inputYaw=camYaw; lastSig=back?'back':'';
    const yaw=back?inputYaw:camYaw, sn=Math.sin(yaw), cs=Math.cos(yaw), wx=ix*cs+iz*sn, wz=-ix*sn+iz*cs; ix=wx; iz=wz; }
  if((ix||iz) && !moved){ moved=true; setTimeout(()=>hint.classList.add('gone'),6000); }

  const idle=!(ix||iz);
  if(lead.fly && idle){ ix=headX; iz=headZ; }            // keep gliding forward with no key held
  let top = lead.fly?(sprint&&freeFly()?FAST:430):sprint?340:210;
  // slower uphill, faster downhill
  if(lead.fly && flock && flock.joined && idle){              // with the flock and hands off: settle into the gap behind the leader
    const vx=flock.dx*flock.sp+(flock.x-flock.dx*95-lead.x)*1.2, vz=flock.dz*flock.sp+(flock.z-flock.dz*95-lead.z)*1.2, m=Math.hypot(vx,vz)||1;
    ix=vx/m; iz=vz/m; top=Math.min(540,m);
  }
  if(!lead.fly){ ground(lead.x,lead.z); top*=clamp(1-(gSlopeX*ix+gSlopeZ*iz)*1.5,0.7,1.3); }
  const ease = 1-Math.exp(-dt*(lead.fly?1.7:7));
  lead.vx += (ix*top-lead.vx)*ease; lead.vz += (iz*top-lead.vz)*ease;
  lead.sprint += ((sprint&&(ix||iz)?1:0)-lead.sprint)*(1-Math.exp(-dt*6));
  const ls=Math.hypot(lead.vx,lead.vz);
  if(ls>25){ const e2=1-Math.exp(-dt*5); headX+=(lead.vx/ls-headX)*e2; headZ+=(lead.vz/ls-headZ)*e2; const hm=Math.hypot(headX,headZ)||1; headX/=hm; headZ/=hm; }

  // the second kid runs alongside
  const tx=lead.x-headX*14+headZ*36, tz=lead.z-headZ*14-headX*36;
  const dx=tx-pal.x, dz=tz-pal.z, d=Math.hypot(dx,dz);
  const want=Math.min(top*1.2, d*4.5);
  const pe=1-Math.exp(-dt*6);
  pal.vx += ((d>1?dx/d*want:0)-pal.vx)*pe; pal.vz += ((d>1?dz/d*want:0)-pal.vz)*pe;
  pal.sprint += (lead.sprint-pal.sprint)*(1-Math.exp(-dt*4));
  if(lead.fly){
    if(!(flock&&flock.joined) && !freeFly()) flightLeft-=dt;
    if(!pal.fly && time>=pal.flyAt){ pal.fly=true; pal.glide=false; }
    if(flightLeft<=0){ flightLeft=0; for(const k of kids){ k.fly=false; k.glide=true; } }   // time's up: glide back down
  }
  updateFlock(dt); updateMates(dt);
  if(pal.hopAt>0 && time>=pal.hopAt){ pal.hopAt=-1; if(pal.y===0) pal.vy=225; }

/* ---------- evening light + paper grain over everything ---------- */

  for(let i=0;i<d.data.length;i+=4){ const v=128+(r()-0.5)*150; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; } g.putImageData(d,0,0); return ctx.createPattern(c,'repeat'); })();

  const sx=clamp(sunX,-200,W+200), R=Math.max(W,H)*1.05;

/* ---------- sun position + lens flare ---------- */
function placeSun(){
  let d=SUN_B-camYaw; d=Math.atan2(Math.sin(d),Math.cos(d));
  sunX=Math.abs(d)<1.4 ? W/2+focal*Math.tan(d) : (d>0?W+2000:-2000);

// Ghosts sit on the line from the sun through the lead kid, so the flare swings across the
// frame as the kids move and is strongest when they run in front of the sun.
const GHOSTS=[[0.45,26,'190,240,140',.17],[0.8,14,'110,230,170',.16],[1.0,58,'210,240,150',.1],[1.35,22,'150,235,150',.14],[1.7,90,'120,220,170',.08],[2.1,38,'220,245,170',.09]];
function drawFlare(){
  if(sunI*(1-night)<=0.01) return;
  const lp=proj(lead.x,lead.z), s=focal/Math.max(60,lp[1]), kx=W/2+lp[0]*s, ky=horizon+(camY-ground(lead.x,lead.z))*s-(lead.y+45)*s;
  const q=H/650, sy=horizon-4*q, near=clamp(1-Math.abs(sunX-kx)/(W*0.55),0,1);
  const f=(1-night)*1.7*sunI*(0.4+0.6*near*near)*(0.93+0.07*Math.sin(time*2.3));
  ctx.save(); ctx.globalCompositeOperation='screen';
  ctx.save(); ctx.translate(sunX,sy); ctx.scale(1,0.06);
  const st=ctx.createRadialGradient(0,0,0,0,0,460*q); st.addColorStop(0,'rgba(228,250,190,'+0.5*f+')'); st.addColorStop(1,'rgba(190,240,150,0)');
  ctx.fillStyle=st; ctx.beginPath(); ctx.arc(0,0,460*q,0,7); ctx.fill(); ctx.restore();
  const hl=ctx.createRadialGradient(sunX,sy,95*q,sunX,sy,215*q); hl.addColorStop(0,'rgba(170,235,150,0)'); hl.addColorStop(0.5,'rgba(170,235,150,'+0.09*f+')'); hl.addColorStop(1,'rgba(170,235,150,0)');
  ctx.fillStyle=hl; ctx.beginPath(); ctx.arc(sunX,sy,215*q,0,7); ctx.fill();
  const dx=kx-sunX, dy=ky-sy;

    const x=sunX+dx*gh[0], y=sy+dy*gh[0], R=gh[1]*q*1.8, a=gh[3]*f;
    const gr=ctx.createRadialGradient(x,y,0,x,y,R); gr.addColorStop(0,'rgba('+gh[2]+','+a+')'); gr.addColorStop(0.4,'rgba('+gh[2]+','+a*0.5+')'); gr.addColorStop(1,'rgba('+gh[2]+',0)');

}

/* ---------- drifting seeds ---------- */
const seeds=[]; { const r=rng(99); for(let i=0;i<(calm<1?10:30);i++) seeds.push({u:r(),v:r(),sp:50+r()*110,sz:0.8+r()*1.4,ph:r()*6}); }

function drawStick(){

  let dx=stick.x-stick.x0, dy=stick.y-stick.y0; const d=Math.hypot(dx,dy), m=Math.min(d,70); if(d>0){dx=dx/d*m;dy=dy/d*m;}

/* ---------- flamingos ---------- */
function drawBird(o,sx,sy,s){   // o: {hx,hz heading, ph, id, y absolute height, sc size}
  const cfx=o.hx*rgtX+o.hz*rgtZ, cfz=o.hx*fwdX+o.hz*fwdZ, S=(o.tiny?s:Math.max(s,0.17))*(o.sc||1.9), ph=o.ph;
  // seen a little from above (or from below when the camera is under the flock), so the wing surfaces show instead of lying edge-on
  const elev=clamp(Math.atan2(camY-o.y,Math.max(200,focal/s)),-0.7,0.7)+0.3, ce=Math.cos(elev), se=Math.sin(elev);
  const roll=o.roll||0, cr=Math.cos(roll), sr=Math.sin(roll);

  const ln=(pts,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,w*S); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke(); };

  const dot=(p,r,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(0.7,r*S),0,7); ctx.fill(); };
  const DARK='#2a1e24';
  // Wingbeat. Each bird keeps its own tempo; the down-stroke is quicker than the up-stroke; now and then a bird rests on a short glide.
  const glide=clamp((Math.sin(time*0.37+ph*3.1)-0.82)/0.12,0,1), beat=time*4.2*(0.92+0.16*h2(o.id,3))+ph, phi=beat+0.4*Math.sin(beat);
  // The body rides the wingbeat (up as the wings come down) while the head holds level, as a real bird's does; the neck takes up the difference.
  const bob=-Math.sin(phi)*2.6*(1-glide), sway=Math.sin(time*0.9+ph*2)*0.7;
  // The wing is four jointed parts: upper arm, forearm, hand and tip. Each joint follows the one before it a moment later,
  // so the beat travels out along the wing; on the up-stroke the outer parts fold, and the black flight feathers close up, then spread on the way down.
  // Unfolding from closed to full spread happens in three moves: the upper arm swings out from the body, then the forearm
  // straightens, then the hand opens and the flight feathers fan out. Folding runs the same three moves backwards.
  const open=o.open===undefined?1:o.open, ss=(a,b)=>{ const t=clamp((open-a)/(b-a),0,1); return t*t*(3-2*t); };
  const OP=[ss(0,0.42),ss(0.3,0.72),ss(0.58,1),ss(0.58,1)], FOLD=[-0.9,0.75,-0.95,-0.6], chord=0.4+0.6*(OP[0]+OP[1]+OP[2])/3;
  const amp=(1-0.82*glide)*OP[2], down=clamp(-Math.cos(phi),0,1)*amp, upst=clamp(Math.cos(phi),0,1)*amp, SEG=[16,15,14,13];
  const ang=[0,1,2,3].map(k=>Math.sin(phi-0.38*k)*(0.46+0.2*k)*amp+0.12*glide-upst*0.16*k);
  const wing=sd=>{
    const far=(-sd*cfx>0), base=far?'#e27590':'#f7a6b8', sec1=far?'#c64a6e':'#e56f8d', sec2=far?'#cf5578':'#ec7f9a';
    const xs=[3], us=[2+bob], fs=[0];
    for(let k=0;k<4;k++){ const e=OP[k]; xs.push(xs[k]+SEG[k]*Math.cos(ang[k])*e); us.push(us[k]+SEG[k]*Math.sin(ang[k])*e); fs.push(fs[k]+SEG[k]*FOLD[k]*(1-e)*0.55); }   // a closed part lies folded along the body

    for(let j=0;j<7;j++){ const t0=j*2/7, t1=(j+1)*2/7; poly([Wp(t0,-4),Wp(t1,-4),Wp(t1,-15),Wp((t0+t1)/2,-17.5),Wp(t0,-14.5)], j%2?sec2:sec1); }   // crimson secondaries, scalloped
    poly([Wp(2,7.5),Wp(3,5.5),Wp(3.3,3.5),Wp(3.1,-2.5),Wp(2,-4)],base);                         // coverts on the hand
    ctx.shadowColor='rgba(42,30,36,.85)'; ctx.shadowBlur=lowFx?0:clamp(5*S,2,9);                       // soft, slightly blurred edges on the black feathers
    for(let j=0;j<8;j++){ const tr=2.05+j*0.13, tt=Math.min(4,2.5+j*0.215), ft=(-17+j*2.1)*(0.72+0.5*down)*(0.35+0.65*OP[3]);   // black primaries fanning to the tip

    ctx.shadowBlur=0;
    ln([Wp(0,9),Wp(1,8.5),Wp(2,7.5),Wp(3,5.5),Wp(3.3,3.5)], far?'#f09ab0':'#ffd3dc',1.1);       // light leading edge
    for(let j=1;j<6;j++) ln([Wp(j/3,6.5),Wp(j/3,-3)], far?'#d6688a':'#ee8fa6',0.5);             // rows of covert feathers
  };
  const legs=()=>{ for(const o of [-1.4,1.4]){                                                  // held straight; only the hips ride the body
    const hp=P(o,-9,-2+bob), kn=P(o,-27,-2.4+bob*0.6), ft=P(o,-44,-2.2+bob*0.3);
    ln([hp,kn],'#e98da0',1.6); dot(kn,1.15,'#d9728c'); ln([kn,ft],'#e98da0',1.35);
    poly([P(o-1.7,-44,-2.2+bob*0.3),P(o+1.7,-44,-2.2+bob*0.3),P(o,-48.5,-2.5+bob*0.25)],'#c9566f'); } };
  const body=()=>{
    const tail=()=>poly([P(-3.6,-8,1.5+bob),P(3.6,-8,1.5+bob),P(1.6,-19,0.8+bob*0.8),P(0,-22,1+bob*0.75),P(-1.6,-19,0.8+bob*0.8)],'#e2607f');
    if(cfz<=0) tail();
    ln([P(0,-9,bob),P(0,10,1+bob)],'#ef8aa3',10.5); ln([P(0,-8,-2.6+bob),P(0,6,-2.2+bob)],'#dc6a89',3.6); ln([P(0,-6,2.4+bob),P(0,8,3.1+bob)],'#fab8c6',4.4);   // body, belly shade, back highlight
    if(cfz>0) tail();                                                                           // flying away: the tail is the nearest part of the body
  };

    ln([P(0,9,1.5+bob),P(sway*0.5,17,4.6+bob*0.62),P(sway,26,4.1+bob*0.25),P(sway*0.4,35,2.7)],'#f4a0b3',3.7); ln([P(sway*0.6,20,5+bob*0.45),P(sway*0.4,34,3.2)],'#fbc0cc',1.7);
    const h=P(0,37.5,2.8), hk=1-0.0065*37.5*cfz;
    const bill=()=>{ ln([h,P(0,42.5,2.3)],'#f7dcd0',2.7*hk); ln([P(0,42.5,2.3),P(0,45.7,0.7),P(0,45.3,-1.4)],DARK,2.3*hk); };   // pale bill with a black, down-bent tip
    if(cfz>0.15){ if(cfz<0.72) bill(); dot(h,3.4*hk,'#f29ab0'); }                               // from behind: the bill is hidden past the head and no eyes show
    else { dot(h,3.2*hk,'#f6a6b8'); for(const o of [-1.7,1.7]){ const e=P(o,38.6,3.5); dot(e,1*hk,'#fff3c8'); dot(e,0.5*hk,DARK); } bill(); }
  };
  const far=cfx>0?-1:1;
  ctx.lineCap='round'; ctx.lineJoin='round';

}

function drawBirdFar(i,sx,sy,s){   // a far-off bird: a pink stroke for the body and two flapping wing strokes, all pink
  const cfx=flock.dx*rgtX+flock.dz*rgtZ, cfz=flock.dx*fwdX+flock.dz*fwdZ, S=s*1.9, ph=BIRD_PH[i];
  const beat=time*4.2*(0.92+0.16*h2(i,3))+ph, a=Math.sin(beat+0.4*Math.sin(beat))*0.75, lw=Math.max(1,2.6*S);

  ctx.lineCap='round'; ctx.lineWidth=lw;
  ctx.strokeStyle='#ee8ba3'; ctx.beginPath(); let p=P(0,-44,-2), q=P(0,44,2); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
  for(const sd of [-1,1]){ const m=P(sd*34*Math.cos(a),-2,34*Math.sin(a)), t=P(sd*58*Math.cos(a*1.2),-6,58*Math.sin(a*1.2)); p=P(sd*3,0,2);
    ctx.strokeStyle='#f39bb0'; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(m[0],m[1]); ctx.stroke();
    ctx.strokeStyle='#e9879f'; ctx.beginPath(); ctx.moveTo(m[0],m[1]); ctx.lineTo(t[0],t[1]); ctx.stroke(); }
}
function drawBirdWalk(m,sx,sy,s){   // a companion on the ground: long legs striding through the grass, wings folded, neck up (stretched forward at a run)
  const cfx=m.hx*rgtX+m.hz*rgtZ, cfz=m.hx*fwdX+m.hz*fwdZ, S=Math.max(s,0.17)*1.08, ce=Math.cos(0.14), se=Math.sin(0.14), DARK='#2a1e24';
  const P=(lat,fwd,up)=>{ const d=-lat*cfx+fwd*cfz, k=S*(1-0.0065*d); return [sx+(lat*cfz+fwd*cfx)*k, sy-(up*ce+d*se)*k]; };
  const ln=(pts,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,w*S); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke(); };
  const dot=(p,r,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(0.7,r*S),0,7); ctx.fill(); };
  const run=clamp(m.sp/300,0,1), mv=Math.min(1,m.sp/40), wp=m.wp, bob=Math.abs(Math.sin(wp))*1.6*mv;

  // ankle (the joint that looks like a knee), and a webbed foot. The foot is planted while it carries weight, then lifts, folds and swings through.

    const p2=wp+(sd>0?Math.PI:0), stride=(7+12*run)*mv, sw=Math.sin(p2)*stride, swing=Math.max(0,Math.cos(p2)), lift=swing*(3+9*run)*mv;

    const t0=P(x,sw+tf,lift+tu), t1=P(x-1.9,sw+tf*0.8,lift+tu*0.8), t2=P(x+1.9,sw+tf*0.8,lift+tu*0.8);

  };

    ln([P(sd*3.3,-9,40.5+bob),P(sd*3.5,5,42.5+bob)],far?'#e27590':'#f39bb0',6); ln([P(sd*3.6,-8,39+bob),P(sd*3.6,3,40.5+bob)],far?'#c64a6e':'#e56f8d',2.2); };
  const body=()=>{ ln([P(0,-10,38+bob),P(0,9,41+bob)],'#ef8aa3',11); ln([P(0,-8,35.4+bob),P(0,6,37.6+bob)],'#dc6a89',3.6); ln([P(0,-7,41.5+bob),P(0,7,44+bob)],'#fab8c6',3.8); };
  const neck=()=>{
    const st=Math.pow(run,1.2), nod=Math.sin(wp*2)*1.6*mv*(1-st), L=(a,b)=>a+(b-a)*st;
    const n1=P(0,9,42+bob), n2=P(0,L(14,17)+nod*0.3,L(53,49)+bob*0.6), n3=P(0,L(10,24)+nod*0.6,L(63,55)+bob*0.3), n4=P(0,L(13,30)+nod,L(72,59));
    ln([n1,n2,n3,n4],'#f4a0b3',3.6); ln([n2,n3,n4],'#fbc0cc',1.5);
    const hf=L(15,33)+nod, hu=L(75,60), h=P(0,hf,hu), hk=1-0.0065*hf*cfz;
    const bill=()=>{ ln([h,P(0,hf+5,hu-1.6)],'#f7dcd0',2.7*hk); ln([P(0,hf+5,hu-1.6),P(0,hf+7.6,hu-3.4),P(0,hf+7,hu-5.6)],DARK,2.3*hk); };
    if(cfz>0.15){ if(cfz<0.72) bill(); dot(h,3.4*hk,'#f29ab0'); }
    else { dot(h,3.2*hk,'#f6a6b8'); for(const o of [-1.7,1.7]){ const e=P(o,hf+1,hu+0.7); dot(e,1*hk,'#fff3c8'); dot(e,0.5*hk,DARK); } bill(); }
  };

/* ---------- feathers ---------- */
function featherShape(c,size){ c.beginPath(); c.moveTo(0,-size); c.quadraticCurveTo(size*0.62,-size*0.15,size*0.06,size*0.72); c.quadraticCurveTo(-size*0.6,-size*0.05,0,-size); }
function drawFeather(f,sx,sy,s){
  // floats just above the grass tips so it can be spotted from far off

  if(f.trail && 11*s<2.6){ const yy=sy-(62+(f.h||0))*s; FARDOTS.push(sx,yy,fa,focal/s); return; }   // drawn after the night grade as plain points of light

  // feathers give off their own light
  for(let i=0;i<GLOWS.length;i+=4){ if(glowHidden(GLOWS[i],GLOWS[i+1],GLOWS[i+3])) continue; const R=GLOWS[i+2]; g=ctx.createRadialGradient(GLOWS[i],GLOWS[i+1],0,GLOWS[i],GLOWS[i+1],R);
    g.addColorStop(0,'rgba(255,190,214,'+0.85*n+')'); g.addColorStop(0.25,'rgba(255,150,190,'+0.4*n+')'); g.addColorStop(1,'rgba(255,150,190,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(GLOWS[i],GLOWS[i+1],R,0,7); ctx.fill(); }
  GLOWS.length=0;
  for(let i=0;i<FARDOTS.length;i+=4){ if(glowHidden(FARDOTS[i],FARDOTS[i+1],FARDOTS[i+3])) continue; const a=FARDOTS[i+2]*n; ctx.fillStyle='rgba(255,170,200,'+(0.28*a).toFixed(3)+')'; ctx.fillRect(FARDOTS[i]-3,FARDOTS[i+1]-3,6,6);
    ctx.fillStyle='rgba(255,224,234,'+(0.95*a).toFixed(3)+')'; ctx.fillRect(FARDOTS[i]-1.2,FARDOTS[i+1]-1.2,2.4,2.4); }
  FARDOTS.length=0;
  if(sunI>0.01 && ma>0.01){ ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=sunI*ma; ctx.fillStyle='rgb(236,242,255)'; ctx.beginPath(); ctx.arc(mx,my,30*q,0,7); ctx.fill();
    ctx.fillStyle='rgba(200,210,238,.5)'; for(const c of [[-9,-6,8],[9,6,10],[4,-14,5],[-13,10,6],[14,-9,4]]){ ctx.beginPath(); ctx.arc(mx+c[0]*q,my+c[1]*q,c[2]*q,0,7); ctx.fill(); } 
    // the moon is far beyond the clouds: paint the clouds again over the disc so they pass in front of it
    ctx.save(); ctx.beginPath(); ctx.arc(mx,my,31*q,0,7); ctx.clip(); ctx.globalAlpha=Math.min(1,ma*1.4)*0.8; drawClouds(clouds,0,0.7,0.74,nightClouds()); ctx.restore();   // slightly see-through, so the cloud looks lit from behind
    if(FRONT.length){   // the kids and birds crossing the disc, painted again in night colours in front of the moon
      const R=moonR, x0=Math.floor(moonX-R), y0=Math.floor(moonY-R), sz=Math.ceil(R*2*DPR)+2;
      if(fcv.width!==sz){ fcv.width=fcv.height=fcv2.width=fcv2.height=sz; }
      fctx.setTransform(1,0,0,1,0,0); fctx.clearRect(0,0,sz,sz); fctx.setTransform(DPR,0,0,DPR,-x0*DPR,-y0*DPR);
      ctx=fctx; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
      try{ for(const fn of FRONT) fn(); } finally { ctx=mainCtx; }
      fctx2.globalCompositeOperation='copy'; fctx2.drawImage(fcv,0,0);
      fctx.setTransform(1,0,0,1,0,0); fctx.globalCompositeOperation='multiply'; fctx.fillStyle=c; fctx.fillRect(0,0,sz,sz);
      fctx.globalCompositeOperation='screen'; fctx.fillStyle='rgba(4,8,30,'+n+')'; fctx.fillRect(0,0,sz,sz);
      fctx.fillStyle='rgba(150,180,255,'+0.22*ma+')'; fctx.fillRect(0,0,sz,sz);
      fctx.globalCompositeOperation='destination-in'; fctx.drawImage(fcv2,0,0); fctx.globalCompositeOperation='source-over';
      ctx.save(); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.beginPath(); ctx.arc(mx,my,31*q,0,7); ctx.clip();
      ctx.drawImage(fcv,x0,y0,sz/DPR,sz/DPR); ctx.restore();
    }
    ctx.globalAlpha=1; }
  ctx.globalCompositeOperation='source-over';
}

/* ---------- test buttons: shown only when the address ends in #test ---------- */
{ const box=document.getElementById('test'), show=()=>{ box.hidden=location.hash!=='#test'; };
  show(); addEventListener('hashchange',show);
  const give=(n)=>{ startSound(); for(let i=0;i<n && mates.length<MATES_MAX;i++){ const k=mates.length; addMate(lead.x-headX*(90+k*30)+headZ*(k%2?50:-50), lead.z-headZ*(90+k*30)-headX*(k%2?50:-50), 0, headX, headZ); mateMsgT=time; } cv.focus(); };
  // the first button switches the whole flock on and off; switching it off also rewinds the music so it can start again
  const fb=document.getElementById('testFlock'), label=()=>{ fb.textContent=mates.length>=MATES_MAX?'Test: remove flock':'Test: full flock'; };
  const clear=()=>{ mates.length=0; mateMsgT=-99; if(lead.fly){ flyStart=-9; land(); } if(padEl){ padEl.pause(); try{ padEl.currentTime=0; }catch(e){} } padPlayed=false; cv.focus(); };
  fb.addEventListener('click',()=>{ if(mates.length>=MATES_MAX) clear(); else give(MATES_MAX); label(); });
  setInterval(label,500);
  document.getElementById('testOne').addEventListener('click',()=>give(1));
  const nb=document.getElementById('testNight');
  nb.addEventListener('click',()=>{ const toDay=night>0.3; dayOffset=(toDay?0:EVENING)-time; nb.textContent=toDay?'Test: go to dusk':'Test: back to day'; cv.focus(); });
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const raw=Math.max(0,(now-last)/1000), dt=Math.min(0.05,raw); last=now;
  slow = raw>0.03 ? slow+raw : Math.max(0,slow-raw);
  if(slow>1.2){ slow=0; if(dprCap>1){ dprCap=1; resize(); } else if(bladeCut<1) bladeCut=1; else lowFx=true; }
  requestAnimationFrame(frame);          // booked first, so one bad frame can never stop the game
  try{
    update(dt); updateNight(); updatePath(dt); placeSun(); updateRunSound(); updateFlamSound(); updateMusic(); updateFastSound();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawSky(); drawClouds(clouds,0,0.7,0.74); drawMountains(); drawGround(); drawTreeline(); drawWorld(); drawSeeds(); drawLight(); nightGrade(); drawFlare(); drawHud(); drawStick();
  }catch(err){
    if(!frame.warned){ frame.warned=true; console.error('Flamingo Fields frame error:',err); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.shadowBlur=0;
  }
}
let lowFx=false;   // last quality step on slow devices: drop the soft blur on the birds' black feathers
function start(saved){
  if(saved && saved.kids){ saved.kids.forEach((p,i)=>{ if(kids[i]){ kids[i].x=p.x; kids[i].z=p.z; } }); focX=lead.x; focZ=lead.z; }
  if(saved && saved.day) dayOffset=saved.day;
  if(saved && saved.mates) for(let i=0;i<Math.min(MATES_MAX,saved.mates);i++) addMate(lead.x-60-i*30,lead.z-90-i*20,0,0,1);
  camY=ground(lead.x,lead.z)+CAM_H;
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({kids:kids.map(k=>({x:k.x,z:k.z})), mates:mates.length, day:(time+dayOffset)%DAY_LEN}));
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
})();
