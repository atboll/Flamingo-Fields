<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Flamingo Fields</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed painted scene; a quiet title top-left and a hint pill at the bottom, nothing else. */
:root{
  --sky-deep:#1f7f8c;
  --sky-warm:#f7d894;
  --wheat:#d9a531;
  --wheat-shade:#7a4c0e;
  --ink:#3a2a12;
  --paper:#fff6dc;
  --font-display:"Klee One","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--wheat-shade);color:var(--ink);font-family:var(--font-display);overflow:hidden}
#stage{position:relative;width:100%;height:100%}
#field{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:crosshair}
#field:focus-visible{box-shadow:inset 0 0 0 3px var(--paper)}
.name{position:absolute;left:20px;top:16px;margin:0;font-size:1.5rem;font-weight:600;letter-spacing:.04em;color:var(--paper);text-shadow:0 1px 10px rgba(20,70,80,.55);pointer-events:none}
.hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;margin:0;padding:8px 16px;border-radius:18px;background:rgba(58,42,18,.62);color:var(--paper);font-size:.95rem;text-align:center;pointer-events:none;transition:opacity .8s}
.hint.gone{opacity:0}
.snd{position:absolute;right:16px;top:14px;padding:7px 14px;border:0;border-radius:999px;background:rgba(58,42,18,.55);color:var(--paper);font:inherit;font-size:.9rem;cursor:pointer}
.snd:hover{background:rgba(58,42,18,.75)}
.snd:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.snd:disabled{opacity:.6;cursor:default}
.test{position:absolute;right:16px;top:56px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.test button{padding:6px 12px;border:1px dashed var(--paper);border-radius:999px;background:rgba(58,42,18,.55);color:var(--paper);font:inherit;font-size:.82rem;cursor:pointer}
.test button:hover{background:rgba(58,42,18,.75)}
.test button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.hint b{font-weight:600;color:var(--sky-warm)}
</style>

</head>
<body>
<div id="stage">
  <canvas id="field" tabindex="0" aria-label="Two kids running through a windy golden field. Use the arrow keys or WASD to steer."></canvas>
  <h1 class="name" style="display:none">Flamingo Fields</h1>
  <button class="snd" id="sound" type="button" aria-pressed="true">Sound on</button>
  <div class="test" id="test" hidden>
    <button type="button" id="testFlock">Test: full flock</button>
    <button type="button" id="testOne">Test: +1 flamingo</button>
    <button type="button" id="testNight">Test: go to dusk</button>
    <button type="button" id="testRoad">Test: night + feather road</button>
    <button type="button" id="testSea">Test: mountains almost open</button>
    <button type="button" id="testBeach">Test: fly to the beach</button>
    <span style="font:11px sans-serif;color:#fff;opacity:.75;text-shadow:0 1px 2px #000">build 10 Oct 23:45</span>
  </div>
  <p class="hint" id="hint"><span id="hintText"></span></p>
</div>

<script>
(function(){
"use strict";
const cv = document.getElementById('field');
let ctx = cv.getContext('2d');
const mainCtx = ctx;
const hint = document.getElementById('hint');
const touchy = matchMedia('(pointer: coarse)').matches;
document.getElementById('hintText').innerHTML = touchy
  ? 'Drag to run &middot; tap to <b>hop</b> &middot; collect <b>10 feathers</b>, then tap twice to <b>fly</b>'
  : 'Click the field, then <b>WASD</b> or arrows to run &middot; <b>Shift</b> sprints &middot; <b>Space</b> hops &middot; collect <b>10 feathers</b>, then jump twice to <b>fly</b>';
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.4 : 1;

/* ---------- helpers ---------- */
function h2(i,j){ let n = (Math.imul(i,374761393) + Math.imul(j,668265263))|0; n = Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mix(a,b,t){ return 'rgb('+((a[0]+(b[0]-a[0])*t)|0)+','+((a[1]+(b[1]-a[1])*t)|0)+','+((a[2]+(b[2]-a[2])*t)|0)+')'; }
function rng(seed){ let s=seed>>>0; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }

/* ---------- view ---------- */
let W=0,H=0,DPR=1,horizon=0,focal=0;
const CAM_H=90, CAM_BACK=440;
let dprCap=2, bladeCut=0, slow=0; // quality steps down by itself on slower devices
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, dprCap);
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  horizon = H*0.5; focal = H*0.9;
}
new ResizeObserver(resize).observe(cv); resize();

/* ---------- world state (y = height above ground, ready for flying later) ---------- */
function makeKid(x,z,shirt,hair){ return {x,z,y:0,vx:0,vz:0,vy:0,phase:0,run:0,fx:0,fz:1,sprint:0,hopAt:-1,shirt,hair}; }
const kids = [ makeKid(0,0,'#f3efe6','#3b2416'), makeKid(40,-10,'#c8442f','#2a1a12') ];
const lead = kids[0], pal = kids[1];
let headX=0, headZ=1;
// Camera: orbits a focus point near the lead kid and slowly swings round to sit behind their heading.
let focX=0, focZ=0, camYaw=0, inputYaw=0, lastSig='', camPx=0, camPz=-CAM_BACK, fwdX=0, fwdZ=1, rgtX=1, rgtZ=0;
const WIND_X=1, WIND_Z=0, SUN_B=0.64;
// Terrain: wide rolling swells. ground() returns the height and leaves the slope in gSlopeX / gSlopeZ.
let gSlopeX=0, gSlopeZ=0, camY=CAM_H;
const SUNDX=Math.sin(SUN_B), SUNDZ=Math.cos(SUN_B);
// The coast: once the mountains have parted, the field ahead ends in sand and then in the sea. It is a straight shore across the
// way to the moon, fixed in the world from that moment. coastAlong() is how far a point lies past the start of the sand.
const SAND_RAMP=2000, SHORE=5000;
let arrived=false, coast=false, coastA=0, coastX=0, coastZ=0;   // coastA: how far the shore has faded into being, 0..1
// The shore is not ruled straight: it wanders in long bays and small coves. The curve is folded into coastAlong itself, growing from
// nothing where the sand begins to its full swing at the water, so sand, sea, waves and everything that lives there follow the same line.
function shoreCurve(lat){ return 230*Math.sin(lat*0.0019+0.7)+105*Math.sin(lat*0.0051+2.1)+38*Math.sin(lat*0.0127+4.0); }
function coastAlong(x,z){ const a=(x-coastX)*SUNDX+(z-coastZ)*SUNDZ; if(a<=0) return a; return a-shoreCurve((x-coastX)*SUNDZ-(z-coastZ)*SUNDX)*clamp(a/3000,0,1); }
function coastMix(g,gx,gz,v){ if(coastA>=1) return v; gSlopeX=gx+(gSlopeX-gx)*coastA; gSlopeZ=gz+(gSlopeZ-gz)*coastA; return g+(v-g)*coastA; }   // the land eases into its new shape as the shore appears
function ground(x,z){
  const a=x*0.0019+0.5, b=z*0.0023+1.1, c=(x*0.8+z*0.6)*0.0041, sa=Math.sin(a), sb=Math.sin(b), cc=Math.cos(c);
  gSlopeX=90*0.0019*Math.cos(a)*sb+30*0.8*0.0041*cc; gSlopeZ=90*0.0023*sa*Math.cos(b)+30*0.6*0.0041*cc;
  const g=90*sa*sb+30*Math.sin(c);
  if(coast){ const cs=coastAlong(x,z), g0x=gSlopeX, g0z=gSlopeZ;
    if(cs>SHORE){   // the sea: a slow swell rolling in toward the shore, with a shorter chop over it
      const lat=(x-coastX)*SUNDZ-(z-coastZ)*SUNDX, a1=cs*0.0105+time*1.0+Math.sin(lat*0.0019)*1.6, a2=cs*0.024+time*1.6+lat*0.0037, f=clamp((cs-SHORE)/500,0.12,1);
      const sl=(11*0.0105*Math.cos(a1)+4.5*0.024*Math.cos(a2))*f; gSlopeX=SUNDX*sl; gSlopeZ=SUNDZ*sl; return coastMix(g,g0x,g0z,(11*Math.sin(a1)+4.5*Math.sin(a2))*f); }
    if(cs>0){       // the beach: the field's hills carry on as dunes in long ridges along the shore, and level out only at the water's edge
      const lat=(x-coastX)*SUNDZ-(z-coastZ)*SUNDX, f=clamp((SHORE-cs)/650,0,1), r=clamp(cs/1800,0,1), d1=cs*0.0048+Math.sin(lat*0.0027)*2.1, amp=46*(0.55+0.45*Math.sin(lat*0.0016+1.3))*r;
      gSlopeX=(gSlopeX+SUNDX*amp*0.0048*Math.cos(d1))*f; gSlopeZ=(gSlopeZ+SUNDZ*amp*0.0048*Math.cos(d1))*f; return coastMix(g,g0x,g0z,(g+amp*Math.sin(d1))*f); } }
  return g;
}
function windR(){ return WIND_X*rgtX+WIND_Z*rgtZ; }
function proj(x,z){ const rx=x-camPx, rz=z-camPz; return [rx*rgtX+rz*rgtZ, rx*fwdX+rz*fwdZ]; }
function bearingX(th){ let d=th-camYaw; d=Math.atan2(Math.sin(d),Math.cos(d)); return Math.abs(d)>1.4?null:W/2+focal*Math.tan(d); }
let time=0;
// Time of day. One full turn takes DAY_LEN seconds: a long golden evening, a minute of dusk, a moonlit night, a minute of dawn.
const DAY_LEN=480, EVENING=180, DUSK=60, NIGHT_LEN=180;
let night=0, dayOffset=0;
function updateNight(){
  const p=(((time+dayOffset)%DAY_LEN)+DAY_LEN)%DAY_LEN, sm=t=>{ t=clamp(t,0,1); return t*t*(3-2*t); };
  night = p<EVENING ? 0 : p<EVENING+DUSK ? sm((p-EVENING)/DUSK) : p<EVENING+DUSK+NIGHT_LEN ? 1 : 1-sm((p-EVENING-DUSK-NIGHT_LEN)/(DAY_LEN-EVENING-DUSK-NIGHT_LEN));
}
const NSTARS=[], RIDGE=new Float32Array(512), GLOWS=[], FARDOTS=[], OCC=[];
// Night glows are painted over the finished frame, so each one is checked against the kids and flamingos in front of it.
function glowHidden(x,y,d){ for(let i=0;i<OCC.length;i+=5){ if(d>OCC[i+4]+8){ const u=(x-OCC[i])/OCC[i+2], v=(y-OCC[i+1])/OCC[i+3]; if(u*u+v*v<1) return true; } } return false; }
// Feathers: collect NEED of them, then jump again in mid-air to fly for FLY_TIME seconds.
const NEED=10, FLY_TIME=10, FC=220, got=new Set();
let feathers=0, flightLeft=0, lastGot=-9, lift=0, camBack=CAM_BACK;
// Flamingos: a flock of ten crosses the sky once a minute. Fly close and the kids fall in with them;
// while they are with the flock the flight clock stops.
const FLOCK_EVERY=60, FLOCK_SPEED=230, FLOCK_FIRST=30;
let flock=null, nextFlock=FLOCK_FIRST;
const FLOCK_GONE=19000;   // farther than this a bird is under two pixels wide and fully faded
const FLOCK_FAR=24000, FLOCK_NEAR=2700;   // they set out FLOCK_FAR away, too small to see; within FLOCK_NEAR they slow to cruising speed
const BIRDS=[[0,0]]; for(let r=1;r<=5;r++){ BIRDS.push([-r*80,-r*60]); if(r<=4) BIRDS.push([r*80,-r*60]); }
const BIRD_PH=BIRDS.map((_,i)=>h2(i*7+1,i*3+5)*6.28);
// Your own flock: fly a good part of a pass with the wild flamingos and one of them stays with you,
// walking through the grass beside the kids and taking to the air when they do.
const MATES_MAX=5, PASS_NEEDED=8, mates=[];
const freeFly=()=>arrived||mates.length>=MATES_MAX;   // having brought the flock to the beach, the kids keep their wings for now
const CRUISE=260, CEILING=2400, FAST=800;   // full-flock flight: cruising height, how high Space can take you, and Shift speed   // with a full flock the kids fly whenever they like, for as long as they like
let mateMsgT=-99;
function addMate(x,z,y,hx,hz){
  mates.push({x,z,y,open:y>6?1:0,vx:hx*200,vz:hz*200,vy:0,hx,hz,ph:h2(mates.length*5+2,9)*6.28,id:50+mates.length,wp:0,sp:0});
}
function updateMates(dt){
  const air=lead.fly||lead.y>30;
  mates.forEach((m,i)=>{
    // a place behind the kids, two abreast, wider and looser in the air
    const row=Math.floor(i/2), side=i%2?1:-1, wob=Math.sin(time*0.4+m.ph*3)*18;
    const tight=1-0.35*pathAlign, back=((air?80:85)+row*(air?60:52))*tight, lat=(side*((air?75:58)+row*(air?55:26))+wob)*tight;
    const tx=lead.x-headX*back+headZ*lat, tz=lead.z-headZ*back-headX*lat;
    const dx=tx-m.x, dz=tz-m.z, d=Math.hypot(dx,dz), want=Math.min(m.y>3?1000:400,d*2.2), e=1-Math.exp(-dt*3.5);
    m.vx+=((d>2?dx/d*want:0)-m.vx)*e; m.vz+=((d>2?dz/d*want:0)-m.vz)*e;
    m.x+=m.vx*dt; m.z+=m.vz*dt;
    const sp=m.sp=Math.hypot(m.vx,m.vz);
    if(sp>15){ const eh=1-Math.exp(-dt*5); m.hx+=(m.vx/sp-m.hx)*eh; m.hz+=(m.vz/sp-m.hz)*eh; const hm=Math.hypot(m.hx,m.hz)||1; m.hx/=hm; m.hz/=hm; }
    { const ang=Math.atan2(m.hx,m.hz); let da=ang-(m.ang===undefined?ang:m.ang); da=Math.atan2(Math.sin(da),Math.cos(da)); m.ang=ang;
      m.turn=(m.turn||0)+(clamp(da/Math.max(dt,0.004),-3,3)-(m.turn||0))*(1-Math.exp(-dt*3)); }
    m.wp+=dt*(2+sp*0.035)*(sp>10?1:0);
    // in the air with the kids, down in the grass otherwise; a bird left far behind flies to catch up
    const tgt=(air||d>900)?Math.max(40,(air?lead.y:120)+12+row*10):0;
    m.open=clamp((m.open||0)+(tgt>0?dt/0.9:(m.y<28?-dt/0.8:0)),0,1);
    m.vy+=((tgt-m.y)*3-m.vy*2.8)*dt; m.y=Math.max(0,m.y+m.vy*dt); if(tgt===0&&m.y<1.5){ m.y=0; m.vy=0; }
  });
}
function spawnFlock(){
  // a line that crosses a little ahead of the kids, from one side of the view to the other
  const side=h2(Math.floor(time),7)<0.5?-1:1, ang=night>0.5?SUN_B:Math.atan2(headX,headZ)+side*(1.25+0.4*h2(Math.floor(time),11));   // by night they fly for the moon
  const dx=Math.sin(ang), dz=Math.cos(ang), px=lead.x+headX*900, pz=lead.z+headZ*900;
  flock={x:px-dx*FLOCK_FAR, z:pz-dz*FLOCK_FAR, dx, dz, y:430, t:0, s:-FLOCK_FAR, joined:false, sp:560, withKids:0, done:false};
}
function updateFlock(dt){
  if(level===2){ flock=null; return; }
  if(!flock){ if(time>=nextFlock){ spawnFlock(); nextFlock=time+FLOCK_EVERY; } return; }
  const f=flock; f.t+=dt;
  if(night>0.5){   // when night comes, a flock already in the air swings round toward the moon
    let a=Math.atan2(f.dx,f.dz), d=SUN_B-a; d=Math.atan2(Math.sin(d),Math.cos(d));
    if(Math.abs(d)>0.001){ a+=clamp(d,-0.16*dt,0.16*dt); f.dx=Math.sin(a); f.dz=Math.cos(a); }
  }
  const dK=Math.hypot(lead.x-f.x,lead.z-f.z);
  if(f.s<-FLOCK_NEAR){
    // Coming in: aim to cross a little ahead of wherever the kids are now, fast while far off and easing down to cruising speed.
    const px=lead.x+headX*900, pz=lead.z+headZ*900, off=(px-f.x)*f.dz-(pz-f.z)*f.dx, step=clamp(off,-320*dt,320*dt);
    f.x+=f.dz*step; f.z-=f.dx*step;
    f.s=-((px-f.x)*f.dx+(pz-f.z)*f.dz);
    const want=FLOCK_SPEED+clamp((-f.s-FLOCK_NEAR)/1500,0,1)*(560-FLOCK_SPEED)+clamp((-f.s-6000)/6000,0,1)*1000;
    f.sp+=(want-f.sp)*(1-Math.exp(-dt*2)); f.y=430+Math.sin(f.t*0.5)*18;
  } else {
    // Passing, and afterwards: they keep cruising for as long as the kids fly near them, and only head off once left alone.
    f.away=(f.s>FLOCK_NEAR && !(lead.fly && dK<1600)) ? Math.min(1,(f.away||0)+dt/2) : Math.max(0,(f.away||0)-dt);
    f.sp+=((FLOCK_SPEED+f.away*520)-f.sp)*(1-Math.exp(-dt*1.2));
    f.y+=((430+Math.sin(f.t*0.5)*18)-f.y)*(1-Math.exp(-dt*1.5))*(1-f.away)+f.away*22*dt;
  }
  f.s+=f.sp*dt;
  f.x+=f.dx*f.sp*dt; f.z+=f.dz*f.sp*dt;
  const d=Math.hypot(lead.x-(f.x-f.dx*95), lead.z-(f.z-f.dz*95)), was=f.joined;
  if(lead.fly){ if(d<340) f.joined=true; else if(d>560) f.joined=false; } else f.joined=false;
  if(f.joined&&!was){ chime(7); chime(12); chime(16); }
  if(f.joined) f.withKids+=dt;
  if(!f.gave && f.withKids>=PASS_NEEDED && mates.length<MATES_MAX){ f.gave=true; const o=BIRDS[BIRDS.length-1];   // flown with them long enough: the last bird of the V leaves it and joins the kids
    addMate(f.x+o[0]*f.dz+o[1]*f.dx, f.z-o[0]*f.dx+o[1]*f.dz, Math.max(60,f.y-ground(f.x,f.z)), f.dx, f.dz);
    mateMsgT=time; [0,5,9,12].forEach((n,q)=>setTimeout(()=>chime(n),q*110)); }
  // A flock is only retired once nobody could see it: shrunk to nothing in the distance, or long gone behind the camera.
  { const p=proj(f.x,f.z), gone=p[1]>FLOCK_GONE || (p[1]<0 && Math.hypot(p[0],p[1])>9000);
    f.unseen=(f.s>FLOCK_NEAR && gone)?(f.unseen||0)+dt:0;
    if(f.unseen>2){ flock=null; nextFlock=Math.max(nextFlock,time+15); } }
}
function featherAt(ci,cj){
  if(level===2) return null;
  if(coast && coastAlong((ci+0.5)*FC,(cj+0.5)*FC)>400) return null;     // none on the beach
  if(got.has((ci+32768)*65536+(cj+32768))) return null;
  if(Math.abs(ci)<1&&Math.abs(cj)<1) return null;
  // a rare great feather: about one cell in eight hundred, worth a whole flight on its own
  if(h2(ci*13+7,cj*11+3)<0.0012) return {x:(ci+0.5)*FC, z:(cj+0.5)*FC, ph:h2(ci-3,cj+8), ci, cj, big:true};
  const rich=vnoise(ci/4,cj/4,555)>0.5;                       // feathers lie in loose patches and trails
  if(h2(ci*5+3,cj*7-11)>(rich?0.21:0.05)) return null;
  return {x:(ci+0.2+0.6*h2(ci+17,cj))*FC, z:(cj+0.2+0.6*h2(ci,cj+29))*FC, ph:h2(ci-3,cj+8), ci, cj};
}
let sunX=0, sunI=1; // the sun sits at a fixed bearing, so it slides across the view as the kids run sideways

/* ---------- input ---------- */
const keys = new Set();
let stick = null, moved=false;
addEventListener('keydown',e=>{
  startSound();
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(k===' ' && !e.repeat){ if(lead.fly && freeFly()) land(); else hop(); }   // Space hops, takes off on the second press, and lands a free flight
  keys.add(k);
});
addEventListener('keyup',e=>{ keys.delete(e.key.toLowerCase()); });
addEventListener('blur',()=>keys.clear());
cv.addEventListener('pointerdown',e=>{ cv.focus(); startSound(); try{cv.setPointerCapture(e.pointerId);}catch(_){ } stick={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,t:performance.now(),far:0}; });
cv.addEventListener('pointermove',e=>{ if(stick&&e.pointerId===stick.id){ stick.x=e.clientX; stick.y=e.clientY; stick.far=Math.max(stick.far,Math.hypot(stick.x-stick.x0,stick.y-stick.y0)); } });
function endStick(e){ if(stick&&e.pointerId===stick.id){ if(stick.far<10 && performance.now()-stick.t<260){ if(lead.fly && freeFly()) land(); else hop(); } stick=null; } }
cv.addEventListener('pointerup',endStick); cv.addEventListener('pointercancel',endStick);
function hop(){
  if(lead.fly) return;
  if(lead.y===0){ lead.vy=240; pal.hopAt=time+0.16; }
  else if(feathers>=NEED||freeFly()){ lead.fly=true; lead.glide=false; lead.alt=CRUISE; flightLeft=FLY_TIME; if(!freeFly()) feathers=0; pal.flyAt=time+0.25; flyStart=time; chime(12); chime(19); }
}
let flyStart=0, spaceAt=0;
function land(){ if(skyOpen) return; if(lead.fly && time-flyStart>0.6){ flightLeft=0; for(const k of kids){ k.fly=false; k.glide=true; } } }   // free flight ends when the player chooses

/* ---------- update ---------- */
function update(dt){
  time+=dt;
  let ix=0, iz=0, sprint=keys.has('shift');
  if(keys.has('a')||keys.has('arrowleft')) ix-=1;
  if(keys.has('d')||keys.has('arrowright')) ix+=1;
  if(keys.has('w')||keys.has('arrowup')) iz+=1;
  if(keys.has('s')||keys.has('arrowdown')) iz-=1;
  let m=Math.hypot(ix,iz); if(m>1){ix/=m;iz/=m;}
  if(stick){
    const dx=stick.x-stick.x0, dy=stick.y-stick.y0, d=Math.hypot(dx,dy);
    if(d>10){ const q=Math.min(1,d/70); ix=dx/d*q; iz=-dy/d*q; if(d>95) sprint=true; }
  }
  // In the air, up and down mean rise and descend, and the height stays where it is left. A full flock lifts the ceiling.

const cloudArt=[];

const C_SH=[146,116,124], C_MID=[232,166,120], C_HI=[255,220,164];

    const d=dens(x,y); if(d+(r()-0.5)*0.06<=0) continue;
    const lit=0.45+(d-dens(x-13,y-11))*5-d*1.1+warm+(r()-0.5)*0.18;
    const col=lit<0.42?C_SH:lit<0.74?C_MID:C_HI, i=(y*CW+x)*4;

[0,0.06,0.3,-0.06].forEach((w,i)=>cloudArt.push(paintCloud(101+i*37,false,w)));
[0.1,0.26,0].forEach((w,i)=>cloudArt.push(paintCloud(900+i*53,true,w)));
const skyTex=(()=>{ const c=document.createElement('canvas'); c.width=320; c.height=160; const g=c.getContext('2d'), d=g.createImageData(320,160), p=d.data;
  for(let y=0;y<160;y++) for(let x=0;x<320;x++){ const v=fbm((x+y*0.6)/70,y/9,4242)-0.5, i=(y*320+x)*4, l=v>0?255:20; p[i]=l; p[i+1]=v>0?244:70; p[i+2]=v>0?214:80; p[i+3]=Math.min(255,Math.abs(v)*2.6*255); }
  g.putImageData(d,0,0); return c; })();
const clouds=[]; { const r=rng(7), TAU=Math.PI*2;

/* ---------- sun position + lens flare ---------- */

// Ghosts sit on the line from the sun through the lead kid, so the flare swings across the

  let dx=stick.x-stick.x0, dy=stick.y-stick.y0; const d=Math.hypot(dx,dy), m=Math.min(d,70); if(d>0){dx=dx/d*m;dy=dy/d*m;}

/* ---------- flamingos ---------- */
function drawBird(o,sx,sy,s){   // o: {hx,hz heading, ph, id, y absolute height, sc size}
  const cfx=o.hx*rgtX+o.hz*rgtZ, cfz=o.hx*fwdX+o.hz*fwdZ, S=(o.tiny?s:Math.max(s,0.17))*(o.sc||1.9), ph=o.ph;
  // seen a little from above (or from below when the camera is under the flock), so the wing surfaces show instead of lying edge-on
  const elev=clamp(Math.atan2(camY-o.y,Math.max(200,focal/s)),-0.7,0.7)+0.3, ce=Math.cos(elev), se=Math.sin(elev);
  const roll=o.roll||0, cr=Math.cos(roll), sr=Math.sin(roll);
  const P=(lat0,fwd,up0)=>{ const lat=lat0*cr+up0*sr, up=up0*cr-lat0*sr, d=-lat*cfx+fwd*cfz, k=S*(1-0.0065*d); return [sx+(lat*cfz+fwd*cfx)*k, sy-(up*ce+d*se)*k]; };
  const ln=(pts,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,w*S); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke(); };
  const poly=(pts,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.closePath(); ctx.fill(); };
  const dot=(p,r,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(0.7,r*S),0,7); ctx.fill(); };
  const DARK='#2a1e24';
  // Wingbeat. Each bird keeps its own tempo; the down-stroke is quicker than the up-stroke; now and then a bird rests on a short glide.
  const glide=clamp((Math.sin(time*0.37+ph*3.1)-0.82)/0.12,0,1), beat=time*4.2*(0.92+0.16*h2(o.id,3))+ph, phi=beat+0.4*Math.sin(beat);
  // The body rides the wingbeat (up as the wings come down) while the head holds level, as a real bird's does; the neck takes up the difference.
  const bob=-Math.sin(phi)*2.6*(1-glide), sway=Math.sin(time*0.9+ph*2)*0.7;
  // The wing is four jointed parts: upper arm, forearm, hand and tip. Each joint follows the one before it a moment later,
  // so the beat travels out along the wing; on the up-stroke the outer parts fold, and the black flight feathers close up, then spread on the way down.
  // Unfolding from closed to full spread happens in three moves: the upper arm swings out from the body, then the forearm
  // straightens, then the hand opens and the flight feathers fan out. Folding runs the same three moves backwards.
  const open=o.open===undefined?1:o.open, ss=(a,b)=>{ const t=clamp((open-a)/(b-a),0,1); return t*t*(3-2*t); };
  const OP=[ss(0,0.42),ss(0.3,0.72),ss(0.58,1),ss(0.58,1)], FOLD=[-0.9,0.75,-0.95,-0.6], chord=0.4+0.6*(OP[0]+OP[1]+OP[2])/3;
  const amp=(1-0.82*glide)*OP[2], down=clamp(-Math.cos(phi),0,1)*amp, upst=clamp(Math.cos(phi),0,1)*amp, SEG=[16,15,14,13];
  const ang=[0,1,2,3].map(k=>Math.sin(phi-0.38*k)*(0.46+0.2*k)*amp+0.12*glide-upst*0.16*k);
  const wing=sd=>{
    const far=(-sd*cfx>0), base=far?'#ee8fb0':'#fbbccd', sec1=far?'#c93c6c':'#e8477a', sec2=far?'#d9578a':'#f0709a';
    const xs=[3], us=[2+bob], fs=[0];
    for(let k=0;k<4;k++){ const e=OP[k]; xs.push(xs[k]+SEG[k]*Math.cos(ang[k])*e); us.push(us[k]+SEG[k]*Math.sin(ang[k])*e); fs.push(fs[k]+SEG[k]*FOLD[k]*(1-e)*0.55); }   // a closed part lies folded along the body
    // a point on the wing: t runs 0..4 along the four parts, f is how far forward of the spar it sits
    const Wp=(t,f)=>{ const k=Math.min(3,Math.floor(t)), r=t-k; return P(sd*(xs[k]+(xs[k+1]-xs[k])*r), f*chord+fs[k]+(fs[k+1]-fs[k])*r, us[k]+(us[k+1]-us[k])*r); };
    poly([Wp(0,9),Wp(1,8.5),Wp(2,7.5),Wp(2,-4),Wp(1,-4.5),Wp(0,-5)],base);                      // coverts on the arm
    for(let j=0;j<7;j++){ const t0=j*2/7, t1=(j+1)*2/7; poly([Wp(t0,-4),Wp(t1,-4),Wp(t1,-15),Wp((t0+t1)/2,-17.5),Wp(t0,-14.5)], j%2?sec2:sec1); }   // crimson secondaries, scalloped
    poly([Wp(2,7.5),Wp(3,5.5),Wp(3.3,3.5),Wp(3.1,-2.5),Wp(2,-4)],base);                         // coverts on the hand
    ctx.shadowColor='rgba(42,30,36,.85)'; ctx.shadowBlur=lowFx?0:clamp(5*S,2,9);                       // soft, slightly blurred edges on the black feathers
    for(let j=0;j<8;j++){ const tr=2.05+j*0.13, tt=Math.min(4,2.5+j*0.215), ft=(-17+j*2.1)*(0.72+0.5*down)*(0.35+0.65*OP[3]);   // black primaries fanning to the tip
      poly([Wp(tr,0.5),Wp(tr+0.12,-1.5),Wp(Math.min(4,tt+0.1),ft-1.7),Wp(tt,ft)],'rgba(42,30,36,.8)'); }
    ctx.shadowBlur=0;
    ln([Wp(0,9),Wp(1,8.5),Wp(2,7.5),Wp(3,5.5),Wp(3.3,3.5)], far?'#f09ab0':'#ffd3dc',1.1);       // light leading edge
    for(let j=1;j<6;j++) ln([Wp(j/3,6.5),Wp(j/3,-3)], far?'#d6688a':'#ee8fa6',0.5);             // rows of covert feathers
  };
  const legs=()=>{ for(const o of [-1.4,1.4]){                                                  // held straight; only the hips ride the body
    const hp=P(o,-9,-2+bob), kn=P(o,-27,-2.4+bob*0.6), ft=P(o,-44,-2.2+bob*0.3);
    ln([hp,kn],'#ee5f8c',1.6); dot(kn,1.15,'#dc4c7c'); ln([kn,ft],'#ee5f8c',1.35);
    poly([P(o-1.7,-44,-2.2+bob*0.3),P(o+1.7,-44,-2.2+bob*0.3),P(o,-48.5,-2.5+bob*0.25)],'#d0406f'); } };
  const body=()=>{
    const tail=()=>poly([P(-3.6,-8,1.5+bob),P(3.6,-8,1.5+bob),P(1.6,-19,0.8+bob*0.8),P(0,-22,1+bob*0.75),P(-1.6,-19,0.8+bob*0.8)],'#e2557f');
    if(cfz<=0) tail();
    { const a=P(0,-10.5,0.2+bob), b=P(0,11,0.9+bob), cx=(a[0]+b[0])/2, cy=(a[1]+b[1])/2, L=Math.hypot(b[0]-a[0],b[1]-a[1])/2, rot=Math.atan2(b[1]-a[1],b[0]-a[0]), w=5.6*S, R=Math.max(L,w);   // a full rounded body, darker along the belly
      const el=(dy,k,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(cx,cy+dy*S,R*k,w*k,rot,0,7); ctx.fill(); };
      el(1.3,1,'#e46f99'); el(-0.5,0.96,'#f58fb0'); }
    ln([P(0,-5,2.9+bob),P(0,7,3.4+bob)],'#fcc6d5',3.2);                                                    // the pale back
    if(cfz>0) tail();                                                                           // flying away: the tail is the nearest part of the body
  };
  const neck=()=>{
    { const cl=[0,sway*0.5,sway,sway*0.4], cf=[9,18,27,35.5], cu=[1.5+bob,5.2+bob*0.62,4.2+bob*0.25,2.7], pts=[];   // one smooth line, stretched out ahead
      for(let i=0;i<=9;i++){ const t=i/9, a=(1-t)*(1-t)*(1-t), b=3*(1-t)*(1-t)*t, c=3*(1-t)*t*t, d=t*t*t; pts.push(P(b*cl[1]+c*cl[2]+d*cl[3], a*cf[0]+b*cf[1]+c*cf[2]+d*cf[3], a*cu[0]+b*cu[1]+c*cu[2]+d*cu[3])); }
      ln(pts,'#f48aab',3.5); ln(pts.slice(3),'#fbbdcd',1.3); }
    const h=P(0,37.5,2.8), hk=1-0.0065*37.5*cfz;
    const bill=()=>{ ln([P(0,39.4,2.7),P(0,42.4,2.6),P(0,44.6,1.9)],'#fbe3da',3.3*hk); ln([P(0,44.6,1.9),P(0,46.1,0.6),P(0,45.5,-1.5)],DARK,2.4*hk); };   // pale bill hooking down to a black tip
    if(cfz>0.15){ if(cfz<0.72) bill(); dot(h,3.4*hk,'#f58fb0'); }                               // from behind: the bill is hidden past the head and no eyes show
    else { dot(h,3.3*hk,'#f79bb8'); for(const o of [-1.7,1.7]){ const e=P(o,38.6,3.5); dot(e,1*hk,'#fff3c8'); dot(e,0.5*hk,DARK); } bill(); }
    if(Math.abs(cfx)>0.35 && cfz>-0.6 && S>0.3) dot(P(-far*1.9,38.2,3.7),0.75*hk,DARK);        // the eye, seen from the side
  };
  const far=cfx>0?-1:1;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(cfz>0){ neck(); wing(far); body(); wing(-far); legs(); } else { legs(); wing(far); body(); wing(-far); neck(); }
}

function drawBirdFar(i,sx,sy,s){   // a far-off bird: a pink stroke for the body and two flapping wing strokes, all pink
  const cfx=flock.dx*rgtX+flock.dz*rgtZ, cfz=flock.dx*fwdX+flock.dz*fwdZ, S=s*1.9, ph=BIRD_PH[i];
  const beat=time*4.2*(0.92+0.16*h2(i,3))+ph, a=Math.sin(beat+0.4*Math.sin(beat))*0.75, lw=Math.max(1,2.6*S);
  const P=(lat,fwd,up)=>[sx+(lat*cfz+fwd*cfx)*S, sy-(up*0.95+(-lat*cfx+fwd*cfz)*0.3)*S];
  ctx.lineCap='round'; ctx.lineWidth=lw;
  ctx.strokeStyle='#ee8ba3'; ctx.beginPath(); let p=P(0,-44,-2), q=P(0,44,2); ctx.moveTo(p[0],p[1]); ctx.lineTo(q[0],q[1]); ctx.stroke();
  for(const sd of [-1,1]){ const m=P(sd*34*Math.cos(a),-2,34*Math.sin(a)), t=P(sd*58*Math.cos(a*1.2),-6,58*Math.sin(a*1.2)); p=P(sd*3,0,2);
    ctx.strokeStyle='#f39bb0'; ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(m[0],m[1]); ctx.stroke();
    ctx.strokeStyle='#e9879f'; ctx.beginPath(); ctx.moveTo(m[0],m[1]); ctx.lineTo(t[0],t[1]); ctx.stroke(); }
}
function drawBirdWalk(m,sx,sy,s){   // a companion on the ground: long legs striding through the grass, wings folded, neck up (stretched forward at a run)
  const cfx=m.hx*rgtX+m.hz*rgtZ, cfz=m.hx*fwdX+m.hz*fwdZ, S=(m.beach?s:Math.max(s,0.17))*1.08, ce=Math.cos(0.14), se=Math.sin(0.14), DARK='#2a1e24';
  const P=(lat,fwd,up)=>{ const d=-lat*cfx+fwd*cfz, k=S*(1-0.0065*d); return [sx+(lat*cfz+fwd*cfx)*k, sy-(up*ce+d*se)*k]; };
  const ln=(pts,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,w*S); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke(); };
  const dot=(p,r,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(0.7,r*S),0,7); ctx.fill(); };
  const run=clamp(m.sp/300,0,1), mv=Math.min(1,m.sp/40), wp=m.wp, bob=Math.abs(Math.sin(wp))*1.6*mv;
  const poly=(pts,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.closePath(); ctx.fill(); };
  // A flamingo leg has four parts: a short feathered thigh, the long shin, the long lower leg below the backward-bending
  // ankle (the joint that looks like a knee), and a webbed foot. The foot is planted while it carries weight, then lifts, folds and swings through.
  const lerp=(a,b,t)=>a+(b-a)*t, HOT='#e8477a', MID='#f58fb0', PALE='#fcc6d5';
  const ell=(c,rx,ry,rot,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(c[0],c[1],Math.max(0.6,rx),Math.max(0.6,ry),rot,0,7); ctx.fill(); };
  const leg=sd=>{
    const p2=wp+(sd>0?Math.PI:0), stride=(7+12*run)*mv, sw=Math.sin(p2)*stride, swing=Math.max(0,Math.cos(p2)), lift=swing*(3+9*run)*mv;
    const farLeg=(-sd*cfx>0), c1=farLeg?'#d64a78':'#ee5f8c', c2=farLeg?'#c23a69':'#dc4c7c', x=sd*1.7;
    const R=sd===(m.restSide||1)?(m.rest||0):0, Re=R*R*(3-2*R);                                // resting: this leg is drawn up and tucked under the body
    const hipF=-1, hipU=35+bob, kneeF=lerp(hipF+2.2+sw*0.12,2.6,Re), kneeU=lerp(hipU-6.5,28,Re);
    const fF=lerp(sw,-7.5,Re), fU=lerp(lift,26.5,Re);
    const ankF=lerp((kneeF+sw)/2-(3.5+lift*0.9+2*run),-4.2,Re), ankU=lerp((kneeU+lift)/2+1+lift*0.35,30.8,Re);   // the ankle folds backward as the foot lifts
    const hip=P(x,hipF,hipU), knee=P(x,kneeF,kneeU), ank=P(x,ankF,ankU), foot=P(x,fF,fU);
    ln([hip,knee],farLeg?'#e2729a':'#f48aab',3.4);                                             // feathered thigh
    ln([knee,ank],c1,1.6); ln([ank,foot],c1,1.35); dot(knee,1.15,c2); dot(ank,1.3,c2);
    const tf=lerp(4.6-swing*3.2*mv,1.6,Re), tu=lerp(-swing*3.4*mv,-3.2,Re);                    // toes point forward on the ground and hang when lifted
    const t0=P(x,fF+tf,fU+tu), t1=P(x-1.9,fF+tf*0.8,fU+tu*0.8), t2=P(x+1.9,fF+tf*0.8,fU+tu*0.8);
    poly([foot,t1,t0,t2],'#d0406f'); ln([foot,t0],c2,0.8); ln([foot,P(x,fF-1.6,fU+0.4)],c2,0.9);   // webbed toes and a small back toe
  };
  // The folded wing lies over the body as a paler shape, with darker feathers fanning back from under it to the black tips.
  const wingFold=sd=>{ const isFar=(-sd*cfx>0), ax=Math.abs(cfx), az=Math.abs(cfz);
    for(let i=3;i>=0;i--) ln([P(sd*5,-4.5-i*2.1,41-i*1.2+bob),P(sd*4.4,-12-i*2.1,39-i*1.9+bob)],i>1?(isFar?'#c93c6c':HOT):(isFar?'#de5c88':'#f0709a'),2.5);
    ln([P(sd*4.2,-15.5,35.6+bob),P(sd*3.9,-19.5,34+bob)],DARK,2.2); ln([P(sd*4.2,-14,37.6+bob),P(sd*3.9,-18,36.4+bob)],DARK,1.8);
    if(!isFar || az>0.75) ell(P(sd*5,-2.5,41.8+bob), Math.hypot(10.5*ax,2.6*az)*S, 5.4*S, -0.2*cfx, isFar?'#f3a9c0':PALE); };
  // The body is a full soft egg, heavier behind, darker along the belly.
  const body=()=>{ const ax=Math.abs(cfx), az=Math.abs(cfz), rx=Math.hypot(12.5*ax,7*az)*S, rot=-0.15*cfx;
    ell(P(0,-6.5,38.4+bob), Math.hypot(8.5*ax,6.6*az)*S, 7.2*S, rot, '#e46f99');
    ell(P(0,-1,38.2+bob), rx, 8.4*S, rot, '#e46f99'); ell(P(0,-0.6,40+bob), rx*0.98, 7.9*S, rot, MID);
    if(S>0.42) for(let i=0;i<8;i++){ const a=h2(m.id*7+i,401)*6.283, r=Math.sqrt(h2(m.id*5+i,403))*0.78, c=P((h2(m.id+i,405)-0.5)*9,-0.6+Math.cos(a)*r*11, 40+bob+Math.sin(a)*r*6.6);   // a light speckle
      ctx.fillStyle=i&1?'rgba(252,214,226,.7)':'rgba(214,92,136,.5)'; ctx.fillRect(c[0]-0.5*S, c[1]-0.5*S, Math.max(1,1.1*S), Math.max(1,1.1*S)); } };
  const neck=()=>{
    const st=Math.pow(run,1.2), nod=Math.sin(wp*2)*1.6*mv*(1-st);
    const F=m.feed||0, dab=F*Math.sin(time*3+m.ph)*1.6;                                       // feeding: the neck swings down and the bill dabbles at the sand
    // one smooth S: a curve through four guide points, upright at rest, stretched forward at a run, bowed to the ground to feed
    const G=(a,b,c)=>lerp(lerp(a,b,st),c,F);
    const cf=[9, G(19,17,21), G(7,24,27)+nod*0.5, G(12.5,30,24.5)+nod+dab], cu=[42+bob, G(47,46,43)+bob*0.6, G(61,52,28)+bob*0.3, G(71,59,13)];
    const pts=[]; for(let i=0;i<=10;i++){ const t=i/10, a=(1-t)*(1-t)*(1-t), b=3*(1-t)*(1-t)*t, c=3*(1-t)*t*t, d=t*t*t; pts.push(P(0,a*cf[0]+b*cf[1]+c*cf[2]+d*cf[3],a*cu[0]+b*cu[1]+c*cu[2]+d*cu[3])); }
    ln(pts,'#f48aab',3.5); ln(pts.slice(3),'#fbbdcd',1.3);
    // a small round head, and the bill: pale at the base, then hooking sharply down to a black tip
    let dx=G(0.97,1,0.25), du=G(-0.26,-0.08,-0.97); { const n=Math.hypot(dx,du)||1; dx/=n; du/=n; }
    const hf=cf[3]+dx*1.5, hu=cu[3]+du*1.5, h=P(0,hf,hu), hk=1-0.0065*hf*cfz, px=du, pu=-dx;
    const bill=()=>{ ln([P(0,hf+dx*2,hu+du*2),P(0,hf+dx*5,hu+du*5+0.2),P(0,hf+dx*7.4+px*0.9,hu+du*7.4+pu*0.9)],'#fbe3da',3.3*hk);
      ln([P(0,hf+dx*7.4+px*0.9,hu+du*7.4+pu*0.9),P(0,hf+dx*8.3+px*2.4,hu+du*8.3+pu*2.4),P(0,hf+dx*7.5+px*4.2,hu+du*7.5+pu*4.2)],DARK,2.4*hk); };
    if(cfz>0.15){ if(cfz<0.72) bill(); dot(h,3.4*hk,'#f58fb0'); }
    else { dot(h,3.3*hk,'#f79bb8'); for(const o of [-1.7,1.7]){ const e=P(o,hf+1,hu+0.7); dot(e,1*hk,'#fff3c8'); dot(e,0.5*hk,DARK); } bill(); }
    if(Math.abs(cfx)>0.35 && cfz>-0.6 && S>0.3) dot(P(-far*1.9,hf+dx*0.7,hu+0.9),0.75*hk,DARK);   // the eye, seen from the side
  };
  const far=cfx>0?-1:1;
  ctx.lineCap='round'; ctx.lineJoin='round';
  const tail=()=>{ poly([P(-3,-9,41+bob),P(3,-9,41+bob),P(1.2,-17,38+bob),P(0,-19,37.5+bob),P(-1.2,-17,38+bob)],'#e2557f'); };
  if(cfz>0){ neck(); leg(far); wingFold(far); body(); tail(); wingFold(-far); leg(-far); }
  else { leg(far); wingFold(far); tail(); body(); wingFold(-far); leg(-far); neck(); }
}

/* ---------- feathers ---------- */
function featherShape(c,size){ c.beginPath(); c.moveTo(0,-size); c.quadraticCurveTo(size*0.62,-size*0.15,size*0.06,size*0.72); c.quadraticCurveTo(-size*0.6,-size*0.05,0,-size); }
function drawFeather(f,sx,sy,s){
  // floats just above the grass tips so it can be spotted from far off
  const fa=f.trail?f.a:1-pathA; if(fa<=0.01) return;
  if(f.trail && 11*s<2.6){ const yy=sy-(62+(f.h||0))*s; FARDOTS.push(sx,yy,fa,focal/s); return; }   // drawn after the night grade as plain points of light
  ctx.save(); ctx.globalAlpha=fa;
  const big=f.big?1:0, y=sy-(62+(f.h||0)+big*26+Math.sin(time*2+f.ph*6)*(4+big*5))*s, size=Math.max(3.4,11*s)*(1+big*1.9), tw=0.75+0.25*Math.sin(time*5+f.ph*40);
  if(big){                                                    // the great feather: a wide golden halo and slow turning rays
    const R=size*5, g2=ctx.createRadialGradient(sx,y,0,sx,y,R); g2.addColorStop(0,'rgba(255,236,170,'+0.55*tw+')'); g2.addColorStop(0.4,'rgba(255,200,190,.22)'); g2.addColorStop(1,'rgba(255,200,190,0)');
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(sx,y,R,0,7); ctx.fill();
    ctx.strokeStyle='rgba(255,244,210,'+0.5*tw+')'; ctx.lineWidth=Math.max(1,size*0.07); ctx.beginPath();
    for(let j=0;j<8;j++){ const an=time*0.5+j*Math.PI/4; ctx.moveTo(sx+Math.cos(an)*size*1.5,y+Math.sin(an)*size*1.5); ctx.lineTo(sx+Math.cos(an)*size*(2.3+0.5*Math.sin(time*3+j)),y+Math.sin(an)*size*(2.3+0.5*Math.sin(time*3+j))); }
    ctx.stroke();
  }
  const g=ctx.createRadialGradient(sx,y,0,sx,y,size*2.8); g.addColorStop(0,'rgba(255,226,232,'+0.65*tw+')'); g.addColorStop(1,'rgba(255,226,232,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,y,size*2.8,0,7); ctx.fill();
  if(night>0.05 && fa>0.5) GLOWS.push(sx,y,size*(big?3.2:2.6),focal/s);

}
function drawDeck(){
  if(level!==1 || skyA<0.02) return;
  const cover=skyA*clamp((lead.y-(CEILING-300))/2100,0,1), near=ceilNear(); if(cover<=0.01 && near<=0.01) return;
  // one veil over the whole view, with no edge anywhere: thick at the top as the ceiling nears, closing over the field from the horizon inward
  const g=ctx.createLinearGradient(0,0,0,H), c='212,186,208', k=clamp(cover*1.3,0,1), fh=clamp(horizon/H,0.05,0.9), aH=Math.max(k,near*near*0.85);
  g.addColorStop(0,'rgba('+c+','+near+')'); g.addColorStop(fh,'rgba('+c+','+aH+')'); g.addColorStop(fh+(1-fh)*0.35,'rgba('+c+','+k*(0.5+0.5*cover)+')'); g.addColorStop(1,'rgba('+c+','+cover*k+')');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  cloudLayer(false);
  for(const fn of REDO) fn();                                    // the kids and their flock fly in front of it
}
// Inside the cloud there is only cloud, in the colours of the night: this is what hides the step from one world to the next.
function drawFog(){
  const a=fogNow(); if(a<=0.004) return;
  ctx.globalAlpha=a; ctx.fillStyle='#d8bcd0'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;
}
function drawLevelSign(){
  const t=time-landT-1.5; if(!(landed2||arrived) || t<0 || t>7) return;
  const a=clamp(t/1.5,0,1)*clamp((7-t)/2,0,1), q=clamp(Math.min(W/1100,H/560),0.55,1.2);
  ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='600 '+Math.round(72*q)+'px "Klee One","Trebuchet MS",sans-serif';
  try{ ctx.letterSpacing=Math.round(14*q)+'px'; }catch(e){}
  ctx.shadowColor='rgba(60,30,60,.55)'; ctx.shadowBlur=18; ctx.fillStyle='#fff6f0'; ctx.fillText('LEVEL 2',W/2,H*0.34); ctx.restore();
}
// Clouds along the way up, as things in the world: drawn in two passes so the kids fly in front of the far ones and behind the near ones.
function drawSkyClouds(far){
  if(skyA<0.02) return;
  const al=(lead.x-pathPx)*SUNDX+(lead.z-pathPz)*SUNDZ, kidD=proj(lead.x,lead.z)[1], STEP=1100, list=[], n=cloudArt.length;
  for(let j=Math.floor((al-1500)/STEP), j1=Math.floor((al+11000)/STEP); j<=j1; j++) for(let m=0;m<2;m++){
    const t=(j+h2(j,41+m))*STEP, l=(h2(j,43+m*7)-0.5)*7000+Math.sin(time*0.05+j+m)*160, alt=CLOUD_LO+h2(j,47+m*3)*1500, k=0.8+h2(j,53+m)*1.1;
    const p=proj(pathPx+SUNDX*t+SUNDZ*l, pathPz+SUNDZ*t-SUNDX*l); if(p[1]<40 || (p[1]>kidD)!==far) continue;
    list.push([p[1],p[0],alt,k,((j*2+m)%n+n)%n]); }
  list.sort((a,b)=>b[0]-a[0]);
  for(const c of list){ const s=focal/c[0], w=2600*c[3]*s, h=w*0.375, x=W/2+c[1]*s, y=horizon+(camY-c[2])*s;
    if(x<-w||x>W+w||y<-h||y>H+h) continue;
    const a=skyA*(level===1?1:0)*clamp((11000-c[0])/3000,0,1)*clamp((c[0]-60)/500,0,1)*0.92; if(a<0.01) continue;
    ctx.globalAlpha=a; ctx.drawImage(cloudArt[c[4]], x-w/2, y-h/2, w, h); }
  ctx.globalAlpha=1;
}
function updatePath(dt){
  const lat=(lead.x-pathPx)*SUNDZ-(lead.z-pathPz)*SUNDX, al=(lead.x-pathPx)*SUNDX+(lead.z-pathPz)*SUNDZ;
  const ok=level===1 && night>0.98 && freeFly() && (pathA===0 || Math.abs(lat)<6000);     // wander far from it and it fades, to be found again nearby
  if(ok && pathA===0){ const sd=h2(Math.floor(time),31)<0.5?-1:1; pathPx=lead.x+SUNDZ*sd*700; pathPz=lead.z-SUNDX*sd*700; }
  pathA=clamp(pathA+(ok?dt/21:-dt/3),0,1);     // the gathering is slow
  // the path answers when the kids travel along it toward the moon
  const on=pathOn=pathA>0.3 && Math.abs(lat)<ROAD_HALF+350 && Math.hypot(lead.vx,lead.vz)>60 && (headX*SUNDX+headZ*SUNDZ)>0.92;
  pathAlign+=((on?1:0)-pathAlign)*(1-Math.exp(-dt*(on?0.9:1.6)));
  if(level===1){ if(on && lead.fly) sea=Math.min(1,sea+dt/SEA_TIME);
    if(coast) sea=Math.max(sea,clamp(1+(coastAlong(lead.x,lead.z)+2200)/9000,0,1)); }   // however the kids come to the shore, the mountains have finished parting by the time they reach it
   // the journey: the mountains part while the road is flown, and stay parted
  // a sound answers too, as a hint: once each time the kids fly onto the road and turn along it
  if(actx && master){
    if(!hintEl && pathA>0){ hintEl=new Audio('path.mp3'); hintEl.preload='auto';
      try{ const g=actx.createGain(); g.gain.value=0.9; actx.createMediaElementSource(hintEl).connect(g); g.connect(master); }catch(e){ hintEl.volume=0.9; } }
    const hit=on && lead.fly;
    if(hintEl && hit && !hintWas && time-hintT>40){ hintT=time; try{ hintEl.currentTime=0; }catch(e){} const p=hintEl.play(); if(p&&p.catch) p.catch(()=>{}); }
    hintWas=hit;
  }
}
// The trail itself: the field's feathers drift slowly out of their places into a wide road that hovers over the grass and
// runs on toward the moon, away into the horizon. Feathers on the road are not collected; fly through and they scatter.
const FEATHER_TOP=640;   // how high feathers alone can carry the kids
const SEA_TIME=45;   // seconds of flying the road for the mountains to part fully
const ROAD_STEP=130, ROAD_HALF=600, ROAD_RISE=13000, ROAD_END=70000;
function trailFeather(j,al){
  const t=(j+h2(j,9)-0.5)*ROAD_STEP, ahead=t-al, u=0, hgt=WAY_UP?(lead.y-30+Math.max(ahead,-1100)*0.5)*skyA:0;   // the road lies over the field all the way to the horizon
  // brightest around the kids, then dimming steadily all the way out until the lines are lost in the horizon
  let a=clamp(pathA*3,0,1)*Math.pow(clamp(1-ahead/ROAD_END,0,1),1.8)*clamp((ahead+1100)/300,0,1);
  // and thinning as it goes, so the far end never piles up into a bright streak
  if(j&1) a*=clamp((4500-ahead)/800,0,1); else if(j&2) a*=clamp((9500-ahead)/1500,0,1); else if(j&4) a*=clamp((19000-ahead)/3000,0,1); else if(j&8) a*=clamp((36000-ahead)/6000,0,1);
  a*=1-skyA*clamp((lead.y-30+ahead*0.5-(SKY_TOP-500))/500,0,1);                                                   // and is lost in the cloud above
  if(coast) a*=clamp((900-coastAlong(pathPx+SUNDX*t,pathPz+SUNDZ*t))/1400,0,1);                                    // the road ends where the sand begins
  if(a<=0.01 || h2(j,31)<0.16) return null;                                                                        // gaps and clumps, so the lines never look ruled
  const e0=clamp(pathA*1.7-clamp(ahead/30000,0,1)*0.7,0,1), e=e0*e0*(3-2*e0);                                     // nearest feathers fall into place first
  const side=h2(j,5)<0.5?-1:1, far=(h2(j,37)-0.5)*2, wob=side*(ROAD_HALF+Math.sin(t*0.0013+side)*70)+(h2(j,17)-0.5)*200+Math.sin(time*0.6+j*1.7)*14*e+far*2200*(1-e);   // two loose lines, one down each side, with the middle left empty
  let x=pathPx+SUNDX*t+SUNDZ*wob, z=pathPz+SUNDZ*t-SUNDX*wob, h=(hgt+h2(j,23)*70)*e+Math.sin(time*0.9+j)*10*e*clamp(u/800,0,1);
  const dx=x-lead.x, dz=z-lead.z, dy=(62+h)-(lead.y+40), d=Math.hypot(dx,dz,dy);
  if(d<150 && d>1){ const p=(1-d/150)*95/d; x+=dx*p; z+=dz*p; h=Math.max(0,h+dy*p); }                             // scatter around the kids as they pass
  return {x,z,h,ph:h2(j,3),trail:true,a:a*(0.55+0.45*e)};
}

/* ---------- night: a blue moonlight grade over the finished frame, then the things that give light ---------- */
function nightGrade(){
  const n=night; if(n<=0.005){ GLOWS.length=0; FARDOTS.length=0; return; }
  // dusk passes through a dusty violet on the way to moonlit blue
  const c = n<0.5 ? mix([255,255,255],[168,128,166],n*2) : mix([168,128,166],[44,74,158],(n-0.5)*2);
  ctx.globalCompositeOperation='multiply'; ctx.fillStyle=c; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='screen'; ctx.fillStyle='rgba(4,8,30,'+n+')'; ctx.fillRect(0,0,W,H);
  const sa=clamp((n-0.45)/0.55,0,1);
  for(let i=0;i<NSTARS.length;i+=4){ if(NSTARS[i+1]>RIDGE[Math.min(511,(NSTARS[i]+40)>>3)]-3 || behindCloud(NSTARS[i],NSTARS[i+1]) || groundHides(NSTARS[i],NSTARS[i+1],1e9)) continue;
    ctx.fillStyle='rgba(215,228,255,'+0.75*NSTARS[i+3]*sa+')'; ctx.beginPath(); ctx.arc(NSTARS[i],NSTARS[i+1],NSTARS[i+2]*0.75,0,7); ctx.fill(); }
  const mx=clamp(sunX,-400,W+400), my=moonY, q=H/650, ma=clamp((n-0.3)/0.7,0,1)*clamp(moonUp*5,0.25,1)*(1-fogNow())*(1-0.8*ceilNear());   // cloud between the kids and the moon dims it
  let g=ctx.createRadialGradient(mx,my,0,mx,my,Math.max(W,H)*0.75); g.addColorStop(0,'rgba(150,180,255,'+0.42*ma+')'); g.addColorStop(0.12,'rgba(110,145,235,'+0.14*ma+')'); g.addColorStop(1,'rgba(90,120,220,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // moonlight lying across the field below the moon
  // a pool of light that just touches the horizon and is brightest out on the field, so it has no edge anywhere
  { const ry=(H-horizon)*0.62, rx=W*0.4; ctx.save(); ctx.translate(mx,horizon+ry); ctx.scale(rx/ry,1); g=ctx.createRadialGradient(0,0,0,0,0,ry);
    g.addColorStop(0,'rgba(170,200,255,'+0.2*ma+')'); g.addColorStop(0.55,'rgba(170,200,255,'+0.11*ma+')'); g.addColorStop(1,'rgba(170,200,255,0)');
    ctx.fillStyle=g; ctx.fillRect(-ry,-ry,ry*2,ry*2); ctx.restore(); }
  // feathers give off their own light
  for(let i=0;i<GLOWS.length;i+=4){ if(glowHidden(GLOWS[i],GLOWS[i+1],GLOWS[i+3]) || groundHides(GLOWS[i],GLOWS[i+1],GLOWS[i+3])) continue; const R=GLOWS[i+2]; g=ctx.createRadialGradient(GLOWS[i],GLOWS[i+1],0,GLOWS[i],GLOWS[i+1],R);
    g.addColorStop(0,'rgba(255,190,214,'+0.85*n+')'); g.addColorStop(0.25,'rgba(255,150,190,'+0.4*n+')'); g.addColorStop(1,'rgba(255,150,190,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(GLOWS[i],GLOWS[i+1],R,0,7); ctx.fill(); }
  GLOWS.length=0;
  for(let i=0;i<FARDOTS.length;i+=4){ if(glowHidden(FARDOTS[i],FARDOTS[i+1],FARDOTS[i+3]) || groundHides(FARDOTS[i],FARDOTS[i+1],FARDOTS[i+3])) continue; const a=FARDOTS[i+2]*n, k=clamp(1-(FARDOTS[i+3]-3000)/38000,0.3,1);   // smaller the farther off
    ctx.fillStyle='rgba(255,170,200,'+(0.26*a*k).toFixed(3)+')'; ctx.fillRect(FARDOTS[i]-3*k,FARDOTS[i+1]-3*k,6*k,6*k);
    ctx.fillStyle='rgba(255,224,234,'+(0.85*a).toFixed(3)+')'; ctx.fillRect(FARDOTS[i]-1.2*k,FARDOTS[i+1]-1.2*k,2.4*k,2.4*k); }
  FARDOTS.length=0;
  if(sunI>0.01 && n>0.02 && my-34*q<horizon+6){ const mo=clamp(n*1.6,0,1)*(1-fogNow())*(1-0.8*ceilNear()), R=30*q;
    ctx.globalCompositeOperation='source-over'; ctx.save();
    // it rises and sets behind the mountains, or out of the sea where they have parted
    { const cp=new Path2D(), xa=mx-R*1.5, xb=mx+R*1.5; cp.moveTo(xa,-10); for(let x=xa;x<=xb+8;x+=8) cp.lineTo(x,Math.min(RIDGE[clamp((x+40)>>3,0,511)]+1, STRN?skyAt(0,x):1e9)); cp.lineTo(xb+8,-10); cp.closePath(); ctx.clip(cp); }
    ctx.globalAlpha=sunI*mo*0.16; ctx.fillStyle='rgb(214,220,246)'; ctx.beginPath(); ctx.arc(mx,my,R*1.3,0,7); ctx.fill();    // a pale ring of haze close around it
    ctx.globalAlpha=sunI*mo; ctx.imageSmoothingEnabled=false; ctx.drawImage(moonArt||(moonArt=paintMoon()), mx-R, my-R, R*2, R*2); ctx.imageSmoothingEnabled=true;
    // the moon is far beyond the clouds: paint the clouds again over the disc so they pass in front of it
    ctx.save(); ctx.beginPath(); ctx.arc(mx,my,31*q,0,7); ctx.clip(); ctx.globalAlpha=Math.min(1,ma*1.4)*0.8; drawClouds(clouds,0,0.7,0.74,nightClouds()); ctx.restore();   // slightly see-through, so the cloud looks lit from behind
    if(FRONT.length){   // the kids and birds crossing the disc, painted again in night colours in front of the moon
      const R=moonR, x0=Math.floor(moonX-R), y0=Math.floor(moonY-R), sz=Math.ceil(R*2*DPR)+2;
      if(fcv.width!==sz){ fcv.width=fcv.height=fcv2.width=fcv2.height=sz; }
      fctx.setTransform(1,0,0,1,0,0); fctx.clearRect(0,0,sz,sz); fctx.setTransform(DPR,0,0,DPR,-x0*DPR,-y0*DPR);
      ctx=fctx; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
      try{ for(const fn of FRONT) fn(); } finally { ctx=mainCtx; }
      fctx2.globalCompositeOperation='copy'; fctx2.drawImage(fcv,0,0);
      fctx.setTransform(1,0,0,1,0,0); fctx.globalCompositeOperation='multiply'; fctx.fillStyle=c; fctx.fillRect(0,0,sz,sz);
      fctx.globalCompositeOperation='screen'; fctx.fillStyle='rgba(4,8,30,'+n+')'; fctx.fillRect(0,0,sz,sz);
      fctx.fillStyle='rgba(150,180,255,'+0.22*ma+')'; fctx.fillRect(0,0,sz,sz);
      fctx.globalCompositeOperation='destination-in'; fctx.drawImage(fcv2,0,0); fctx.globalCompositeOperation='source-over';
      ctx.save(); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.beginPath(); ctx.arc(mx,my,31*q,0,7); ctx.clip();
      ctx.drawImage(fcv,x0,y0,sz/DPR,sz/DPR); ctx.restore();
    }
    ctx.restore(); ctx.globalAlpha=1; }
  ctx.globalCompositeOperation='source-over';
}

/* ---------- test buttons: shown only when the address ends in #test ---------- */
{ const box=document.getElementById('test'), show=()=>{ box.hidden=location.hash!=='#test'; };
  show(); addEventListener('hashchange',show);
  const give=(n)=>{ startSound(); for(let i=0;i<n && mates.length<MATES_MAX;i++){ const k=mates.length; addMate(lead.x-headX*(90+k*30)+headZ*(k%2?50:-50), lead.z-headZ*(90+k*30)-headX*(k%2?50:-50), 0, headX, headZ); mateMsgT=time; } cv.focus(); };
  // the first button switches the whole flock on and off; switching it off also rewinds the music so it can start again
  const fb=document.getElementById('testFlock'), label=()=>{ fb.textContent=mates.length>=MATES_MAX?'Test: remove flock':'Test: full flock'; };
  const clear=()=>{ mates.length=0; mateMsgT=-99; if(lead.fly){ flyStart=-9; land(); } if(padEl){ padEl.pause(); try{ padEl.currentTime=0; }catch(e){} } padPlayed=false; cv.focus(); };
  fb.addEventListener('click',()=>{ if(mates.length>=MATES_MAX) clear(); else give(MATES_MAX); label(); });
  setInterval(label,500);
  document.getElementById('testOne').addEventListener('click',()=>give(1));
  // straight to deep night with a full flock and the feather road already laid from where the kids stand
  document.getElementById('testRoad').addEventListener('click',()=>{ give(MATES_MAX); label(); dayOffset=EVENING+DUSK+5-time; pathPx=lead.x; pathPz=lead.z; pathA=1; cv.focus(); });
  document.getElementById('testSea').addEventListener('click',()=>{ document.getElementById('testRoad').click(); if(!coast) sea=0.97; });
  document.getElementById('testBeach').addEventListener('click',()=>{ document.getElementById('testRoad').click(); if(!coast) sea=1;
    setTimeout(()=>{ if(!coast||arrived) return; coastA=1; sea=1; const d=SHORE*0.5-coastAlong(lead.x,lead.z); for(const k of kids){ k.x+=SUNDX*d; k.z+=SUNDZ*d; } for(const m of mates){ m.x+=SUNDX*d; m.z+=SUNDZ*d; }
      camYaw=SUN_B; headX=SUNDX; headZ=SUNDZ; if(!lead.fly){ hop(); setTimeout(hop,250); } },300); cv.focus(); });
  const nb=document.getElementById('testNight');
  nb.addEventListener('click',()=>{ const toDay=night>0.3; dayOffset=(toDay?0:EVENING)-time; nb.textContent=toDay?'Test: go to dusk':'Test: back to day'; cv.focus(); });
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const raw=Math.max(0,(now-last)/1000), dt=Math.min(0.05,raw); last=now;
  slow = raw>0.03 ? slow+raw : Math.max(0,slow-raw);
  if(slow>1.2){ slow=0; if(dprCap>1){ dprCap=1; resize(); } else if(bladeCut<1) bladeCut=1; else lowFx=true; }
  requestAnimationFrame(frame);          // booked first, so one bad frame can never stop the game
  try{
    update(dt); updateNight(); updatePath(dt); updateSky(dt); updateCoast(dt); placeSun(); updateRunSound(); updateFlamSound(); updateMusic(); updateFastSound(); updateOceanSound();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawSky(); drawClouds(clouds,0,0.7,0.74); drawMountains(); drawGround(); coastFar(); drawSea(false); drawTreeline(); moonSetup(); drawCeiling(); drawSkyClouds(true); drawWorld(); drawDeck(); drawSkyClouds(false); drawFog(); drawSeeds(); drawLight(); nightGrade(); seaGlints(); drawGlints(); drawFlare(); drawLevelSign(); drawHud(); drawStick();
  }catch(err){
    if(!frame.warned){ frame.warned=true; console.error('Flamingo Fields frame error:',err); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.shadowBlur=0;
  }
}
let lowFx=false;   // last quality step on slow devices: drop the soft blur on the birds' black feathers
function start(saved){
  if(saved && saved.kids){ saved.kids.forEach((p,i)=>{ if(kids[i]){ kids[i].x=p.x; kids[i].z=p.z; } }); focX=lead.x; focZ=lead.z; }
  if(saved && saved.day) dayOffset=saved.day;
  if(saved && saved.mates) for(let i=0;i<Math.min(MATES_MAX,saved.mates);i++) addMate(lead.x-60-i*30,lead.z-90-i*20,0,0,1);
  camY=ground(lead.x,lead.z)+CAM_H;
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({kids:kids.map(k=>({x:k.x,z:k.z})), mates:mates.length, day:(time+dayOffset)%DAY_LEN}));
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
})();
