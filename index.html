<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Flamingo Fields</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: one full-bleed painted scene; a quiet title top-left and a hint pill at the bottom, nothing else. */
:root{
  --sky-deep:#1f7f8c;
  --sky-warm:#f7d894;
  --wheat:#d9a531;
  --wheat-shade:#7a4c0e;
  --ink:#3a2a12;
  --paper:#fff6dc;
  --font-display:"Klee One","Hiragino Maru Gothic ProN","Trebuchet MS",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--wheat-shade);color:var(--ink);font-family:var(--font-display);overflow:hidden}
#stage{position:relative;width:100%;height:100%}
#field{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:crosshair}
#field:focus-visible{box-shadow:inset 0 0 0 3px var(--paper)}
.name{position:absolute;left:20px;top:16px;margin:0;font-size:1.5rem;font-weight:600;letter-spacing:.04em;color:var(--paper);text-shadow:0 1px 10px rgba(20,70,80,.55);pointer-events:none}
.hint{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;margin:0;padding:8px 16px;border-radius:18px;background:rgba(58,42,18,.62);color:var(--paper);font-size:.95rem;text-align:center;pointer-events:none;transition:opacity .8s}
.hint.gone{opacity:0}
.snd{position:absolute;right:16px;top:14px;padding:7px 14px;border:0;border-radius:999px;background:rgba(58,42,18,.55);color:var(--paper);font:inherit;font-size:.9rem;cursor:pointer}
.snd:hover{background:rgba(58,42,18,.75)}
.snd:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.snd:disabled{opacity:.6;cursor:default}
.test{position:absolute;right:16px;top:56px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.test button{padding:6px 12px;border:1px dashed var(--paper);border-radius:999px;background:rgba(58,42,18,.55);color:var(--paper);font:inherit;font-size:.82rem;cursor:pointer}
.test button:hover{background:rgba(58,42,18,.75)}
.test button:focus-visible{outline:2px solid var(--paper);outline-offset:2px}
.hint b{font-weight:600;color:var(--sky-warm)}
</style>

</head>
<body>
<div id="stage">
  <canvas id="field" tabindex="0" aria-label="Two kids running through a windy golden field. Use the arrow keys or WASD to steer."></canvas>
  <h1 class="name" style="display:none">Flamingo Fields</h1>
  <button class="snd" id="sound" type="button" aria-pressed="true">Sound on</button>
  <div class="test" id="test" hidden>
    <button type="button" id="testReset">Test: start over, no flamingos</button>
    <button type="button" id="testFlock">Test: full flock</button>
    <button type="button" id="testOne">Test: +1 flamingo</button>
    <button type="button" id="testNight">Test: go to dusk</button>
    <button type="button" id="testRoad">Test: night + feather road</button>
    <button type="button" id="testSea">Test: mountains almost open</button>
    <button type="button" id="testBeach">Test: fly to the box</button>
    <button type="button" id="testDoor">Test: stand before the door</button>
    <button type="button" id="testClouds">Test: go to the clouds</button>
    <button type="button" id="testCross">Test: whale crosses now</button>
    <span id="buildStamp" style="font:11px sans-serif;color:#fff;opacity:.75;text-shadow:0 1px 2px #000">build 11 Oct 21:40</span>
  </div>
  <p class="hint" id="hint"><span id="hintText"></span></p>
</div>

<script>
(function(){
"use strict";
const cv = document.getElementById('field');
let ctx = cv.getContext('2d');
const mainCtx = ctx;
const hint = document.getElementById('hint');
const touchy = matchMedia('(pointer: coarse)').matches;
document.getElementById('hintText').innerHTML = touchy
  ? 'Drag to run &middot; tap to <b>hop</b> &middot; collect <b>10 feathers</b>, then tap twice to <b>fly</b>'
  : 'Click the field, then <b>WASD</b> or arrows to run &middot; <b>Space</b> hops &middot; collect <b>10 feathers</b>, then jump twice to <b>fly</b>';
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.4 : 1;

/* ---------- helpers ---------- */
function h2(i,j){ let n = (Math.imul(i,374761393) + Math.imul(j,668265263))|0; n = Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mix(a,b,t){ return 'rgb('+((a[0]+(b[0]-a[0])*t)|0)+','+((a[1]+(b[1]-a[1])*t)|0)+','+((a[2]+(b[2]-a[2])*t)|0)+')'; }
function rng(seed){ let s=seed>>>0; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }

/* ---------- view ---------- */
let W=0,H=0,DPR=1,horizon=0,focal=0;
const CAM_H=90, CAM_BACK=440;
let dprCap=2, bladeCut=0, slow=0; // quality steps down by itself on slower devices
function resize(){
  const r = cv.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, dprCap);
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  horizon = H*0.5; focal = H*0.9;
}
new ResizeObserver(resize).observe(cv); resize();

/* ---------- world state (y = height above ground, ready for flying later) ---------- */
function makeKid(x,z,shirt,hair){ return {x,z,y:0,vx:0,vz:0,vy:0,phase:0,run:0,fx:0,fz:1,sprint:0,hopAt:-1,shirt,hair}; }
const kids = [ makeKid(0,0,'#f3efe6','#3b2416'), makeKid(40,-10,'#c8442f','#2a1a12') ];
const lead = kids[0], pal = kids[1];
let headX=0, headZ=1;
// Camera: orbits a focus point near the lead kid and slowly swings round to sit behind their heading.
let focX=0, focZ=0, camYaw=0, inputYaw=0, lastSig='', camPx=0, camPz=-CAM_BACK, fwdX=0, fwdZ=1, rgtX=1, rgtZ=0;
const WIND_X=1, WIND_Z=0, SUN_B=0.64;
// Terrain: wide rolling swells. ground() returns the height and leaves the slope in gSlopeX / gSlopeZ.
let gSlopeX=0, gSlopeZ=0, camY=CAM_H;
const SUNDX=Math.sin(SUN_B), SUNDZ=Math.cos(SUN_B);
// The coast: once the mountains have parted, the field ahead ends in sand and then in the sea. It is a straight shore across the
// way to the moon, fixed in the world from that moment. coastAlong() is how far a point lies past the start of the sand.
const SAND_RAMP=2500, SHORE=6250;
let arrived=false, coast=false, coastA=0, coastX=0, coastZ=0;   // coastA: how far the shore has faded into being, 0..1
// The shore is not ruled straight: it wanders in long bays and small coves. The curve is folded into coastAlong itself, growing from
// nothing where the sand begins to its full swing at the water, so sand, sea, waves and everything that lives there follow the same line.
function shoreCurve(lat){ return 230*Math.sin(lat*0.0019+0.7)+105*Math.sin(lat*0.0051+2.1)+38*Math.sin(lat*0.0127+4.0); }
function coastAlong(x,z){ const a=(x-coastX)*SUNDX+(z-coastZ)*SUNDZ; if(BOX) return Math.min(SHORE-700,(a-DES_A0-shoreCurve((x-coastX)*SUNDZ-(z-coastZ)*SUNDX)*3)*0.5); if(a<=0) return a; return a-shoreCurve((x-coastX)*SUNDZ-(z-coastZ)*SUNDX)*clamp(a/3000,0,1); }
// At the end of the feather road stands a huge silver box, with flamingos gathered round it. There is no sea and no sand:
// the field, its trees and the horizon carry on as before.
const BOX=true, BOX_HALF=1000, BOX_H=2000, BOX_RING=2800/Math.PI, BOX_SHADOW=5600;
const DES_A0=SHORE-(52000+SHORE)/2;   // half way along the journey the field gives way to desert
function alongRoad(x,z){ return (x-coastX)*SUNDX+(z-coastZ)*SUNDZ; }
function boxC(){ return [coastX+SUNDX*SHORE, coastZ+SUNDZ*SHORE]; }
function boxLat(x,z){ const c=boxC(), dx=x-c[0], dz=z-c[1]; return Math.atan2(dx*SUNDZ-dz*SUNDX, -(dx*SUNDX+dz*SUNDZ))*BOX_RING; }   // how far round the box, from the side the kids arrive at
function boxFloor(k,gh){ if(!coast || level!==1) return 0; const c=boxC(), dx=k.x-c[0], dz=k.z-c[1], u=dx*SUNDZ-dz*SUNDX, v=dx*SUNDX+dz*SUNDZ;   // the height of the box top above the ground under the kid, when the kid is over it
  if(Math.abs(u)>BOX_HALF || Math.abs(v)>BOX_HALF) return 0; const fl=ground(c[0],c[1])-30+BOX_H-gh; return (k.y>=fl-45 || (k!==lead && lead.fl>0))?fl:0; }   // the small kid stays with the big one
function boxDist(x,z){ const c=boxC(); return Math.hypot(x-c[0],z-c[1]); }
let BOXV=null, boxDrawn=false;
// Works out, for this frame, which faces of the box are seen and its outline on the screen.
function boxSetup(){
  BOXV=null; if(!coast || level!==1 || coastA<=0.01) return;
  const c=boxC(), g=ground(c[0],c[1])-30, ux=SUNDZ, uz=-SUNDX, vx=SUNDX, vz=SUNDZ, P=[];
  for(const [a,b] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ const x=c[0]+(ux*a+vx*b)*BOX_HALF, z=c[1]+(uz*a+vz*b)*BOX_HALF, p=proj(x,z); P.push({x,z,cx:p[0],dz:p[1]}); }
  let near=1e9, far=-1e9; for(const p of P){ if(p.dz<near) near=p.dz; if(p.dz>far) far=p.dz; }
  if(far<60) return;                                                              // wholly behind the camera
  near=Math.max(near,45);
  // a face as it lands on the screen, cut off where it passes behind the eye
  const NEARZ=40, poly=(V)=>{ const out=[]; for(let i=0;i<V.length;i++){ const p=V[i], q=V[(i+1)%V.length], pi=p[1]>=NEARZ, qi=q[1]>=NEARZ;
      if(pi) out.push(p); if(pi!==qi){ const t=(NEARZ-p[1])/(q[1]-p[1]); out.push([p[0]+(q[0]-p[0])*t,NEARZ,p[2]+(q[2]-p[2])*t]); } }
    return out.map(v=>{ const s=focal/v[1]; return [W/2+v[0]*s, horizon+(camY-v[2])*s]; }); };
  const S=(p,h)=>{ const s=focal/Math.max(p.dz,NEARZ); return [W/2+p.cx*s, horizon+(camY-h)*s]; };
  const N=[[0,-1],[1,0],[0,1],[-1,0]], faces=[], pts=[], cpts=[], top=g+BOX_H;
  for(let i=0;i<4;i++){ const A=P[i], B=P[(i+1)&3], nx=ux*N[i][0]+vx*N[i][1], nz=uz*N[i][0]+vz*N[i][1], mx=(A.x+B.x)/2, mz=(A.z+B.z)/2;
    const vis=(camPx-mx)*nx+(camPz-mz)*nz>0, pg=vis?poly([[A.cx,A.dz,g-220],[B.cx,B.dz,g-220],[B.cx,B.dz,top],[A.cx,A.dz,top]]):[];
    faces.push({A,B,nx,nz,mx,mz,vis:vis,pg,d:(A.dz+B.dz)/2,lit:nx*SUNDX+nz*SUNDZ}); if(pg.length>2){ for(const p of pg) pts.push(p); for(const p of poly([[A.cx,A.dz,g+24],[B.cx,B.dz,g+24],[B.cx,B.dz,top],[A.cx,A.dz,top]])) cpts.push(p); } }
  const topPg=camY>top+4?poly(P.map(p=>[p.cx,p.dz,top])):[]; if(topPg.length>2) for(const p of topPg){ pts.push(p); cpts.push(p); }
  if(pts.length<3) return;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]), hullOf=(pts)=>{ pts.sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const lo=[], up=[];
    for(const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
    for(let i=pts.length-1;i>=0;i--){ const p=pts[i]; while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
    lo.pop(); up.pop(); return lo.concat(up); };
  const hull=hullOf(pts), ch=hullOf(cpts); if(hull.length<3 || ch.length<3) return;
  const clip=new Path2D(); clip.rect(-20,-20,W+40,H+40); clip.moveTo(ch[0][0],ch[0][1]); for(let i=1;i<ch.length;i++) clip.lineTo(ch[i][0],ch[i][1]); clip.closePath();   // everything but the box, down to where it meets the sand
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9; for(const p of hull){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  BOXV={P,S,g,faces,hull,near,far,x0,x1,y0,y1,c,topPg,clip};
  // its shadow, thrown back along the road away from the moon, laid over the dunes
  { const NS=16, Lf=[], Rt=[]; let sn=1e9, sf=-1e9;
    for(let i=0;i<=NS;i++){ const al=-BOX_HALF-BOX_SHADOW*(1-i/NS)*1, row=[];
      for(const sd of [-1,1]){ const x=c[0]+vx*al+ux*sd*BOX_HALF, z=c[1]+vz*al+uz*sd*BOX_HALF, p=proj(x,z); row.push(p[1]>50?[W/2+p[0]*focal/p[1], horizon+(camY-ground(x,z))*focal/p[1], p[1]]:null); }
      if(row[0] && row[1]){ Lf.push(row[0]); Rt.push(row[1]); sn=Math.min(sn,row[0][2],row[1][2]); sf=Math.max(sf,row[0][2],row[1][2]); } else if(Lf.length){ Lf.length=0; Rt.length=0; sn=1e9; sf=-1e9; } }
    if(Lf.length>=2){ const sh=new Path2D(); sh.moveTo(Lf[0][0],Lf[0][1]); for(let i=1;i<Lf.length;i++) sh.lineTo(Lf[i][0],Lf[i][1]); for(let i=Rt.length-1;i>=0;i--) sh.lineTo(Rt[i][0],Rt[i][1]); sh.closePath(); BOXV.sh=sh; BOXV.shNear=sn-60; BOXV.shFar=sf+60; } }
}
function boxShadowStrip(fp,np,NX){   // the part of the shadow lying on this strip of ground, painted before the strip nearer covers its foot
  ctx.save(); ctx.beginPath(); ctx.moveTo(0,fp[0]-1); for(let i=1;i<=NX;i++) ctx.lineTo(i*W/NX,fp[i]-1); for(let i=NX;i>=0;i--) ctx.lineTo(i*W/NX,Math.max(np[i],fp[i])+1); ctx.closePath(); ctx.clip();
  ctx.fillStyle='rgba(34,30,66,'+(0.42*clamp(coastA*1.5,0,1)).toFixed(3)+')'; ctx.fill(BOXV.sh); ctx.restore();
}
// The top of the box is a mirror to the moon: a pale wash of its light, and the moon itself where the eye meets its reflection.
// Painted over the finished night so it glows; the kids and flamingos standing on the box are left out of it.
// A door in the face of the box that the kids arrive at, and a very bright light coming out of it: a white doorway, a soft bloom
// round it, a thin ray standing straight up from it, and its light lying on the sand in front. It is painted over the finished
// frame so that it shines by night; the kids are then painted again in front of it, so they stand dark against the light.
const DOOR_W=255, DOOR_H=545;
const BOXFRONT=[]; let boxFrontNow=false, door2Dz=-1;   // whatever is drawn in front of the box this frame, kept so it can be painted again over the door's light
function skyLimit(x,d){ if(!STRN || SD[STRN-1]>=d-4) return 1e9; let lo=0, hi=STRN-1; while(lo<hi){ const m=(lo+hi)>>1; if(SD[m]<d-4) hi=m; else lo=m+1; } return skyAt(lo,x); }
let gcv=null, gctx=null, gcv2=null, gctx2=null;
function frontOverLight(lx0,ly0,lx1,ly1,sil){   // everything standing or flying in front of the box, painted again in the colours of the hour over the light just laid down
  const n=night, L=[]; let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const q of BOXFRONT){ const ax=q[1]-q[3]*1.3, bx=q[1]+q[3]*1.3, ay=q[2]-q[4]*1.3, by=q[2]+q[4]*1.3; if(bx<lx0 || ax>lx1 || by<ly0 || ay>ly1) continue; L.push(q[0]); if(ax<x0)x0=ax; if(bx>x1)x1=bx; if(ay<y0)y0=ay; if(by>y1)y1=by; }
  if(!L.length) return;
  x0=Math.max(0,Math.floor(x0)); y0=Math.max(0,Math.floor(y0)); x1=Math.min(W,Math.ceil(x1)); y1=Math.min(H,Math.ceil(y1)); if(x1-x0<2 || y1-y0<2) return;
  const w=Math.ceil((x1-x0)*DPR), h=Math.ceil((y1-y0)*DPR);
  if(!gcv){ gcv=document.createElement('canvas'); gctx=gcv.getContext('2d'); gcv2=document.createElement('canvas'); gctx2=gcv2.getContext('2d'); }
  if(gcv.width!==w || gcv.height!==h){ gcv.width=gcv2.width=w; gcv.height=gcv2.height=h; }
  gctx.setTransform(1,0,0,1,0,0); gctx.globalCompositeOperation='source-over'; gctx.globalAlpha=1; gctx.clearRect(0,0,w,h); gctx.setTransform(DPR,0,0,DPR,-x0*DPR,-y0*DPR);
  const main=ctx; ctx=gctx; try{ for(const fn of L) fn(); } finally { ctx=main; }
  sil=sil||0;
  if(n>0.005 || sil>0.004){ gctx2.setTransform(1,0,0,1,0,0); gctx2.globalCompositeOperation='copy'; gctx2.drawImage(gcv,0,0);
    gctx.setTransform(1,0,0,1,0,0); gctx.globalAlpha=1;
    if(n>0.005){ const c = n<0.5 ? mix([255,255,255],[168,128,166],n*2) : mix([168,128,166],[44,74,158],(n-0.5)*2);
      gctx.globalCompositeOperation='multiply'; gctx.fillStyle=c; gctx.fillRect(0,0,w,h);
      gctx.globalCompositeOperation='screen'; gctx.fillStyle='rgba(4,8,30,'+n+')'; gctx.fillRect(0,0,w,h); }
    if(sil>0.004){ const k=Math.pow(sil,0.8), v=(a,b)=>Math.round(a+(b-a)*k);            // nearer the door they lose their colours and stand dark against the light
      gctx.globalCompositeOperation='multiply'; gctx.fillStyle='rgb('+v(255,36)+','+v(255,32)+','+v(255,50)+')'; gctx.fillRect(0,0,w,h);
      gctx.globalCompositeOperation='source-over'; gctx.fillStyle='rgba(30,26,44,'+(0.55*k).toFixed(3)+')'; gctx.fillRect(0,0,w,h); }
    gctx.globalCompositeOperation='destination-in'; gctx.drawImage(gcv2,0,0); gctx.globalCompositeOperation='source-over'; }
  const s0=clamp((sil-0.4)/0.6,0,1), fa=1-0.8*s0*s0*(3-2*s0);                           // in the full white they are left as faint shapes
  ctx.save(); ctx.globalAlpha=fa; ctx.globalCompositeOperation='source-over'; ctx.drawImage(gcv,x0,y0,w/DPR,h/DPR); ctx.restore();
}
// On the clouds the door is a doorway of the box's silver, with real depth: posts, a lintel, and the light set back in the opening.
// the frame's posts and lintel: a slim 9.2 (they were 46). Frame and light are one slab, 30 deep, the light filling it from face to face.
const D2_POST=9.2, D2_DEPTH=30; let D2=null;
function door2Setup(){
  D2=null; if(level!==2 || !coast) return; const c=boxC(), ux=SUNDZ, uz=-SUNDX, vx=SUNDX, vz=SUNDZ, v0=-BOX_HALF, dmx=c[0]+vx*v0, dmz=c[1]+vz*v0;
  const camU=(camPx-dmx)*ux+(camPz-dmz)*uz, camV=(camPx-dmx)*vx+(camPz-dmz)*vz, sg=camV<0?-1:1, vn=v0+sg*D2_DEPTH/2, vf=v0-sg*D2_DEPTH/2, g=ground(dmx,dmz)-8, uo=DOOR_W/2+D2_POST, ui=DOOR_W/2, hi=g+DOOR_H, top=hi+D2_POST;
  const P=(u,v,h)=>{ const x=c[0]+ux*u+vx*v, z=c[1]+uz*u+vz*v, p=proj(x,z); if(p[1]<45) return null; const sc=focal/p[1]; return [W/2+p[0]*sc, horizon+(camY-h)*sc]; };
  const Q=(a)=>{ const o=a.map(q=>P(q[0],q[1],q[2])); return o.some(q=>!q)?null:o; }, faces=[], jambs=[];
  const near=Q([[-uo,vn,g],[uo,vn,g],[uo,vn,top],[-uo,vn,top]]), open=Q([[-ui,vn,g],[ui,vn,g],[ui,vn,hi],[-ui,vn,hi]]); if(!near || !open) return;
  if(Math.abs(camU)>uo){ const su=camU>0?1:-1, f=Q([[su*uo,vn,g],[su*uo,vf,g],[su*uo,vf,top],[su*uo,vn,top]]); if(f) faces.push([f,'#a9b0bd']); }
  if(camY>top){ const f=Q([[-uo,vn,top],[uo,vn,top],[uo,vf,top],[-uo,vf,top]]); if(f) faces.push([f,'#e8ecf2']); }
  faces.push([near,'#cdd3dc']);
  // (the light is flush with the frame's faces now, so no inner sides of the posts are seen)
  D2={faces,open,jambs,key:proj(dmx,dmz)[1]};
}
function polyPath(ct,pg){ ct.beginPath(); ct.moveTo(pg[0][0],pg[0][1]); for(let i=1;i<pg.length;i++) ct.lineTo(pg[i][0],pg[i][1]); ct.closePath(); }
function drawDoor2(){
  if(!D2) return; ctx.save(); ctx.lineJoin='round';
  for(const f of D2.faces){ polyPath(ctx,f[0]); ctx.fillStyle=f[1]; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.lineWidth=1; ctx.stroke(); }
  polyPath(ctx,D2.open); ctx.fillStyle='#fffdf2'; ctx.fill();                                        // the opening, filled with light
  ctx.save(); polyPath(ctx,D2.open); ctx.clip(); for(const j of D2.jambs){ polyPath(ctx,j); ctx.fillStyle='#e9e6d6'; ctx.fill(); ctx.strokeStyle='rgba(150,150,160,.5)'; ctx.lineWidth=1; ctx.stroke(); } ctx.restore();
  ctx.restore();

    const i0=Math.floor(x0/sp)-1, i1=Math.ceil(x1/sp)+1, j0=Math.floor(z0/sp)-1, j1=Math.ceil(z1/sp)+1;
    if(nb>0) for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
      let rx=i*sp-camPx, rz=j*sp-camPz, dz=rx*fwdX+rz*fwdZ; if(dz<b.a-sp||dz>b.b+sp) continue;
      let cx=rx*rgtX+rz*rgtZ; if(Math.abs(cx)>dz*tanH+sp*4) continue;
      const r=h2(i,j+bi*7919), r2=h2(i+31,j-bi*131);
      const x=(i+(r-0.5)*0.9)*sp, z=(j+(r2-0.5)*0.9)*sp;
      rx=x-camPx; rz=z-camPz; dz=rx*fwdX+rz*fwdZ; if(dz<b.a||dz>=b.b||dz<dMin) continue; cx=rx*rgtX+rz*rgtZ;
      let gH=1; if(coast && level===1){ const cs=coastAlong(x,z); if(cs>0 && (coastA>=1 || h2(i+11,j+13)<coastA)){ const gf=1-cs/SAND_RAMP; if(gf<=0){ if(cs>SHORE-500 || h2(Math.floor(x/80)+3,Math.floor(z/80)-8)>0.075) continue; gH=0.5+0.5*h2(Math.floor(x/80)-5,Math.floor(z/80)+2); }   // out on the sand, only scattered clumps of dune grass
        else { if(h2(i+5,j+9+bi)>gf*gf) continue; gH=0.35+0.65*gf; } } }   // grass thins and shortens into the sand
      const s=focal/dz, bx=W/2+cx*s, by=horizon+(camY-ground(x,z))*s, lit=-(gSlopeX*SUNDX+gSlopeZ*SUNDZ);
      // rolling gusts: a slow wide swell plus a faster ripple, both travelling downwind
      const gust=clamp(0.5+0.36*Math.sin(x*0.0028+z*0.0042-time*1.5+Math.sin(z*0.0016+time*0.25)*2.2)+0.18*Math.sin(x*0.011-z*0.007-time*2.6),0,1);

      if(bi===0){ for(const k of kids){ const ddx=x-k.x, ddz=z-k.z, d=Math.hypot(ddx,ddz); if(d<50 && k.y<30){ const p=1-d/50; bend+=((ddx*rgtX+ddz*rgtZ)>=0?1:-1)*p*0.9; squash*=1-0.3*p; } } }
      const bn=Math.min(nbin-1,Math.floor((dz-b.a)/sp));
      const paths=bins[bn]||(bins[bn]=[new Path2D(),new Path2D(),new Path2D(),new Path2D(),new Path2D()]);
      if(level===2){   // cloud, not grass: each cell is a soft rounded lump with a paler crown, slowly swelling and settling
        const rr=h2(i*7,j*3+bi*977), cap=26+rr*12+Math.max(0,dz-500)*0.06, rw=Math.min(sp*(0.55+0.5*rr),cap)*(1+0.08*Math.sin(time*0.27+rr*17)), r=rw*s;

        else { p.moveTo(xb,by); p.quadraticCurveTo(qx,qy,tx,ty); }

    }

      ctx.fillStyle=groundColor(clamp(CAM_H*hk*focal/dz/(H-horizon),0,1), clamp(1+farP[NX+1]*1.8*(1-0.75*clamp((dz/hk-2500)/11000,0,1))*(1-hiF*clamp((dz-900)/2500,0,1)),0.72,1.25));
      ctx.beginPath(); ctx.moveTo(0,farP[0]-0.5);

      for(let i=NX;i>=0;i--) ctx.lineTo(i*W/NX,Math.max(nearP[i],farP[i])+1);
      ctx.fill();
      if(coast && level===1) coastStrip(dn+sp, dn, farP, nearP, NX, clamp(CAM_H*hk*focal/dz/(H-horizon),0,1), farP[NX+1]);

      }

  }

}

/* ---------- evening light + paper grain over everything ---------- */
const grain=(()=>{ const c=document.createElement('canvas'); c.width=c.height=220; const g=c.getContext('2d'); const d=g.createImageData(220,220); const r=rng(5);
  for(let i=0;i<d.data.length;i+=4){ const v=128+(r()-0.5)*150; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; } g.putImageData(d,0,0); return ctx.createPattern(c,'repeat'); })();
function drawLight(){
  const sx=clamp(sunX,-200,W+200), R=Math.max(W,H)*1.05;
  const l=ctx.createRadialGradient(sx,horizon,0,sx,horizon,R);
  l.addColorStop(0,'rgba(255,206,110,.85)'); l.addColorStop(0.45,'rgba(255,176,90,.3)'); l.addColorStop(1,'rgba(30,84,108,.5)');
  ctx.globalCompositeOperation='soft-light'; ctx.fillStyle=l; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.13; ctx.fillStyle=grain; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

/* ---------- sun position + lens flare ---------- */
function placeSun(){
  let d=SUN_B-camYaw; d=Math.atan2(Math.sin(d),Math.cos(d));
  sunX=Math.abs(d)<1.4 ? W/2+focal*Math.tan(d) : (d>0?W+2000:-2000);

// Ghosts sit on the line from the sun through the lead kid, so the flare swings across the
// frame as the kids move and is strongest when they run in front of the sun.
const GHOSTS=[[0.45,26,'190,240,140',.17],[0.8,14,'110,230,170',.16],[1.0,58,'210,240,150',.1],[1.35,22,'150,235,150',.14],[1.7,90,'120,220,170',.08],[2.1,38,'220,245,170',.09]];
function drawFlare(){
  if(sunI*(1-night)<=0.01) return;
  const lp=proj(lead.x,lead.z), s=focal/Math.max(60,lp[1]), kx=W/2+lp[0]*s, ky=horizon+(camY-ground(lead.x,lead.z))*s-(lead.y+45)*s;
  const q=H/650, sy=horizon-4*q, near=clamp(1-Math.abs(sunX-kx)/(W*0.55),0,1);
  const f=(1-night)*1.7*sunI*(0.4+0.6*near*near)*(0.93+0.07*Math.sin(time*2.3));
  ctx.save(); ctx.globalCompositeOperation='screen';
  ctx.save(); ctx.translate(sunX,sy); ctx.scale(1,0.06);
  const st=ctx.createRadialGradient(0,0,0,0,0,460*q); st.addColorStop(0,'rgba(228,250,190,'+0.5*f+')'); st.addColorStop(1,'rgba(190,240,150,0)');
  ctx.fillStyle=st; ctx.beginPath(); ctx.arc(0,0,460*q,0,7); ctx.fill(); ctx.restore();
  const hl=ctx.createRadialGradient(sunX,sy,95*q,sunX,sy,215*q); hl.addColorStop(0,'rgba(170,235,150,0)'); hl.addColorStop(0.5,'rgba(170,235,150,'+0.09*f+')'); hl.addColorStop(1,'rgba(170,235,150,0)');
  ctx.fillStyle=hl; ctx.beginPath(); ctx.arc(sunX,sy,215*q,0,7); ctx.fill();
  const dx=kx-sunX, dy=ky-sy;
  for(const gh of GHOSTS){
    const x=sunX+dx*gh[0], y=sy+dy*gh[0], R=gh[1]*q*1.8, a=gh[3]*f;
    const gr=ctx.createRadialGradient(x,y,0,x,y,R); gr.addColorStop(0,'rgba('+gh[2]+','+a+')'); gr.addColorStop(0.4,'rgba('+gh[2]+','+a*0.5+')'); gr.addColorStop(1,'rgba('+gh[2]+',0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,R,0,7); ctx.fill();

}

/* ---------- drifting seeds ---------- */
const seeds=[]; { const r=rng(99); for(let i=0;i<(calm<1?10:30);i++) seeds.push({u:r(),v:r(),sp:50+r()*110,sz:0.8+r()*1.4,ph:r()*6}); }
function drawSeeds(){
  ctx.fillStyle='rgba(255,246,214,.7)';
  for(const p of seeds){
    let x=(p.u*W+time*p.sp-camYaw*focal*0.5)%(W+40); if(x<0) x+=W+40;
    const y=p.v*H*0.9+Math.sin(time*1.3+p.ph)*18;
    ctx.beginPath(); ctx.ellipse(x-20,y,p.sz*2.4,p.sz*0.6,-0.25,0,7); ctx.fill();

}
function drawStick(){
  if(!stick||stick.far<10) return;
  const r=cv.getBoundingClientRect(), x0=stick.x0-r.left, y0=stick.y0-r.top;
  let dx=stick.x-stick.x0, dy=stick.y-stick.y0; const d=Math.hypot(dx,dy), m=Math.min(d,70); if(d>0){dx=dx/d*m;dy=dy/d*m;}
  ctx.strokeStyle='rgba(255,246,220,.55)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x0,y0,70,0,7); ctx.stroke();
  ctx.fillStyle='rgba(255,246,220,.7)'; ctx.beginPath(); ctx.arc(x0+dx,y0+dy,20,0,7); ctx.fill();

/* ---------- flamingos ---------- */
function drawBird(o,sx,sy,s){   // o: {hx,hz heading, ph, id, y absolute height, sc size}
  const cfx=o.hx*rgtX+o.hz*rgtZ, cfz=o.hx*fwdX+o.hz*fwdZ, S=(o.tiny?s:Math.max(s,0.17))*(o.sc||1.9), ph=o.ph;
  // seen a little from above (or from below when the camera is under the flock), so the wing surfaces show instead of lying edge-on
  const elev=clamp(Math.atan2(camY-o.y,Math.max(200,focal/s)),-0.7,0.7)+0.3, ce=Math.cos(elev), se=Math.sin(elev);
  const roll=o.roll||0, cr=Math.cos(roll), sr=Math.sin(roll);
  const P=(lat0,fwd,up0)=>{ const lat=lat0*cr+up0*sr, up=up0*cr-lat0*sr, d=-lat*cfx+fwd*cfz, k=S*(1-0.0065*d); return [sx+(lat*cfz+fwd*cfx)*k, sy-(up*ce+d*se)*k]; };
  const ln=(pts,col,w)=>{ ctx.strokeStyle=col; ctx.lineWidth=Math.max(1,w*S); ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.stroke(); };
  const poly=(pts,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(let j=1;j<pts.length;j++) ctx.lineTo(pts[j][0],pts[j][1]); ctx.closePath(); ctx.fill(); };
  const dot=(p,r,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.arc(p[0],p[1],Math.max(0.7,r*S),0,7); ctx.fill(); };
  const DARK='#2a1e24';
  // Wingbeat. Each bird keeps its own tempo; the down-stroke is quicker than the up-stroke; now and then a bird rests on a short glide.
  const glide=clamp((Math.sin(time*0.37+ph*3.1)-0.82)/0.12,0,1), beat=time*4.2*(0.92+0.16*h2(o.id,3))+ph, phi=beat+0.4*Math.sin(beat);
  // The body rides the wingbeat (up as the wings come down) while the head holds level, as a real bird's does; the neck takes up the difference.
  const bob=-Math.sin(phi)*2.6*(1-glide), sway=Math.sin(time*0.9+ph*2)*0.7;
  // The wing is four jointed parts: upper arm, forearm, hand and tip. Each joint follows the one before it a moment later,
  // so the beat travels out along the wing; on the up-stroke the outer parts fold, and the black flight feathers close up, then spread on the way down.
  // Unfolding from closed to full spread happens in three moves: the upper arm swings out from the body, then the forearm
  // straightens, then the hand opens and the flight feathers fan out. Folding runs the same three moves backwards.
  const open=o.open===undefined?1:o.open, ss=(a,b)=>{ const t=clamp((open-a)/(b-a),0,1); return t*t*(3-2*t); };
  const OP=[ss(0,0.42),ss(0.3,0.72),ss(0.58,1),ss(0.58,1)], FOLD=[-0.9,0.75,-0.95,-0.6], chord=0.4+0.6*(OP[0]+OP[1]+OP[2])/3;
  const amp=(1-0.82*glide)*OP[2], down=clamp(-Math.cos(phi),0,1)*amp, upst=clamp(Math.cos(phi),0,1)*amp, SEG=[16,15,14,13];
  const ang=[0,1,2,3].map(k=>Math.sin(phi-0.38*k)*(0.46+0.2*k)*amp+0.12*glide-upst*0.16*k);
  const wing=sd=>{
    const far=(-sd*cfx>0), base=far?'#ee8fb0':'#fbbccd', sec1=far?'#c93c6c':'#e8477a', sec2=far?'#d9578a':'#f0709a';
    const xs=[3], us=[2+bob], fs=[0];
    for(let k=0;k<4;k++){ const e=OP[k]; xs.push(xs[k]+SEG[k]*Math.cos(ang[k])*e); us.push(us[k]+SEG[k]*Math.sin(ang[k])*e); fs.push(fs[k]+SEG[k]*FOLD[k]*(1-e)*0.55); }   // a closed part lies folded along the body
    // a point on the wing: t runs 0..4 along the four parts, f is how far forward of the spar it sits
    const Wp=(t,f)=>{ const k=Math.min(3,Math.floor(t)), r=t-k; return P(sd*(xs[k]+(xs[k+1]-xs[k])*r), f*chord+fs[k]+(fs[k+1]-fs[k])*r, us[k]+(us[k+1]-us[k])*r); };
    poly([Wp(0,9),Wp(1,8.5),Wp(2,7.5),Wp(2,-4),Wp(1,-4.5),Wp(0,-5)],base);                      // coverts on the arm
    for(let j=0;j<7;j++){ const t0=j*2/7, t1=(j+1)*2/7; poly([Wp(t0,-4),Wp(t1,-4),Wp(t1,-15),Wp((t0+t1)/2,-17.5),Wp(t0,-14.5)], j%2?sec2:sec1); }   // crimson secondaries, scalloped
    poly([Wp(2,7.5),Wp(3,5.5),Wp(3.3,3.5),Wp(3.1,-2.5),Wp(2,-4)],base);                         // coverts on the hand
    ctx.shadowColor='rgba(42,30,36,.85)'; ctx.shadowBlur=lowFx?0:clamp(5*S,2,9);                       // soft, slightly blurred edges on the black feathers
    for(let j=0;j<8;j++){ const tr=2.05+j*0.13, tt=Math.min(4,2.5+j*0.215), ft=(-17+j*2.1)*(0.72+0.5*down)*(0.35+0.65*OP[3]);   // black primaries fanning to the tip
      poly([Wp(tr,0.5),Wp(tr+0.12,-1.5),Wp(Math.min(4,tt+0.1),ft-1.7),Wp(tt,ft)],'rgba(42,30,36,.8)'); }
    ctx.shadowBlur=0;
    ln([Wp(0,9),Wp(1,8.5),Wp(2,7.5),Wp(3,5.5),Wp(3.3,3.5)], far?'#f09ab0':'#ffd3dc',1.1);       // light leading edge
    for(let j=1;j<6;j++) ln([Wp(j/3,6.5),Wp(j/3,-3)], far?'#d6688a':'#ee8fa6',0.5);             // rows of covert feathers
  };
  const legs=()=>{ for(const o of [-1.4,1.4]){                                                  // held straight; only the hips ride the body
    const hp=P(o,-9,-2+bob), kn=P(o,-27,-2.4+bob*0.6), ft=P(o,-44,-2.2+bob*0.3);
    ln([hp,kn],'#ee5f8c',1.6); dot(kn,1.15,'#dc4c7c'); ln([kn,ft],'#ee5f8c',1.35);
    poly([P(o-1.7,-44,-2.2+bob*0.3),P(o+1.7,-44,-2.2+bob*0.3),P(o,-48.5,-2.5+bob*0.25)],'#d0406f'); } };
  const body=()=>{
    const tail=()=>poly([P(-3.6,-8,1.5+bob),P(3.6,-8,1.5+bob),P(1.6,-19,0.8+bob*0.8),P(0,-22,1+bob*0.75),P(-1.6,-19,0.8+bob*0.8)],'#e2557f');
    if(cfz<=0) tail();
    { const a=P(0,-10.5,0.2+bob), b=P(0,11,0.9+bob), cx=(a[0]+b[0])/2, cy=(a[1]+b[1])/2, L=Math.hypot(b[0]-a[0],b[1]-a[1])/2, rot=Math.atan2(b[1]-a[1],b[0]-a[0]), w=5.6*S, R=Math.max(L,w);   // a full rounded body, darker along the belly
      const el=(dy,k,col)=>{ ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(cx,cy+dy*S,R*k,w*k,rot,0,7); ctx.fill(); };
      el(1.3,1,'#e46f99'); el(-0.5,0.96,'#f58fb0'); }
    ln([P(0,-5,2.9+bob),P(0,7,3.4+bob)],'#fcc6d5',3.2);                                                    // the pale back
    if(cfz>0) tail();                                                                           // flying away: the tail is the nearest part of the body
  };
  const neck=()=>{
    { const cl=[0,sway*0.5,sway,sway*0.4], cf=[9,18,27,35.5], cu=[1.5+bob,5.2+bob*0.62,4.2+bob*0.25,2.7], pts=[];   // one smooth line, stretched out ahead
      for(let i=0;i<=9;i++){ const t=i/9, a=(1-t)*(1-t)*(1-t), b=3*(1-t)*(1-t)*t, c=3*(1-t)*t*t, d=t*t*t; pts.push(P(b*cl[1]+c*cl[2]+d*cl[3], a*cf[0]+b*cf[1]+c*cf[2]+d*cf[3], a*cu[0]+b*cu[1]+c*cu[2]+d*cu[3])); }
      ln(pts,'#f48aab',3.5); ln(pts.slice(3),'#fbbdcd',1.3); }
    const h=P(0,37.5,2.8), hk=1-0.0065*37.5*cfz;
    const bill=()=>{ ln([P(0,39.4,2.7),P(0,42.4,2.6),P(0,44.6,1.9)],'#fbe3da',3.3*hk); ln([P(0,44.6,1.9),P(0,46.1,0.6),P(0,45.5,-1.5)],DARK,2.4*hk); };   // pale bill hooking down to a black tip
    if(cfz>0.15){ if(cfz<0.72) bill(); dot(h,3.4*hk,'#f58fb0'); }                               // from behind: the bill is hidden past the head and no eyes show
    else { dot(h,3.3*hk,'#f79bb8'); for(const o of [-1.7,1.7]){ const e=P(o,38.6,3.5); dot(e,1*hk,'#fff3c8'); dot(e,0.5*hk,DARK); } bill(); }
    if(Math.abs(cfx)>0.35 && cfz>-0.6 && S>0.3) dot(P(-far*1.9,38.2,3.7),0.75*hk,DARK);        // the eye, seen from the side
  };
  const far=cfx>0?-1:1;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(cfz>0){ neck(); wing(far); body(); wing(-far); legs(); } else { legs(); wing(far); body(); wing(-far); neck(); }
}

function drawBirdFar(i,sx,sy,s){   // a far-off bird: a pink stroke for the body and two flapping wing strokes, all pink

  a*=1-skyA*clamp((lead.y-30+ahead*0.5-(SKY_TOP-500))/500,0,1);                                                   // and is lost in the cloud above
  if(coast) a*=clamp((SHORE-2800-alongRoad(pathPx+SUNDX*t,pathPz+SUNDZ*t))/1400,0,1);                                    // the road ends where the sand begins
  if(a<=0.01 || h2(j,31)<0.16) return null;                                                                        // gaps and clumps, so the lines never look ruled
  const e0=clamp(pathA*1.7-clamp(ahead/30000,0,1)*0.7,0,1), e=e0*e0*(3-2*e0);                                     // nearest feathers fall into place first
  const side=h2(j,5)<0.5?-1:1, far=(h2(j,37)-0.5)*2, wob=side*(ROAD_HALF+Math.sin(t*0.0013+side)*70)+(h2(j,17)-0.5)*200+Math.sin(time*0.6+j*1.7)*14*e+far*2200*(1-e);   // two loose lines, one down each side, with the middle left empty
  let x=pathPx+SUNDX*t+SUNDZ*wob, z=pathPz+SUNDZ*t-SUNDX*wob, h=(hgt+h2(j,23)*70)*e+Math.sin(time*0.9+j)*10*e*clamp(u/800,0,1);
  const dx=x-lead.x, dz=z-lead.z, dy=(62+h)-(lead.y+40), d=Math.hypot(dx,dz,dy);
  if(d<150 && d>1){ const p=(1-d/150)*95/d; x+=dx*p; z+=dz*p; h=Math.max(0,h+dy*p); }                             // scatter around the kids as they pass
  return {x,z,h,ph:h2(j,3),trail:true,a:a*(0.55+0.45*e)};
}

/* ---------- night: a blue moonlight grade over the finished frame, then the things that give light ---------- */
function nightGrade(){
  const n=night; if(n<=0.005){ GLOWS.length=0; FARDOTS.length=0; return; }
  // dusk passes through a dusty violet on the way to moonlit blue
  const c = n<0.5 ? mix([255,255,255],[168,128,166],n*2) : mix([168,128,166],[44,74,158],(n-0.5)*2);
  ctx.globalCompositeOperation='multiply'; ctx.fillStyle=c; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='screen'; ctx.fillStyle='rgba(4,8,30,'+n+')'; ctx.fillRect(0,0,W,H);
  const sa=clamp((n-0.45)/0.55,0,1);
  for(let i=0;i<NSTARS.length;i+=4){ if(NSTARS[i+1]>RIDGE[Math.min(511,(NSTARS[i]+40)>>3)]-3 || behindCloud(NSTARS[i],NSTARS[i+1]) || groundHides(NSTARS[i],NSTARS[i+1],1e9)) continue;
    ctx.fillStyle='rgba(215,228,255,'+0.75*NSTARS[i+3]*sa+')'; ctx.beginPath(); ctx.arc(NSTARS[i],NSTARS[i+1],NSTARS[i+2]*0.75,0,7); ctx.fill(); }
  const mx=clamp(sunX,-400,W+400), my=moonY, q=H/650, ma=level===2?0:clamp((n-0.3)/0.7,0,1)*clamp(moonUp*5,0.25,1)*(1-fogNow())*(1-0.8*ceilNear());   // cloud between the kids and the moon dims it
  let g=ctx.createRadialGradient(mx,my,0,mx,my,Math.max(W,H)*0.75); g.addColorStop(0,'rgba(150,180,255,'+0.42*ma+')'); g.addColorStop(0.12,'rgba(110,145,235,'+0.14*ma+')'); g.addColorStop(1,'rgba(90,120,220,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // moonlight lying across the field below the moon
  // a pool of light that just touches the horizon and is brightest out on the field, so it has no edge anywhere
  { const ry=(H-horizon)*0.62, rx=W*0.4; ctx.save(); ctx.translate(mx,horizon+ry); ctx.scale(rx/ry,1); g=ctx.createRadialGradient(0,0,0,0,0,ry);
    g.addColorStop(0,'rgba(170,200,255,'+0.2*ma+')'); g.addColorStop(0.55,'rgba(170,200,255,'+0.11*ma+')'); g.addColorStop(1,'rgba(170,200,255,0)');
    ctx.fillStyle=g; ctx.fillRect(-ry,-ry,ry*2,ry*2); ctx.restore(); }
  // feathers give off their own light
  for(let i=0;i<GLOWS.length;i+=4){ if(glowHidden(GLOWS[i],GLOWS[i+1],GLOWS[i+3]) || groundHides(GLOWS[i],GLOWS[i+1],GLOWS[i+3])) continue; const R=GLOWS[i+2]; g=ctx.createRadialGradient(GLOWS[i],GLOWS[i+1],0,GLOWS[i],GLOWS[i+1],R);
    g.addColorStop(0,'rgba(255,190,214,'+0.85*n+')'); g.addColorStop(0.25,'rgba(255,150,190,'+0.4*n+')'); g.addColorStop(1,'rgba(255,150,190,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(GLOWS[i],GLOWS[i+1],R,0,7); ctx.fill(); }
  GLOWS.length=0;
  for(let i=0;i<FARDOTS.length;i+=4){ if(glowHidden(FARDOTS[i],FARDOTS[i+1],FARDOTS[i+3]) || groundHides(FARDOTS[i],FARDOTS[i+1],FARDOTS[i+3])) continue; const a=FARDOTS[i+2]*n, k=clamp(1-(FARDOTS[i+3]-3000)/38000,0.3,1);   // smaller the farther off
    ctx.fillStyle='rgba(255,170,200,'+(0.26*a*k).toFixed(3)+')'; ctx.fillRect(FARDOTS[i]-3*k,FARDOTS[i+1]-3*k,6*k,6*k);
    ctx.fillStyle='rgba(255,224,234,'+(0.85*a).toFixed(3)+')'; ctx.fillRect(FARDOTS[i]-1.2*k,FARDOTS[i+1]-1.2*k,2.4*k,2.4*k); }
  FARDOTS.length=0;
  if(level!==2 && sunI>0.01 && n>0.02 && my-34*q<horizon+6){ const mo=clamp(n*1.6,0,1)*(1-fogNow())*(1-0.8*ceilNear()), R=30*q;
    ctx.globalCompositeOperation='source-over'; ctx.save();
    // it rises and sets behind the mountains, or out of the sea where they have parted
    { const cp=new Path2D(), xa=mx-R*1.5, xb=mx+R*1.5; cp.moveTo(xa,-10); for(let x=xa;x<=xb+8;x+=8) cp.lineTo(x,Math.min(RIDGE[clamp((x+40)>>3,0,511)]+1, STRN?skyAt(0,x):1e9)); cp.lineTo(xb+8,-10); cp.closePath(); ctx.clip(cp); }
    if(BOXV){ const bp=new Path2D(), h=BOXV.hull; bp.rect(-10,-10,W+20,H+20); bp.moveTo(h[0][0],h[0][1]); for(let i=1;i<h.length;i++) bp.lineTo(h[i][0],h[i][1]); bp.closePath(); ctx.clip(bp,'evenodd'); }   // and never shines through the box
    ctx.globalAlpha=sunI*mo*0.16; ctx.fillStyle='rgb(214,220,246)'; ctx.beginPath(); ctx.arc(mx,my,R*1.3,0,7); ctx.fill();    // a pale ring of haze close around it
    ctx.globalAlpha=sunI*mo; ctx.imageSmoothingEnabled=false; ctx.drawImage(moonArt||(moonArt=paintMoon()), mx-R, my-R, R*2, R*2); ctx.imageSmoothingEnabled=true;
    // the moon is far beyond the clouds: paint the clouds again over the disc so they pass in front of it
    ctx.save(); ctx.beginPath(); ctx.arc(mx,my,31*q,0,7); ctx.clip(); ctx.globalAlpha=Math.min(1,ma*1.4)*0.8; drawClouds(clouds,0,0.7,0.74,nightClouds()); ctx.restore();   // slightly see-through, so the cloud looks lit from behind
    if(FRONT.length){   // the kids and birds crossing the disc, painted again in night colours in front of the moon
      const R=moonR, x0=Math.floor(moonX-R), y0=Math.floor(moonY-R), sz=Math.ceil(R*2*DPR)+2;
      if(fcv.width!==sz){ fcv.width=fcv.height=fcv2.width=fcv2.height=sz; }
      fctx.setTransform(1,0,0,1,0,0); fctx.clearRect(0,0,sz,sz); fctx.setTransform(DPR,0,0,DPR,-x0*DPR,-y0*DPR);
      ctx=fctx; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
      try{ for(const fn of FRONT) fn(); } finally { ctx=mainCtx; }
      fctx2.globalCompositeOperation='copy'; fctx2.drawImage(fcv,0,0);
      fctx.setTransform(1,0,0,1,0,0); fctx.globalCompositeOperation='multiply'; fctx.fillStyle=c; fctx.fillRect(0,0,sz,sz);
      fctx.globalCompositeOperation='screen'; fctx.fillStyle='rgba(4,8,30,'+n+')'; fctx.fillRect(0,0,sz,sz);
      fctx.fillStyle='rgba(150,180,255,'+0.22*ma+')'; fctx.fillRect(0,0,sz,sz);
      fctx.globalCompositeOperation='destination-in'; fctx.drawImage(fcv2,0,0); fctx.globalCompositeOperation='source-over';
      ctx.save(); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.beginPath(); ctx.arc(mx,my,31*q,0,7); ctx.clip();
      ctx.drawImage(fcv,x0,y0,sz/DPR,sz/DPR); ctx.restore();
    }
    ctx.restore(); ctx.globalAlpha=1; }
  ctx.globalCompositeOperation='source-over';
}

/* ---------- test buttons: shown only when the address ends in #test ---------- */
{ const box=document.getElementById('test'), show=()=>{ box.hidden=location.hash!=='#test'; };
  show(); addEventListener('hashchange',show);
  const give=(n)=>{ startSound(); for(let i=0;i<n && mates.length<MATES_MAX;i++){ const k=mates.length; addMate(lead.x-headX*(90+k*30)+headZ*(k%2?50:-50), lead.z-headZ*(90+k*30)-headX*(k%2?50:-50), 0, headX, headZ); mateMsgT=time; } cv.focus(); };
  // the first button switches the whole flock on and off; switching it off also rewinds the music so it can start again
  const fb=document.getElementById('testFlock'), label=()=>{ fb.textContent=mates.length>=MATES_MAX?'Test: remove flock':'Test: full flock'; };
  const clear=()=>{ mates.length=0; mateMsgT=-99; if(lead.fly){ flyStart=-9; land(); } if(padEl){ padEl.pause(); try{ padEl.currentTime=0; }catch(e){} } padPlayed=false; cv.focus(); };
  fb.addEventListener('click',()=>{ if(mates.length>=MATES_MAX) clear(); else give(MATES_MAX); label(); });
  setInterval(label,500);
  { const bs=document.getElementById('buildStamp'), b0=bs.textContent; setInterval(()=>{ if(!box.hidden) bs.textContent=b0+' · flock '+mates.length+' · clock '+Math.round((((time+dayOffset)%DAY_LEN)+DAY_LEN)%DAY_LEN)+(nightOn?'':' (waiting)')+' · night '+night.toFixed(2)+(whales?' · whales '+whMs.toFixed(0)+' ms':''); },500); }
  document.getElementById('testOne').addEventListener('click',()=>give(1));
  // straight to deep night with a full flock and the feather road already laid from where the kids stand
  document.getElementById('testRoad').addEventListener('click',()=>{ give(MATES_MAX); label(); nightOn=true; dayOffset=EVENING+DUSK+5-time; pathPx=lead.x; pathPz=lead.z; pathA=1; cv.focus(); });
  document.getElementById('testSea').addEventListener('click',()=>{ document.getElementById('testRoad').click(); if(!coast){ makeCoast(5200); coastA=1; } });
  document.getElementById('testDoor').addEventListener('click',()=>{ document.getElementById('testRoad').click(); if(!coast) makeCoast(5200);
    setTimeout(()=>{ if(!coast||level!==1) return; coastA=1; sea=1; const c=boxC(); for(const k of kids){ k.x=c[0]-SUNDX*(BOX_HALF+1500)+(k===lead?0:40); k.z=c[1]-SUNDZ*(BOX_HALF+1500); k.fly=false; k.glide=false; k.vy=0; k.y=0; } focX=lead.x; focZ=lead.z; camYaw=SUN_B; headX=SUNDX; headZ=SUNDZ; },300); cv.focus(); });
  document.getElementById('testClouds').addEventListener('click',()=>{ if(level===2) return; document.getElementById('testDoor').click(); setTimeout(()=>{ if(level===1 && coast) throughDoor(); },700); });
  document.getElementById('testCross').addEventListener('click',()=>{ whCrossT=0; cv.focus(); });
  document.getElementById('testBeach').addEventListener('click',()=>{ document.getElementById('testRoad').click(); if(!coast) makeCoast(5200);
    setTimeout(()=>{ if(!coast||arrived) return; coastA=1; sea=1; const d=SHORE-5200-alongRoad(lead.x,lead.z); for(const k of kids){ k.x+=SUNDX*d; k.z+=SUNDZ*d; } for(const m of mates){ m.x+=SUNDX*d; m.z+=SUNDZ*d; }
      camYaw=SUN_B; headX=SUNDX; headZ=SUNDZ; if(!lead.fly){ hop(); setTimeout(hop,250); } },300); cv.focus(); });
  // back to the very beginning: no flamingos, no feathers, daylight, the mountains closed and no beach
  document.getElementById('testReset').addEventListener('click',()=>{ clear(); feathers=0; got.clear(); gotBlue.clear(); boostT=0; flock=null; flockN=0; nextFlock=time+FLOCK_FIRST;
    nightOn=false; dayOffset=-time; sea=0; coast=false; coastA=0; arrived=false; shore.length=0; pathA=0; pathAlign=0; skyT=0; skyOpen=false; level=1; landed2=false; landT=-99;
    for(const k of kids){ k.fly=false; k.glide=false; k.y=0; k.vy=0; } nb.textContent='Test: go to dusk'; label(); cv.focus(); });
  const nb=document.getElementById('testNight');
  nb.addEventListener('click',()=>{ const toDay=night>0.3; nightOn=true; dayOffset=(toDay?0:EVENING)-time; nb.textContent=toDay?'Test: go to dusk':'Test: back to day'; cv.focus(); });
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const raw=Math.max(0,(now-last)/1000), dt=Math.min(0.05,raw); last=now;
  slow = raw>0.03 ? slow+raw : Math.max(0,slow-raw);
  if(slow>1.2){ slow=0; if(dprCap>1){ dprCap=1; resize(); } else if(bladeCut<1) bladeCut=1; else lowFx=true; }
  requestAnimationFrame(frame);          // booked first, so one bad frame can never stop the game
  try{
    update(dt); updateNight(); updatePath(dt); updateSky(dt); updateCoast(dt); placeSun(); updateRunSound(); updateFlamSound(); updateMusic(); updateFastSound(); updateOceanSound(); updateWhaleSound();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    drawSky(); drawClouds(clouds,0,0.7,0.74); drawMountains(); drawGround(); coastFar(); drawSea(false); drawTreeline(); moonSetup(); drawCeiling(); drawSkyClouds(true); drawWorld(); drawDeck(); drawSkyClouds(false); drawFog(); drawSeeds(); drawLight(); nightGrade(); seaGlints(); drawGlints(); drawBoxShine(); drawDoorLight(); drawFlare(); drawLevelSign(); drawHud(); drawStick();
  }catch(err){
    if(!frame.warned){ frame.warned=true; console.error('Flamingo Fields frame error:',err); }
    ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.shadowBlur=0;
  }
}
let lowFx=false;   // last quality step on slow devices: drop the soft blur on the birds' black feathers
function start(saved){
  if(saved && saved.kids){ saved.kids.forEach((p,i)=>{ if(kids[i]){ kids[i].x=p.x; kids[i].z=p.z; } }); focX=lead.x; focZ=lead.z; }
  if(saved && saved.mates) for(let i=0;i<Math.min(MATES_MAX,saved.mates);i++) addMate(lead.x-60-i*30,lead.z-90-i*20,0,0,1);
  // carried over from a page that was open: with four or more flamingos the night has begun (or begins now); with fewer, the day still waits
  if(saved && mates.length>=4){ nightOn=true; dayOffset=(saved.day>=EVENING-10?saved.day:EVENING-10)-time; }
  camY=ground(lead.x,lead.z)+CAM_H;
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot) hot.snapshot(()=>({kids:kids.map(k=>({x:k.x,z:k.z})), mates:mates.length, day:(time+dayOffset)%DAY_LEN}));
if(hot&&hot.ready) hot.ready(start); else start((hot&&hot.data)||{});
})();
