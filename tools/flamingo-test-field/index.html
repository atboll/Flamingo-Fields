<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flamingo Test Field</title>
<style>
:root{ --ink:#2c2a24; --panel:rgba(250,246,234,0.9); --line:rgba(60,50,30,0.18); --accent:#c2506e; --dark:#3d4a52; --muted:#5a5446; color-scheme:light }
html,body{ height:100%; margin:0; overflow:hidden; background:#e9c79a; font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink) }
[hidden]{ display:none!important }
#view{ position:fixed; inset:0; touch-action:none }
#view canvas{ display:block; width:100%; height:100% }
.hud{ position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top,0px)); max-width:min(340px,calc(100vw - 24px)); max-height:calc(100vh - 40px); overflow:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:9px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px) }
.head{ display:flex; align-items:center; justify-content:space-between; gap:10px }
h1{ margin:0; font-size:15px; font-weight:650; letter-spacing:.01em }
h2{ margin:2px 0 0; font-size:11px; font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--muted) }
#state{ color:var(--accent); font-weight:600; font-size:13px }
.keys{ margin:0; font-size:12.5px; color:var(--muted) }
.row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center }
.row span{ font-size:12px; color:var(--muted); min-width:58px }
button{ font:inherit; font-size:12.5px; border:1px solid var(--line); background:#fffdf7; color:var(--ink); border-radius:7px; padding:5px 9px; cursor:pointer }
button[aria-pressed="true"]{ background:var(--dark); color:#fff; border-color:var(--dark) }
button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px }
.sl{ display:grid; grid-template-columns:70px 1fr 44px; gap:6px; align-items:center; font-size:12px; color:var(--muted) }
.sl input{ width:100%; min-width:0; accent-color:var(--dark) }
.sl output{ font:12px ui-monospace,Menlo,monospace; text-align:right }
#legNums{ font:11px ui-monospace,Menlo,monospace; color:var(--muted); word-break:break-all; user-select:all }
#load{ position:fixed; inset:0; display:grid; place-items:center; color:var(--muted); font-size:15px; pointer-events:none }
#fps{ position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); font:12px ui-monospace,Menlo,monospace; color:var(--muted); background:var(--panel); border-radius:6px; padding:3px 7px }
</style>
</head>
<body>
<div id="view"></div>
<div id="load">Loading the flamingo…</div>
<div class="hud" id="hud">
  <div class="head"><h1>Flamingo Test Field</h1><button type="button" id="hide" aria-expanded="true" aria-controls="body">Hide</button></div>
  <div id="state">Loading</div>
  <div id="body" style="display:flex;flex-direction:column;gap:9px">
    <p class="keys">Drag to turn the camera round the bird, wheel or pinch to zoom. Start and stop moves run into their loop by themselves.</p>
    <h2>Standing</h2>
    <div class="row"><button type="button" data-anim="idle_A1" aria-pressed="true">Idle 1</button><button type="button" data-anim="idle_A2">Idle 2</button><button type="button" data-anim="idle_B1">Idle 3</button></div>
    <h2>One leg</h2>
    <div class="row"><button type="button" id="oneLeg" aria-pressed="false">Stand on one leg</button><span>Leg</span><button type="button" data-side="L" aria-pressed="true">Left</button><button type="button" data-side="R">Right</button></div>
    <div id="legSl"></div>
    <div id="legNums"></div>
    <h2>Walking</h2>
    <div class="row"><button type="button" data-anim="walk_start_A">Start</button><button type="button" data-anim="walk_A1">Walk</button><button type="button" data-anim="walk_end_A">Stop</button></div>
    <h2>Flying</h2>
    <div class="row"><button type="button" data-anim="fly_start_A">Take off</button><button type="button" data-anim="fly_A1">Flap</button><button type="button" data-anim="fly_A2">Fly 2</button><button type="button" data-anim="fly_A3">Fly 3</button><button type="button" data-anim="fly_end_A">Land</button></div>
    <h2>Feeding</h2>
    <div class="row"><button type="button" data-anim="foraging_start_A">Head down</button><button type="button" data-anim="foraging_A1">Feed</button><button type="button" data-anim="foraging_end_A">Head up</button></div>
    <h2>View</h2>
    <div class="row"><span>Camera</span><button type="button" data-cam="side" aria-pressed="true">Side</button><button type="button" data-cam="front">Front</button><button type="button" data-cam="above">Above</button></div>
    <div class="row"><span>Speed</span><button type="button" data-spd="1" aria-pressed="true">Normal</button><button type="button" data-spd="0.3">Slow motion</button></div>
    <div class="row"><span>Light</span><button type="button" data-light="evening" aria-pressed="true">Evening</button><button type="button" data-light="day">Day</button></div>
    <div class="row"><span>Birds</span><button type="button" data-flock="0" aria-pressed="true">One</button><button type="button" data-flock="1">Flock of 10</button></div>
  </div>
</div>
<div id="fps" aria-live="off"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script>
/* Flamingo Test Field: the American flamingo model (from FAB), slimmed for the web, with its own animations,
   in the 3D game's evening light. Built to judge how it looks and moves before it goes into the game. */
const $=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true}); R.setPixelRatio(Math.min(devicePixelRatio,2)); R.outputEncoding=THREE.sRGBEncoding;
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap; $('view').appendChild(R.domElement);
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(40,1,0.05,4000);
const hemi=new THREE.HemisphereLight(0xffe2b8,0x8a6428,0.85); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffcf8e,1.2); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:0.5,far:60}); sun.shadow.bias=-0.0005; scene.add(sun,sun.target);
const LIGHTS={ evening:{top:[42,138,136],mid:[147,199,158],hor:[240,216,152],ground:'#d9ae55',hemiSky:0xffe2b8,hemiGround:0x8a6428,hemi:0.85,sun:0xffcf8e,sunI:1.2,el:0.2},
               day:{top:[96,160,206],mid:[160,200,220],hor:[226,232,224],ground:'#c9b26a',hemiSky:0xf4f7ff,hemiGround:0x7f7650,hemi:0.9,sun:0xfff4e0,sunI:1.1,el:0.9} };
/* the sky, the game's gradient */
const skyU={uTop:{value:new THREE.Color()},uMid:{value:new THREE.Color()},uHor:{value:new THREE.Color()}};
scene.add(new THREE.Mesh(new THREE.SphereGeometry(2000,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:skyU,
  vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vD; uniform vec3 uTop,uMid,uHor; void main(){ float e=normalize(vD).y; vec3 c=e<0.0?uHor:mix(uHor,uMid,smoothstep(0.0,0.12,e)); c=mix(c,uTop,smoothstep(0.12,0.5,e)); gl_FragColor=vec4(c,1.0); }`})));
const ground=new THREE.Mesh(new THREE.CircleGeometry(400,64),new THREE.MeshLambertMaterial({color:'#d9ae55'})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
scene.fog=new THREE.Fog(0xf0d898,30,260);
function setLight(n){ const L=LIGHTS[n], c=a=>new THREE.Color(a[0]/255,a[1]/255,a[2]/255);
  skyU.uTop.value.copy(c(L.top)); skyU.uMid.value.copy(c(L.mid)); skyU.uHor.value.copy(c(L.hor)); scene.fog.color.copy(c(L.hor)).convertSRGBToLinear();
  ground.material.color.set(L.ground); hemi.color.set(L.hemiSky); hemi.groundColor.set(L.hemiGround); hemi.intensity=L.hemi; sun.color.set(L.sun); sun.intensity=L.sunI;
  sun.userData.dir=new THREE.Vector3(-Math.sin(0.64)*Math.cos(L.el),Math.sin(L.el),Math.cos(0.64)*Math.cos(L.el)); }
setLight('evening');

/* ---------- the bird ---------- */
const TL=new THREE.TextureLoader(), tex=f=>{ const t=TL.load('assets/'+f); t.anisotropy=8; return t; };
const T={ color:tex('flamingo_color.jpg'), normal:tex('flamingo_normal.jpg'), shape:tex('feather_shape.webp'), fnormal:tex('feather_normal.jpg') };
T.color.encoding=THREE.sRGBEncoding;
/* the texture coordinates came over from the FBX file as they were, so the textures are flipped as for FBX */
/* the feather cards: their colour comes from the first texture coordinates, their outline and shading from the second.
   three.js reads the shading (aoMap) from the second set; the outline (its alpha) and the feather's own bumps are read there too. */
function featherMat(){ const m=new THREE.MeshStandardMaterial({map:T.color, aoMap:T.shape, aoMapIntensity:0.9, normalMap:T.fnormal, roughness:0.85, side:THREE.DoubleSide, alphaTest:0.18});
  m.onBeforeCompile=sh=>{ sh.fragmentShader=sh.fragmentShader
      .replace('#include <alphamap_fragment>','diffuseColor.a*=texture2D(aoMap,vUv2).a;')
      .replace('#include <normal_fragment_maps>',THREE.ShaderChunk.normal_fragment_maps.replace(/vUv\b/g,'vUv2')); };
  return m; }
const bodyMat=new THREE.MeshStandardMaterial({map:T.color, normalMap:T.normal, roughness:0.8});
const eyeMat=new THREE.MeshStandardMaterial({map:T.color, roughness:0.25});
let proto, clips={};
async function loadBird(){
  /* the plain .glb when served (the repo); otherwise the gzipped base64 copy (artifacts can't serve .glb) */
  const get=async f=>{ try{ const r=await fetch('assets/'+f); if(r.ok){ const a=await r.arrayBuffer(); if(new TextDecoder().decode(new Uint8Array(a,0,4))==='glTF') return a; } }catch(e){}
    const t=await (await fetch('assets/'+f+'.gz.b64.txt')).text(); const b=atob(t.trim()), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); };
  const g=await new Promise(async(res,rej)=>new THREE.GLTFLoader().parse(await get('flamingo.glb'),'',res,rej));
  proto=g.scene; proto.scale.setScalar(0.01);                                              /* the model is in centimetres */
  const drop=[]; proto.traverse(n=>{ if(n.isMesh&&/^Plane/.test(n.name)) drop.push(n); }); drop.forEach(n=>n.parent.remove(n));   /* a stray flat sheet that came with the model */
  proto.traverse(n=>{ if(!n.isMesh) return; n.frustumCulled=false;
    if(/feather|wings/.test(n.name)||/feather/.test([].concat(n.material)[0].name)){ n.material=featherMat(); n.castShadow=false; }
    else { n.material=[].concat(n.material).map(m=>/eye/.test(m.name)?eyeMat:bodyMat); if(n.material.length===1) n.material=n.material[0]; n.castShadow=true; } });
  for(const a of g.animations) clips[a.name]=a;
}
/* ---------- one bird, and its moves ---------- */
const NEXT={walk_start_A:'walk_A1',fly_start_A:'fly_A1',foraging_start_A:'foraging_A1',walk_end_A:'idle_A1',fly_end_A:'idle_A1',foraging_end_A:'idle_A1'};
const NAMES={idle_A1:'Standing',idle_A2:'Standing, looking round',idle_B1:'Standing, preening',walk_start_A:'Starting to walk',walk_A1:'Walking',walk_end_A:'Stopping',
  fly_start_A:'Taking off',fly_A1:'Flying, flapping',fly_A2:'Flying 2',fly_A3:'Flying 3',fly_end_A:'Landing',foraging_start_A:'Head down to feed',foraging_A1:'Feeding',foraging_end_A:'Head up'};
function makeBird(){ const o=THREE.SkeletonUtils.clone(proto), b={o,mixer:new THREE.AnimationMixer(o),act:null,name:'',lift:0};
  b.o.traverse(n=>{ if(n.isMesh){ n.frustumCulled=false; } }); scene.add(o); return b; }
const FLAP=0.75;   /* every flamingo's wingbeat, a quarter slower than the model's own (as in the game) */
function play(b,name,fade=0.3){ const a=b.mixer.clipAction(clips[name]); if(b.act===a) return; a.timeScale=/^fly_A/.test(name)?FLAP:1;
  a.reset(); a.setLoop(NEXT[name]?THREE.LoopOnce:THREE.LoopRepeat); a.clampWhenFinished=!!NEXT[name]; a.play();
  if(b.act) b.act.crossFadeTo(a,fade,false); b.act=a; b.name=name; }
let bird, flock=[], flockOn=false, slow=1, camMode='side', orbit={yaw:-1.2,pitch:0.15,dist:3.4};
function choose(name){ play(bird,name); $('state').textContent=NAMES[name]||name;
  document.querySelectorAll('[data-anim]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.anim===name))); }

/* ---------- controls ---------- */
function group(attr,fn){ document.querySelectorAll('['+attr+']').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('['+attr+']').forEach(x=>x.setAttribute('aria-pressed',String(x===btn))); fn(btn.getAttribute(attr)); })); }
document.querySelectorAll('[data-anim]').forEach(btn=>btn.addEventListener('click',()=>{ if(bird) choose(btn.dataset.anim); }));
group('data-cam',v=>{ camMode=v; orbit.yaw={side:-1.2,front:0.25,above:-1.0}[v]; orbit.pitch={side:0.15,front:0.12,above:1.0}[v]; });
group('data-spd',v=>{ slow=+v; });
group('data-light',v=>setLight(v));
group('data-flock',v=>{ flockOn=v==='1'; if(flockOn&&!flock.length) buildFlock(); for(const f of flock) f.o.visible=flockOn; });
$('hide').addEventListener('click',()=>{ const b=$('body'), open=b.hidden; b.hidden=!open; $('hide').textContent=open?'Hide':'Menu'; $('hide').setAttribute('aria-expanded',String(open)); });
let drag=null; const view=$('view');
view.addEventListener('pointerdown',e=>{ drag={id:e.pointerId,x:e.clientX,y:e.clientY}; try{ view.setPointerCapture(e.pointerId); }catch(_){ } });
view.addEventListener('pointermove',e=>{ if(!drag||drag.id!==e.pointerId) return; orbit.yaw-=(e.clientX-drag.x)*0.008; orbit.pitch=Math.max(-0.2,Math.min(1.35,orbit.pitch+(e.clientY-drag.y)*0.006)); drag.x=e.clientX; drag.y=e.clientY; });
const endDrag=()=>{ drag=null; }; view.addEventListener('pointerup',endDrag); view.addEventListener('pointercancel',endDrag);
view.addEventListener('wheel',e=>{ e.preventDefault(); orbit.dist=Math.max(1.2,Math.min(40,orbit.dist*Math.exp(e.deltaY*0.001))); },{passive:false});
addEventListener('keydown',e=>{ if(e.key==='m'||e.key==='M') $('hide').click(); });

/* ---------- the flock: ten birds in a V, circling far off, to see how it looks and how fast it runs ---------- */
const V=[[0,0]]; for(let r=1;r<=5;r++){ V.push([-r*1.6,-r*1.2]); if(r<=4) V.push([r*1.6,-r*1.2]); }
function buildFlock(){ V.forEach((p,i)=>{ const b=makeBird(); const a=b.mixer.clipAction(clips.fly_A1); a.play(); a.time=(i*0.37)%clips.fly_A1.duration; a.timeScale=FLAP*(0.92+((i*7)%5)*0.04); b.act=a; b.slot=p; flock.push(b); }); }
function moveFlock(t){ const R0=28, w=0.08, cx=0, cz=10; const ang=t*w, hx=Math.cos(ang), hz=-Math.sin(ang);
  const lx=cx+Math.sin(ang)*R0, lz=cz+Math.cos(ang)*R0;
  for(const b of flock){ const [sx,sz]=b.slot, rx=hz, rz=-hx;   /* right of the heading */
    b.o.position.set(lx+rx*sx+hx*sz, 9+Math.sin(t*0.9+sx)*0.3, lz+rz*sx+hz*sz); b.o.rotation.set(0,Math.atan2(hx,hz),0); } }

/* ---------- loop ---------- */
let last=performance.now(), clock=0, n=0, acc=0;
function frame(now){ const raw=Math.min(0.05,(now-last)/1000); last=now; const dt=raw*slow; clock+=dt;
  if(bird){
    if(bird.act&&NEXT[bird.name]&&!bird.act.isRunning()) choose(NEXT[bird.name]);
    /* in the air the bird rises off the ground, and comes back down to land */
    const up=/^fly_(A|start)/.test(bird.name)?(bird.name==='fly_start_A'?Math.min(1,Math.max(0,(bird.act.time-1.2)/1.6)):1):bird.name==='fly_end_A'?Math.max(0,1-bird.act.time/2.4):0;
    bird.lift+=(up*1.4-bird.lift)*(1-Math.exp(-raw*3)); bird.o.position.y=bird.lift;
    bird.mixer.update(dt); oneLeg(bird,raw);
    if(flockOn){ for(const f of flock) f.mixer.update(dt); moveFlock(clock); }
    const tx=0, ty=0.75+bird.lift, tz=0, d=flockOn?Math.max(orbit.dist,14):orbit.dist;
    cam.position.set(tx+Math.sin(orbit.yaw)*Math.cos(orbit.pitch)*d, ty+Math.sin(orbit.pitch)*d, tz+Math.cos(orbit.yaw)*Math.cos(orbit.pitch)*d);
    cam.lookAt(tx,flockOn?ty+3:ty,tz);
    sun.target.position.set(0,0,0); sun.position.copy(sun.userData.dir).multiplyScalar(30); }
  R.render(scene,cam);
  n++; acc+=raw; if(acc>=1){ $('fps').textContent=(n/acc).toFixed(0)+' fps'+(flockOn?' · 11 birds':''); n=0; acc=0; }
  requestAnimationFrame(frame); }
function size(){ R.setSize(innerWidth,innerHeight); cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize',size); size();
/* ---------- one leg: the leg folded up under the body, laid over whatever the bird is playing ----------
   The model has no one-leg move, so the pose is made here: the thigh and the knee bend (degrees, round two axes), and the foot,
   which hangs on its own from the root, is lifted and drawn in under the body (model centimetres) and turned. Shape it by eye. */
const LEG={thighX:0, thighZ:0, kneeX:0, kneeZ:0, footUp:0, footIn:0, footTurn:0};
const LEG_SL=[['thighX','Thigh ↕',-150,150],['thighZ','Thigh ↔',-150,150],['kneeX','Knee ↕',-180,180],['kneeZ','Knee ↔',-180,180],['footUp','Foot up',-20,120],['footIn','Foot in',-60,60],['footTurn','Foot turn',-180,180]];
let legOn=false, legK=0, legSide='L';
{ const box=$('legSl');
  for(const [k,label,lo,hi] of LEG_SL){ const row=document.createElement('label'); row.className='sl';
    row.innerHTML=`<span>${label}</span><input type="range" min="${lo}" max="${hi}" step="1" value="${LEG[k]}"><output>${LEG[k]}</output>`;
    const inp=row.querySelector('input'), out=row.querySelector('output');
    inp.addEventListener('input',()=>{ LEG[k]=+inp.value; out.textContent=inp.value; legNums(); }); box.appendChild(row); }
  $('oneLeg').addEventListener('click',()=>{ legOn=!legOn; $('oneLeg').setAttribute('aria-pressed',String(legOn)); });
  group('data-side',v=>{ legSide=v; }); legNums(); }
function legNums(){ $('legNums').textContent='LEG='+JSON.stringify({side:legSide,...LEG}); }
const _q=new THREE.Quaternion(), _e=new THREE.Euler(), D2R=Math.PI/180;
/* a bone by name: the joint itself is the innermost of the nodes that share its name */
function bone(o,name){ let b=null; o.traverse(n=>{ if(n.name===name) b=n; }); return b; }
function legBones(b){ const S=legSide; if(!b.leg||b.leg.side!==S) b.leg={side:S, thigh:bone(b.o,'Leg'+S+'002'), knee:bone(b.o,'Leg'+S+'004'), foot:bone(b.o,'Leg'+S+'007')}; return b.leg; }
function oneLeg(b,dt){
  legK+=((legOn?1:0)-legK)*(1-Math.exp(-dt*2.5)); if(legK<0.002) return; const k=legK*legK*(3-2*legK), L=legBones(b);
  if(L.thigh){ _q.setFromEuler(_e.set(LEG.thighX*D2R*k,0,LEG.thighZ*D2R*k)); L.thigh.quaternion.multiply(_q); }
  if(L.knee){ _q.setFromEuler(_e.set(LEG.kneeX*D2R*k,0,LEG.kneeZ*D2R*k)); L.knee.quaternion.multiply(_q); }
  if(L.foot){ L.foot.position.y+=LEG.footUp*k; L.foot.position.z+=LEG.footIn*k; _q.setFromEuler(_e.set(LEG.footTurn*D2R*k,0,0)); L.foot.quaternion.multiply(_q); }
}
document.querySelectorAll('[data-side]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.side==='L')));
loadBird().then(()=>{ bird=makeBird(); choose('idle_A1'); $('load').hidden=true; })
  .catch(err=>{ $('load').textContent='Could not load the flamingo: '+err.message; console.error(err); });
requestAnimationFrame(frame);
</script>
</body>
</html>
