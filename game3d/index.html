<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flamingo Fields 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
:root{ --ink:#3a2a12; --glass:rgba(255,246,222,0.82); --line:rgba(90,60,20,0.18); color-scheme:light }
html,body{ height:100%; margin:0; background:#f0d898; overflow:hidden; font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink) }
[hidden]{ display:none!important }
/* the level sign: the 2D game's, in its Klee One, pale with a soft plum shadow, fading in and out over seven seconds */
#levelSign{ position:fixed; left:0; right:0; top:34%; transform:translateY(-50%); text-align:center; pointer-events:none; z-index:5; opacity:0;
  font-family:"Klee One","Trebuchet MS",sans-serif; font-weight:600; color:#fff6f0; text-shadow:0 0 18px rgba(60,30,60,.55), 0 0 6px rgba(60,30,60,.3); white-space:nowrap }
#levelSign.show{ animation:levelSign 7s linear forwards }
@keyframes levelSign{ 0%{opacity:0} 21.4%{opacity:1} 71.4%{opacity:1} 100%{opacity:0} }
#view{ position:fixed; inset:0; touch-action:none }
#view canvas{ display:block; width:100%; height:100%; outline:none }
.chip{ position:fixed; left:max(12px,env(safe-area-inset-left)); top:max(12px,env(safe-area-inset-top)); background:var(--glass); border:1px solid var(--line);
  border-radius:10px; padding:8px 12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); max-width:min(420px,calc(100vw - 24px)) }
.chip b{ font-weight:650; letter-spacing:.01em }
.chip p{ margin:4px 0 0; font-size:12.5px; color:#5a4526 }
kbd{ font:600 11px/1 ui-monospace,Menlo,monospace; background:#fffaf0; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:2px 4px }
#hint{ transition:opacity 1.2s ease }
#hint.gone{ opacity:0; pointer-events:none }
#load{ position:fixed; inset:0; display:grid; place-items:center; font-size:15px; color:#5a4526; pointer-events:none }
.fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none }
#light{ mix-blend-mode:soft-light }
#grain{ mix-blend-mode:overlay; opacity:.13; background-repeat:repeat }
#flare{ mix-blend-mode:screen }
/* the buttons down the right: Sound and Reset level for everyone; the test buttons only with the dev switch (#dev, settings.js) */
#btns{ position:fixed; right:max(12px,env(safe-area-inset-right)); top:max(12px,env(safe-area-inset-top)); display:flex; flex-direction:column; align-items:flex-end; gap:8px; z-index:4 }
#btns button{ font:600 13px/1 system-ui,sans-serif; color:#fff8e8; background:rgba(58,42,18,.62); border:0; border-radius:999px; padding:9px 14px; cursor:pointer;
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px) }
#btns button:focus-visible{ outline:2px solid #fff3cc; outline-offset:2px }
#btns button:disabled{ opacity:.45; cursor:default }
#sound[aria-pressed="false"]{ opacity:.7 }
#plus1{ background:rgba(170,70,98,.7)!important }
#skipday{ background:rgba(40,52,96,.7)!important }
#stats{ position:fixed; right:max(12px,env(safe-area-inset-right)); bottom:max(12px,env(safe-area-inset-bottom)); font:12px ui-monospace,Menlo,monospace; color:#5a4526; background:var(--glass); border-radius:6px; padding:3px 7px }
</style>
</head>
<body>
<div id="view" tabindex="0" aria-label="The golden field. Use the arrow keys or WASD to run, Space to jump and fly."></div>
<canvas class="fx" id="light" aria-hidden="true"></canvas><div class="fx" id="grain" aria-hidden="true"></div><canvas class="fx" id="flare" aria-hidden="true"></canvas>
<div class="chip" id="hint"><b>Flamingo Fields 3D</b> · milestone 2
  <p><kbd>↑</kbd><kbd>←</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>WASD</kbd> run · <kbd>Space</kbd> hop · <kbd>↑</kbd><kbd>↓</kbd> climb and sink in the air.
  Gather 10 feathers, then hop and press <kbd>Space</kbd> again to fly for 10 seconds. Fly with a wild flock and a flamingo joins you; five make a full flock.
  On a phone: drag to run, tap to hop.</p></div>
<div id="btns">
  <button id="sound" type="button" aria-pressed="true">Sound on</button>
  <button id="reset" type="button" title="Start level 1 again: no feathers, no flock, golden evening">Reset level</button>
  <button id="plus1" class="dev" type="button" title="Test: one more flamingo joins your flock" hidden>+1 flamingo</button>
  <button id="tobox" class="dev" type="button" title="Test: stand in front of the silver box, about 45 m from its door" hidden>To the box</button>
  <button id="skipday" class="dev" type="button" title="Test: skip to the next part of the day (the N key)" hidden>Dusk ›</button>
</div>
<div id="load">Loading the kids…</div>
<div id="stats" hidden></div>
<div id="levelSign" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/curves/NURBSUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/curves/NURBSCurve.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<!-- the game's files, in the order they need each other (see README.md) -->
<script src="settings.js"></script>   <!-- the numbers worth tuning, the level, the dev switch -->
<script src="kids.js"></script>       <!-- the two kids: models, looks, movement -->
<script src="flock.js"></script>      <!-- the flamingos: wild flocks and your own flock -->
<script src="ground.js"></script>     <!-- units, helpers, and the land (JS and GLSL) -->
<script src="world.js"></script>      <!-- renderer, sky, clouds, ranges, ground, grass, mist, light, camera, controls -->
<script src="sound.js"></script>      <!-- field, footsteps, flock calls, music, fast wind -->
<script src="night.js"></script>      <!-- the day going round, the moon, drawing the frame -->
<script src="road.js"></script>       <!-- the feather road -->
<script src="desert.js"></script>     <!-- the desert, the silver box, its door and light, the shore birds -->
<script src="rings.js"></script>      <!-- the puzzle at the box: the fog bank, the five rings, the door opening -->
<script src="feathers.js"></script>   <!-- the feathers, and when the kids may fly -->
<script src="level2.js"></script>     <!-- level 2: through the door onto the clouds -->
<script src="whales.js"></script>     <!-- the ten whales of level 2 -->
<script src="dunes.js"></script>      <!-- the far dune ridges, and the dune sliders (#dev-dunes) -->
<script src="buttons.js"></script>    <!-- Reset level, and the test buttons -->
<script src="dev.js"></script>        <!-- the test modes (#dev, #dev-level2, #dev-dunes, #dev-flamingo) -->
<script src="game.js"></script>       <!-- the loop, and the start -->
</body>
</html>
