<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flamingo Fields 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<style>
:root{ --ink:#3a2a12; --glass:rgba(255,246,222,0.82); --line:rgba(90,60,20,0.18); color-scheme:light }
html,body{ height:100%; margin:0; background:#f0d898; overflow:hidden; font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink) }
[hidden]{ display:none!important }
/* the level sign: the 2D game's, in its Klee One, pale with a soft plum shadow, fading in and out over seven seconds */
#levelSign{ position:fixed; left:0; right:0; top:34%; transform:translateY(-50%); text-align:center; pointer-events:none; z-index:5; opacity:0;
  font-family:"Klee One","Trebuchet MS",sans-serif; font-weight:600; color:#fff6f0; text-shadow:0 0 18px rgba(60,30,60,.55), 0 0 6px rgba(60,30,60,.3); white-space:nowrap }
#levelSign.show{ animation:levelSign 7s linear forwards }
@keyframes levelSign{ 0%{opacity:0} 21.4%{opacity:1} 71.4%{opacity:1} 100%{opacity:0} }
#view{ position:fixed; inset:0; touch-action:none }
#view canvas{ display:block; width:100%; height:100%; outline:none }
.chip{ position:fixed; left:max(12px,env(safe-area-inset-left)); top:max(12px,env(safe-area-inset-top)); background:var(--glass); border:1px solid var(--line);
  border-radius:10px; padding:8px 12px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); max-width:min(420px,calc(100vw - 24px)) }
.chip b{ font-weight:650; letter-spacing:.01em }
.chip p{ margin:4px 0 0; font-size:12.5px; color:#5a4526 }
kbd{ font:600 11px/1 ui-monospace,Menlo,monospace; background:#fffaf0; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; padding:2px 4px }
#hint{ transition:opacity 1.2s ease }
#hint.gone{ opacity:0; pointer-events:none }
#load{ position:fixed; inset:0; display:grid; place-items:center; font-size:15px; color:#5a4526; pointer-events:none }
.fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none }
#light{ mix-blend-mode:soft-light }
#grain{ mix-blend-mode:overlay; opacity:.13; background-repeat:repeat }
#flare{ mix-blend-mode:screen }
#sound{ position:fixed; right:max(12px,env(safe-area-inset-right)); top:max(12px,env(safe-area-inset-top)); font:600 13px/1 system-ui,sans-serif; color:#fff8e8;
  background:rgba(58,42,18,.62); border:0; border-radius:999px; padding:9px 14px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px) }
#sound[aria-pressed="false"]{ opacity:.7 }
#plus1{ position:fixed; right:max(12px,env(safe-area-inset-right)); top:calc(max(12px,env(safe-area-inset-top)) + 40px); font:600 13px/1 system-ui,sans-serif; color:#fff8e8;
  background:rgba(170,70,98,.7); border:0; border-radius:999px; padding:9px 14px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px) }
#reset{ position:fixed; right:max(12px,env(safe-area-inset-right)); top:calc(max(12px,env(safe-area-inset-top)) + 80px); font:600 13px/1 system-ui,sans-serif; color:#fff8e8;
  background:rgba(58,42,18,.62); border:0; border-radius:999px; padding:9px 14px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px) }
#tobox{ position:fixed; right:max(12px,env(safe-area-inset-right)); top:calc(max(12px,env(safe-area-inset-top)) + 120px); font:600 13px/1 system-ui,sans-serif; color:#fff8e8;
  background:rgba(58,42,18,.62); border:0; border-radius:999px; padding:9px 14px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px) }
#skipday{ position:fixed; right:max(12px,env(safe-area-inset-right)); top:calc(max(12px,env(safe-area-inset-top)) + 160px); font:600 13px/1 system-ui,sans-serif; color:#fff8e8;
  background:rgba(40,52,96,.7); border:0; border-radius:999px; padding:9px 14px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px) }
#skipday:focus-visible{ outline:2px solid #fff3cc; outline-offset:2px }
#tobox:focus-visible{ outline:2px solid #fff3cc; outline-offset:2px }
#reset:focus-visible{ outline:2px solid #fff3cc; outline-offset:2px }
#plus1:disabled{ opacity:.45; cursor:default }
#plus1:focus-visible{ outline:2px solid #fff3cc; outline-offset:2px }
#sound:focus-visible{ outline:2px solid #fff3cc; outline-offset:2px }
#stats{ position:fixed; right:max(12px,env(safe-area-inset-right)); bottom:max(12px,env(safe-area-inset-bottom)); font:12px ui-monospace,Menlo,monospace; color:#5a4526; background:var(--glass); border-radius:6px; padding:3px 7px }
</style>
</head>
<body>
<div id="view" tabindex="0" aria-label="The golden field. Use the arrow keys or WASD to run, Space to jump and fly."></div>
<canvas class="fx" id="light" aria-hidden="true"></canvas><div class="fx" id="grain" aria-hidden="true"></div><canvas class="fx" id="flare" aria-hidden="true"></canvas>
<div class="chip" id="hint"><b>Flamingo Fields 3D</b> · milestone 2
  <p><kbd>↑</kbd><kbd>←</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>WASD</kbd> run · <kbd>Space</kbd> hop · <kbd>↑</kbd><kbd>↓</kbd> climb and sink in the air.
  Gather 10 feathers, then hop and press <kbd>Space</kbd> again to fly for 10 seconds. Fly with a wild flock and a flamingo joins you; five make a full flock.
  On a phone: drag to run, tap to hop.</p></div>
<button id="sound" type="button" aria-pressed="true">Sound on</button>
<button id="plus1" type="button" title="Test: one more flamingo joins your flock">+1 flamingo</button>
<button id="reset" type="button" title="Start level 1 again: no feathers, no flock, golden evening">Reset level</button>
<button id="tobox" type="button" title="Test: stand in front of the silver box, about 45 m from its door">To the box</button>
<button id="skipday" type="button" title="Test: skip to the next part of the day (the N key)">Dusk ›</button>
<div id="load">Loading the kids…</div>
<div id="stats" hidden></div>
<div id="levelSign" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/curves/NURBSUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/curves/NURBSCurve.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="kids.js"></script>
<script src="flock.js"></script>
<script>
/* Flamingo Fields in 3D — milestone 1: the golden field of level 1, walkable, with both kids.
   The world is in metres. The game's own units are converted with U: one game unit is U metres
   (the game's big kid is 98 units tall; the 3D girl is 1.43 m). Left and right are mirrored against the game's
   numbers, because its screen maths and three.js's are mirror images; that keeps the sun, the peaks and the wind
   on the same side as in the game. */
const $=id=>document.getElementById(id);
const U=1.43/98;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- the game's own helpers, as they are in index.html ---------- */
function h2(i,j){ let n=(Math.imul(i,374761393)+Math.imul(j,668265263))|0; n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; }
function rng(seed){ let s=seed>>>0; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function vnoise(x,y,sd){ const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy, ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  const a=h2(ix+sd,iy), b=h2(ix+1+sd,iy), c=h2(ix+sd,iy+1), d=h2(ix+1+sd,iy+1); return a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy; }
function fbm(x,y,sd){ return 0.5*vnoise(x,y,sd)+0.27*vnoise(x*2.1,y*2.1,sd+71)+0.15*vnoise(x*4.3,y*4.3,sd+173)+0.08*vnoise(x*8.7,y*8.7,sd+311); }
const rgb=a=>new THREE.Color(a[0]/255,a[1]/255,a[2]/255);
const mixA=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

/* ---------- the land: the game's level 1 hills (groundFull, without the coast), in metres ---------- */
const SUN_B=0.64;                                   // the sun's bearing, as in the game
/* The journey's end (desert.js): once the feather road has been flown, a coast point is laid far ahead along it. Half way there the field
   gives way to desert, great dunes in long ridges across the way, levelling out where the silver box stands. All in game units, as the 2D game. */
const SHORE=6250, BOX_HALF=1000, BOX_H=2000, SAND_RAMP=2500, DES_A0=SHORE-(52000+SHORE)/2, SUNDX_G=Math.sin(SUN_B), SUNDZ_G=Math.cos(SUN_B);
const COAST={on:false, x:0, z:0}, uCoast={value:new THREE.Vector4(0,0,0,0)};
function shoreCurve(lat){ return 230*Math.sin(lat*0.0019+0.7)+105*Math.sin(lat*0.0051+2.1)+38*Math.sin(lat*0.0127+4.0); }
/* where the desert begins is no line: it wanders in and out by up to about 240 m in long curves, sends tongues of sand far into the field,
   and breaks up into patches of sand ahead of it and islands of grass behind it */
function edgeWander(a,lat){ const S=Math.sin, q=S(a*0.0031+2*S(lat*0.0023))*S(lat*0.0027-a*0.0011+1);
  return 9000*S(lat*0.00021+1.2)+5000*S(lat*0.00053+a*0.00008+0.4)+2500*S(lat*0.0013-a*0.0002+2)+6000*Math.pow(Math.max(0,S(lat*0.0017+0.6*S(a*0.0003))),6)
        +4000*Math.pow(Math.max(0,q),2)-3000*Math.pow(Math.max(0,-q),2); }
function coastAlong(gx,gz){ const dx=gx-COAST.x, dz=gz-COAST.z, a=dx*SUNDX_G+dz*SUNDZ_G, lat=dx*SUNDZ_G-dz*SUNDX_G; return Math.min(SHORE-700,(a+edgeWander(a,lat)-DES_A0-shoreCurve(lat)*3)*0.5); }
/* the dunes: three sizes of ridge, each a sharp crest with a gentle wind side and a steeper lee side, the crests wandering, curling
   and coming and going along their length, the three running at different angles so nothing repeats. In game units, along (al) and across (lat) the way. */
function duneH(al,lat){ const S=Math.sin, P=(x,e)=>Math.pow(Math.max(0,x),e);
  /* broad dunes, about 130 m apart and up to 6 m tall: each a sharp crest with a long gentle wind side and a steeper lee side.
     Their crests bend only in long, slow curves, swell and fade along their length, and a second, lower set running at an angle
     joins them (the higher of the two wins, softly), so ridges fork and merge as real dunes do, without a criss-cross maze. */
  const w1=1.5*S(lat*0.0003+0.8)+0.45*S(lat*0.0007+al*0.00015+2.4), p1=al*0.00034+w1, q1=p1+0.36*S(2*p1);
  const hA=(0.62+0.38*S(lat*0.00031+al*0.00012+1.7))*P(1-Math.abs(S(q1)),1.7);
  const a2=al*0.9+lat*0.44, b2=lat*0.9-al*0.44, w2=1.4*S(b2*0.00035+2.9)+0.4*S(b2*0.0008-a2*0.00015), p2=a2*0.0005+w2, q2=p2+0.32*S(2*p2);
  const hB=(0.35+0.25*S(b2*0.00037+0.6))*P(1-Math.abs(S(q2)),1.6);
  const k=0.12, m=Math.max(hA,hB)+k*P(1-Math.abs(hA-hB)/k,2)*0.25;   // a soft maximum: where two ridges meet they join smoothly
  return 420*m-110; }
function groundAt(x,z){ const gx=-x/U, gz=z/U, a=gx*0.0019+0.5, b=gz*0.0023+1.1, c=(gx*0.8+gz*0.6)*0.0041; let g=90*Math.sin(a)*Math.sin(b)+30*Math.sin(c);
  if(COAST.on){ const cs=coastAlong(gx,gz); if(cs>0){ const dx=gx-COAST.x, dz=gz-COAST.z, al=dx*SUNDX_G+dz*SUNDZ_G, lat=dx*SUNDZ_G-dz*SUNDX_G, r=clamp(cs/4200,0,1),
      f0=clamp((Math.hypot(al-SHORE,lat)-BOX_HALF-900)/3200,0,1), A=r*f0*f0*(3-2*f0), d1=al*0.0012+Math.sin(lat*0.0008)*1.6, d2=lat*0.0009+al*0.0004+1.7;
      g=g*(1-0.65*r)+A*duneH(al,lat); } }
  return g*U; }
/* flying, heights are measured from a gentler ground: 30% of the real hills and dunes, 70% their average over a disc about 46 m across
   (wide enough to cancel the dune ridges). The kids, the camera and your flock all use it in the air; on foot it is the real ground. */
const AIR_REAL=0.3, AIR_R=46, AIR_PTS=[];
for(const [r,n] of [[0.4597,6],[0.8881,10]]) for(let i=0;i<n;i++){ const t=(i+(n>6?0.5:0))/n*6.2832; AIR_PTS.push([Math.cos(t)*r*AIR_R,Math.sin(t)*r*AIR_R,0.5/n]); }
function airGround(x,z){ let s=0; for(const p of AIR_PTS) s+=groundAt(x+p[0],z+p[1])*p[2]; return AIR_REAL*groundAt(x,z)+(1-AIR_REAL)*s; }
const GROUND_GLSL=`
uniform vec4 uCoast;   /* xy: the coast point in game units; z: 1 once it is laid */
const vec2 SUNDG=vec2(${Math.sin(SUN_B).toFixed(8)},${Math.cos(SUN_B).toFixed(8)});
float shoreCurve(float lat){ return 230.0*sin(lat*0.0019+0.7)+105.0*sin(lat*0.0051+2.1)+38.0*sin(lat*0.0127+4.0); }
float edgeWander(float a, float lat){ float q=sin(a*0.0031+2.0*sin(lat*0.0023))*sin(lat*0.0027-a*0.0011+1.0);
  return 9000.0*sin(lat*0.00021+1.2)+5000.0*sin(lat*0.00053+a*0.00008+0.4)+2500.0*sin(lat*0.0013-a*0.0002+2.0)+6000.0*pow(max(0.0,sin(lat*0.0017+0.6*sin(a*0.0003))),6.0)
        +4000.0*pow(max(0.0,q),2.0)-3000.0*pow(max(0.0,-q),2.0); }
float coastAlong(vec2 p){ vec2 d=vec2(-p.x,p.y)/${U.toFixed(8)}-uCoast.xy; float a=dot(d,SUNDG), lat=d.x*SUNDG.y-d.y*SUNDG.x;
  return uCoast.z>0.5 ? min(${(SHORE-700).toFixed(1)},(a+edgeWander(a,lat)-(${DES_A0.toFixed(1)})-shoreCurve(lat)*3.0)*0.5) : -1.0; }
float duneH(float al, float lat){
  float w1=1.5*sin(lat*0.0003+0.8)+0.45*sin(lat*0.0007+al*0.00015+2.4), p1=al*0.00034+w1, q1=p1+0.36*sin(2.0*p1);
  float hA=(0.62+0.38*sin(lat*0.00031+al*0.00012+1.7))*pow(max(0.0,1.0-abs(sin(q1))),1.7);
  float a2=al*0.9+lat*0.44, b2=lat*0.9-al*0.44, w2=1.4*sin(b2*0.00035+2.9)+0.4*sin(b2*0.0008-a2*0.00015), p2=a2*0.0005+w2, q2=p2+0.32*sin(2.0*p2);
  float hB=(0.35+0.25*sin(b2*0.00037+0.6))*pow(max(0.0,1.0-abs(sin(q2))),1.6);
  float k=0.12, m=max(hA,hB)+k*pow(max(0.0,1.0-abs(hA-hB)/k),2.0)*0.25;
  return 420.0*m-110.0; }
float groundAt(vec2 p){ float gx=-p.x/${U.toFixed(8)}, gz=p.y/${U.toFixed(8)};
  float a=gx*0.0019+0.5, b=gz*0.0023+1.1, c=(gx*0.8+gz*0.6)*0.0041;
  float g=90.0*sin(a)*sin(b)+30.0*sin(c);
  float cs=coastAlong(p);
  if(cs>0.0){ vec2 d=vec2(gx,gz)-uCoast.xy; float al=dot(d,SUNDG), lat=d.x*SUNDG.y-d.y*SUNDG.x, r=clamp(cs/4200.0,0.0,1.0);
    float f0=clamp((length(vec2(al-${SHORE.toFixed(1)},lat))-${(BOX_HALF+900).toFixed(1)})/3200.0,0.0,1.0), A=r*f0*f0*(3.0-2.0*f0);
    g=g*(1.0-0.65*r)+A*duneH(al,lat); }
  return g*${U.toFixed(8)}; }`;

/* ---------- renderer, scene, camera ---------- */
const R=new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.outputEncoding=THREE.sRGBEncoding;
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
$('view').appendChild(R.domElement);
const scene=new THREE.Scene();
const HAZE=[250,228,165];
/* the haze, on the 2D game's own curve: strokes fade toward the pale horizon colour from about 4.7 m out, almost fully by 136 m,
   rising steeply at first (a power of 0.6). From high up the air clears, as in the game. The groves take a gentler haze so they stay in view. */
THREE.ShaderChunk.fog_fragment=`#ifdef USE_FOG
  #ifdef SOFT_HAZE
  float fogFactor=pow(clamp((vFogDepth-fogNear)/(fogFar*4.0-fogNear),0.0,1.0),0.8)*0.9;
  #else
  float fogFactor=pow(clamp((vFogDepth-fogNear)/(fogFar-fogNear),0.0,1.0),0.6)*0.96;
  #endif
  gl_FragColor.rgb=mix(gl_FragColor.rgb,fogColor,fogFactor);
#endif`;
const FOG_NEAR=320*U, FOG_FAR=(320+9000)*U;
scene.fog=new THREE.Fog(rgb(HAZE).convertSRGBToLinear(),FOG_NEAR,FOG_FAR);
const cam=new THREE.PerspectiveCamera(58,1,0.25,6000);     // the game's view: focal = 0.9 × the screen's height, so 58° tall

/* the evening light: a low warm sun at the game's bearing, and a golden sky light */
const SUNDIR=new THREE.Vector3(-Math.sin(SUN_B)*Math.cos(0.025),Math.sin(0.025),Math.cos(SUN_B)*Math.cos(0.025));   // the disc sits on the horizon
const LIGHTDIR=new THREE.Vector3(-Math.sin(SUN_B)*Math.cos(0.2),Math.sin(0.2),Math.cos(SUN_B)*Math.cos(0.2));        // the light comes from a little higher, for long but useful shadows
const hemi=new THREE.HemisphereLight(0xffe6bc,0x8a6428,0.85); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffcf8e,1.15); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:80}); sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.02;
scene.add(sun,sun.target);

/* ---------- the sky: the game's gradient, teal overhead to pale gold at the horizon, with the sun's warm glow ---------- */
const skyMat=new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{uSun:{value:SUNDIR}},
  vertexShader:`varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vDir; uniform vec3 uSun;
    vec3 c(float r,float g,float b){ return vec3(r,g,b)/255.0; }
    void main(){ vec3 d=normalize(vDir); float e=asin(clamp(d.y,-1.0,1.0));      /* elevation, radians */
      float f=clamp(1.0-e/0.506,0.0,1.0);                                            /* the game's 0 (top of its screen) .. 1 (horizon) */
      vec3 col= f<0.4 ? mix(c(42.,138.,136.),c(79.,169.,153.),f/0.4) : f<0.76 ? mix(c(79.,169.,153.),c(147.,199.,158.),(f-0.4)/0.36) : mix(c(147.,199.,158.),c(240.,216.,152.),(f-0.76)/0.24);
      if(e>0.506) col=mix(c(42.,138.,136.),c(30.,112.,118.),clamp((e-0.506)/0.8,0.0,1.0));
      float az=atan(d.x,d.z), sa=atan(uSun.x,uSun.z), da=abs(mod(az-sa+3.14159265,6.2831853)-3.14159265);
      col=mix(col,c(255.,186.,112.),0.42*clamp(1.0-da/1.0,0.0,1.0)*clamp(1.0-e/0.506,0.0,1.0));   /* warm drift toward the sun side */
      float a=acos(clamp(dot(d,uSun),-1.0,1.0))/1.2;                                                  /* the sun's glow, as the game's radial gradient */
      vec4 g= a<0.1 ? mix(vec4(c(255.,240.,180.),0.95),vec4(c(255.,200.,105.),0.62),a/0.1) : a<0.4 ? mix(vec4(c(255.,200.,105.),0.62),vec4(c(255.,160.,80.),0.2),(a-0.1)/0.3) : mix(vec4(c(255.,160.,80.),0.2),vec4(c(255.,160.,80.),0.0),clamp((a-0.4)/0.6,0.0,1.0));
      col=mix(col,g.rgb,g.a*step(-0.02,e));
      col=mix(col,c(250.,228.,165.),0.8*clamp(1.0-abs(e)/0.05,0.0,1.0));                             /* the haze band on the horizon */
      if(e<0.0) col=c(250.,228.,165.);
      float s=acos(clamp(dot(d,uSun),-1.0,1.0)); col=mix(col,c(255.,248.,222.),smoothstep(0.016,0.011,s));   /* the disc */
      gl_FragColor=vec4(col,1.0); }`});
const sky=new THREE.Mesh(new THREE.SphereGeometry(5000,48,24),skyMat); sky.renderOrder=-10; scene.add(sky);

/* ---------- clouds: painted the game's way (torn, sheared noise), standing far off round the sky ---------- */
const C_SH=[146,116,124], C_MID=[232,166,120], C_HI=[255,220,164];
function paintCloud(seed,wisp,warm){

  const gt=Math.max(gF+CAM_H+(hy-Math.min(hy*0.15,95*U))*Math.min(1,lift*1.6), groundAt(px,pz)-15*U+CAM_H);
  camY+=(gt-camY)*(snap?1:1-Math.exp(-dt*4));
  cam.position.set(px,camY,pz);
  const pitch=-Math.atan(0.1*Math.min(lift,1.7)/0.9);                   // in the air the horizon rises, so the view tips down a little
  cam.lookAt(px+fx*Math.cos(pitch),camY+Math.sin(pitch),pz+fz*Math.cos(pitch));
  /* the sky, clouds and ranges stay at the horizon; the sun's shadow box follows the kids */
  { const hk=Math.pow(Math.max(1,(camY-gF)/CAM_H),0.75); scene.fog.near=FOG_NEAR*hk; scene.fog.far=FOG_FAR*hk; }
  sky.position.copy(cam.position); clouds.position.set(cam.position.x,cam.position.y-30,cam.position.z); ranges.position.set(cam.position.x,cam.position.y-CAM_H,cam.position.z);
  sun.target.position.set(P.x,groundAt(P.x,P.z),P.z); sun.position.copy(sun.target.position).addScaledVector(LIGHTDIR,40);
}

/* ---------- input: the arrows are read against where the camera looks, as in the game ---------- */
function keyInput(){ const L=girl, P=L.P, air=P.state==='fly'||P.state==='land';
  let ix=(keys.has('right')?1:0)-(keys.has('left')?1:0), iz=(keys.has('up')?1:0)-(keys.has('down')?1:0);
  const In={speed:0, climb:keys.has('up'), sink:keys.has('down'), steered:true};
  if(air) iz=0;
  const back=!air&&iz<0&&ix===0; if(back&&backYaw==null) backYaw=camYaw; if(!back) backYaw=null;
  if(ix||iz){ const y=back?backYaw:camYaw, fx=Math.sin(y), fz=Math.cos(y), wx=fx*iz-fz*ix, wz=fz*iz+fx*ix;
    In.heading=Math.atan2(wx,wz); In.speed=L.RUN_SPEED; }
  return In; }
let moved=false;
function nudge(){ if(!moved){ moved=true; setTimeout(()=>$('hint').classList.add('gone'),9000); } }
const KEYMAP={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};
addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if(KEYMAP[k]||k===' ') e.preventDefault();
  if(k===' '&&!e.repeat&&girl) jumpKid(girl); if(KEYMAP[k]){ keys.add(KEYMAP[k]); nudge(); }
  if(k==='`') $('stats').hidden=!$('stats').hidden; });
addEventListener('keyup',e=>{ const k=KEYMAP[e.key.toLowerCase()]; if(k) keys.delete(k); });
addEventListener('blur',()=>keys.clear());
/* on a phone: drag to run (sideways to steer, up to run on, down to come back), tap to hop */
let drag=null; const view=$('view');
view.addEventListener('pointerdown',e=>{ view.focus(); try{ view.setPointerCapture(e.pointerId); }catch(_){ } drag={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),far:0}; });
view.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.far=Math.max(drag.far,Math.hypot(dx,dy));
  keys.delete('left'); keys.delete('right'); keys.delete('up'); keys.delete('down');
  if(dx<-14) keys.add('left'); else if(dx>14) keys.add('right'); if(dy<-14) keys.add('up'); else if(dy>40) keys.add('down'); if(drag.far>14) nudge(); });
function endDrag(e){ if(!drag||e.pointerId!==drag.id) return; if(drag.far<10&&performance.now()-drag.t<260&&girl) jumpKid(girl); for(const k of ['left','right','up','down']) keys.delete(k); drag=null; }
view.addEventListener('pointerup',endDrag); view.addEventListener('pointercancel',endDrag);

/* ---------- sound: the field recording, looped forever, each pass starting 4 s before the last one ends (as the 2D game does).
   It starts with the first key or tap, since browsers only play sound after the player has done something. ---------- */
const OVERLAP=4, soundBtn=$('sound'), fadeOut=new Float32Array(48).map((_,i)=>Math.cos(i/47*Math.PI/2));
let actx=null, master=null, fieldBuf=null, fieldGain=null, nextAt=0, soundOn=true, runGain=null, runSrc=null, palGain=null, palSrc=null;
try{ soundOn=localStorage.getItem('ff3dSound')!=='off'; }catch(_){ }
function showSound(){ soundBtn.textContent=soundOn?'Sound on':'Sound off'; soundBtn.setAttribute('aria-pressed',String(soundOn)); }
function scheduleField(){
  if(!fieldBuf) return;
  while(nextAt<actx.currentTime+12){
    const t=Math.max(nextAt,actx.currentTime+0.05), dur=fieldBuf.duration, src=actx.createBufferSource(), g=actx.createGain();
    src.buffer=fieldBuf; g.gain.setValueAtTime(1,t); g.gain.setValueCurveAtTime(fadeOut,t+dur-OVERLAP,OVERLAP);
    src.connect(g); g.connect(fieldGain); src.start(t); nextAt=t+dur-OVERLAP; } }
function startSound(){
  if(actx){ if(actx.state==='suspended'&&!document.hidden) actx.resume(); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx=new AC(); master=actx.createGain(); master.gain.value=soundOn?0.85:0; master.connect(actx.destination);
  fieldGain=actx.createGain(); fieldGain.gain.value=0; fieldGain.connect(master);
  fetch('assets/field01.mp3').then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(b=>actx.decodeAudioData(b))
    .then(buf=>{ fieldBuf=buf; scheduleField(); setInterval(scheduleField,2000); fieldGain.gain.setTargetAtTime(1,actx.currentTime,0.8); })   /* it fades in */
    .catch(()=>{ soundBtn.textContent='Sound unavailable'; soundBtn.disabled=true; });
  /* footsteps, as the 2D game: the big kid's steps looped, heard only while running on the ground; the small kid has the same
     steps 10% faster, started part-way in so the two don't land together */
  fetch('assets/run_big.wav').then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(b=>actx.decodeAudioData(b))
    .then(buf=>{ runGain=actx.createGain(); runGain.gain.value=0; runGain.connect(master);
      runSrc=actx.createBufferSource(); runSrc.buffer=buf; runSrc.loop=true; runSrc.connect(runGain); runSrc.start();
      palGain=actx.createGain(); palGain.gain.value=0; palGain.connect(master);
      palSrc=actx.createBufferSource(); palSrc.buffer=buf; palSrc.loop=true; palSrc.playbackRate.value=1.1; palSrc.connect(palGain); palSrc.start(0,1.29); })
    .catch(()=>{});
  /* the wild flock's calls (the 2D game's flamingos.mp3), placed left or right to where the flock is */
  fetch('assets/flamingos.mp3').then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(b=>actx.decodeAudioData(b))
    .then(buf=>{ flamBuf=buf; flamGain=actx.createGain(); flamGain.gain.value=0; flamPan=actx.createStereoPanner?actx.createStereoPanner():null;
      if(flamPan){ flamGain.connect(flamPan); flamPan.connect(master); } else flamGain.connect(master); })
    .catch(()=>{}); }
/* Music: the 2D game's pad.mp3 plays once, from the moment the flock is complete. It is streamed, and only fetched once the flock is one short. */
let padEl=null, padPlayed=false;
function updateMusic(){
  if(!actx||!master||padPlayed) return;
  if(!padEl && mates.length>=MATES_MAX-1){ padEl=new Audio('assets/pad.mp3'); padEl.preload='auto';
    try{ const g=actx.createGain(); g.gain.value=0.7; actx.createMediaElementSource(padEl).connect(g); g.connect(master); }catch(e){ padEl.volume=0.7; } }
  if(padEl && freeFly()){ padPlayed=true; const p=padEl.play(); if(p&&p.catch) p.catch(()=>{}); }
}
/* Fast flight: with a full flock the kids fly at the 2D game's full-flock speed (800 against 430, so about 1.9 times), picking it up over a few seconds.
   The 2D game's fast.mp3 wind is fetched once the flock is one short, looped with a 3 s overlap, and swells only at speed. */
const FAST_OVERLAP=3, fastIn=new Float32Array(48).map((_,i)=>Math.sin(i/47*Math.PI/2));
let fastBuf=null, fastGain=null, fastNext=-1, fastLoading=false;
const FLY_TOP=FLY_BASE*(1+0.5*(800/430-1));   /* full-flock speed: half the 2D game's extra (about 18.5 m/s against 13), which was too hectic in 3D */
function updateFlySpeed(dt){
  const want=(girl.P.state==='fly'&&freeFly())?FLY_TOP:FLY_BASE;
  FLY_SPEED+=(want-FLY_SPEED)*(1-Math.exp(-dt*(want>FLY_SPEED?0.6:1.5)));
}
function updateFastSound(){
  if(!actx||!master||!girl) return;
  if(!fastBuf){
    if(!fastLoading && mates.length>=MATES_MAX-1){ fastLoading=true;
      fetch('assets/fast.mp3').then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(b=>actx.decodeAudioData(b))
        .then(buf=>{ fastGain=actx.createGain(); fastGain.gain.value=0; fastGain.connect(master); fastBuf=buf; }).catch(()=>{}); }
    return; }
  const t=actx.currentTime, dur=fastBuf.duration;
  if(fastNext<t-0.1) fastNext=t+0.02;
  while(fastNext<t+6){ const src=actx.createBufferSource(), g=actx.createGain(); src.buffer=fastBuf;
    g.gain.setValueCurveAtTime(fastIn,fastNext,FAST_OVERLAP); g.gain.setValueCurveAtTime(fadeOut,fastNext+dur-FAST_OVERLAP,FAST_OVERLAP);
    src.connect(g); g.connect(fastGain); src.start(fastNext); fastNext+=dur-FAST_OVERLAP; }
  /* it swells as the kids pick up speed beyond normal flying pace and dies away as they slow (the 2D rule, in its own units) */
  const v=(FLY_SPEED-FLY_BASE)/(FLY_TOP-FLY_BASE)*girl.P.flyW, on=(girl.P.state==='fly'&&freeFly())?clamp((v-0.06)/0.94,0,1):0, lvl=on*1.8;   /* the wind still reaches full at the (lower) top speed */
  fastGain.gain.setTargetAtTime(lvl,t,lvl>0?0.25:0.5);
}
/* the flock's calls: the clip loops with a short overlap while a flock is in the sky, louder the nearer it is (the 2D game's rule).
   In 3D they also come from its side, so you can turn toward them by ear. */
let flamBuf=null, flamGain=null, flamPan=null, flamNext=0;
function updateFlamSound(){
  if(!flamGain||!girl) return;
  const t=actx.currentTime;
  if(!flock){ flamGain.gain.setTargetAtTime(0,t,0.4); return; }
  if(flamNext<t-0.1) flamNext=t+0.02;
  while(flamNext<t+1.5){
    const src=actx.createBufferSource(), g=actx.createGain(), dur=flamBuf.duration;
    src.buffer=flamBuf; g.gain.setValueAtTime(1,flamNext); g.gain.setValueCurveAtTime(fadeOut,flamNext+dur-1.5,1.5);
    src.connect(g); g.connect(flamGain); src.start(flamNext); flamNext+=dur-1.5; }
  const lx=-girl.P.x/U, lz=girl.P.z/U, d=Math.hypot(lx-flock.x,lz-flock.z), coming=flock.s<FLOCK_NEAR?1:0;
  const lv=clamp(1.15-d/3000,coming*(0.03+0.11*clamp((9000-d)/5000,0,1)),1)*0.9;
  flamGain.gain.setTargetAtTime(lv,t,0.3);
  if(flamPan){ /* (rx,rz) is the camera's left */ const rx=Math.cos(camYaw), rz=-Math.sin(camYaw), dx=-flock.x*U-cam.position.x, dz=flock.z*U-cam.position.z, m=Math.hypot(dx,dz)||1;
    flamPan.pan.setTargetAtTime(clamp(-(dx*rx+dz*rz)/m*0.85,-0.85,0.85),t,0.25); } }
function stepsFor(K){ const P=K.P; return (P.state==='ground'||P.state==='touch')&&P.y<0.02 ? clamp((P.spd/K.RUN_SPEED-0.25)/0.5,0,1) : 0; }
function updateRunSound(){ if(!runGain||!girl) return; const t=actx.currentTime, on=stepsFor(girl), pon=stepsFor(boy);
  runGain.gain.setTargetAtTime(on*0.9,t,on>0?0.05:0.09); runSrc.playbackRate.setTargetAtTime(1+0.28*on,t,0.15);
  palGain.gain.setTargetAtTime(pon*0.75,t,pon>0?0.05:0.09); palSrc.playbackRate.setTargetAtTime(1.1*(1+0.28*pon),t,0.15); }
soundBtn.addEventListener('click',e=>{ e.stopPropagation(); startSound(); soundOn=!soundOn; showSound(); try{ localStorage.setItem('ff3dSound',soundOn?'on':'off'); }catch(_){ }
  if(master) master.gain.setTargetAtTime(soundOn?0.85:0,actx.currentTime,0.15); });
soundBtn.addEventListener('pointerdown',e=>e.stopPropagation());
$('plus1').addEventListener('pointerdown',e=>e.stopPropagation());
$('reset').addEventListener('pointerdown',e=>e.stopPropagation());
$('tobox').addEventListener('pointerdown',e=>e.stopPropagation());
$('skipday').addEventListener('pointerdown',e=>e.stopPropagation());
$('skipday').addEventListener('click',e=>{ e.stopPropagation(); skipDayPart(); $('view').focus(); });
$('tobox').addEventListener('click',e=>{ e.stopPropagation(); goToBox(); $('view').focus(); });
$('reset').addEventListener('click',e=>{ e.stopPropagation(); resetLevel(); $('view').focus(); });
/* Reset level: level 1 from the start. The kids back where they began, no feathers, no flock, the wild flocks starting over,
   the feathers back in the grass, and the golden evening standing still again. */
function resetLevel(){
  if(!girl) return;
  feathers=0; flightLeft=0; got.clear(); lastGot=-9;
  mates.length=0; mateMsgT=-99; flock=null; flockN=0; nextFlock=clock+FLOCK_FIRST;
  nightOn=false; dayOffset=-clock; night=0; pathA=0; pathAlign=0; pathOn=false; clearCoast(); arrived=false; doorNear=0; doorIn=0; FLY_SPEED=FLY_BASE; ALT_MAX=640*U;
  if(padEl){ padEl.pause(); try{ padEl.currentTime=0; }catch(_){ } } padPlayed=false;
  events.length=0; keys.clear();
  [[girl,0,0],[boy,-1.5,-1.4]].forEach(([K,x,z])=>{ Object.assign(K.P,{x,z,y:0,vy:0,h:0.1,turn:0,bank:0,pitch:0,spd:0,alt:CRUISE,state:'ground',crouch:0,upLock:false}); });
  placeCam(girl,0,true); $('plus1').disabled=false;
}
$('plus1').addEventListener('click',e=>{ e.stopPropagation(); startSound(); giftMate(); $('plus1').disabled=mates.length>=MATES_MAX; $('view').focus(); });
addEventListener('keydown',()=>startSound()); addEventListener('pointerdown',()=>startSound());
document.addEventListener('visibilitychange',()=>{ if(!actx) return; if(document.hidden) actx.suspend(); else actx.resume(); });
showSound();

/* ---------- loop ---------- */
let last=performance.now(), clock=0, fpsT=0, fpsN=0, slowFrames=0;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(girl){ clock+=dt;
    updateFlySpeed(dt); stepKid(girl,dt,flockAssist(keyInput(),girl.P.state==='fly'));
    watchLeader(girl,boy,clock); for(let i=events.length-1;i>=0;i--) if(events[i].at<=clock){ const e=events.splice(i,1)[0]; e.f(); }
    stepKid(boy,dt,followInput(girl,boy));
    updateDesert(dt,clock);
    for(const K of [girl,boy]){ K.mixer.update(dt); placeKid(K); bendArms(K); const cs=K.P.y<2.5; if(K.cs!==cs){ K.cs=cs; K.root.traverse(n=>{ if(n.isMesh) n.castShadow=cs; }); } }   /* high in the air the low sun would stretch their shadows into long bands across the field */
    placeCam(girl,dt,false);
    updateFlock(girl,dt,clock); placeFlock(dt,clock); updateMates(girl,dt,clock); placeMates(dt);
    updatePath(girl,dt,clock); pickFeathers(clock); flightRules(dt); placeRoad(girl,clock); placeFeathers(girl,clock);
    followGround(girl.P.x,girl.P.z); buildGroves(girl.P.x,girl.P.z); moveSeeds(dt,clock); moveClouds(clock);
    rollDunes(dt); groundTime.value=clock; groundAir.value=clamp((cam.position.y-groundAt(cam.position.x,cam.position.z)-120*U)/(200*U),0,1);
    for(const gm of grassAll){ const u=gm.material.uniforms; u.uCentre.value.set(girl.P.x,girl.P.z); u.uTime.value=clock; u.uAir.value=groundAir.value;
      u.uKid0.value.set(girl.P.x,girl.P.y,girl.P.z); u.uKid1.value.set(boy.P.x,boy.P.y,boy.P.z); } }
  nightFrame(clock); renderFrame(); overlays(clock); drawHud(clock); updateRunSound(); if(actx){ updateFlamSound(); updateMusic(); updateFastSound(); }
  /* frame rate: shown with the ` key; on a slow device the grass thins itself */
  fpsN++; fpsT+=dt; if(fpsT>=1){ const fps=fpsN/fpsT; $('stats').textContent=fps.toFixed(0)+' fps · '+(grassAll.reduce((a,gm)=>a+gm.geometry.instanceCount,0)/1000).toFixed(0)+'k blades';
    if(fps<40) slowFrames++; else slowFrames=0; if(slowFrames>=3&&grass.geometry.instanceCount>25000){ for(const gm of grassAll) gm.geometry.instanceCount=Math.round(gm.geometry.instanceCount*0.75); slowFrames=0; }
    fpsN=0; fpsT=0; }
  requestAnimationFrame(frame);
}
function size(){ const w=innerWidth,h=innerHeight; R.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix(); }
addEventListener('resize',size); size();
followGround(0,0); buildGroves(0,0);
(async()=>{
  try{ await loadKids('assets/');
    girl.P.h=0.1; boy.P.x=-1.5; boy.P.z=-1.4; boy.P.h=0.1;
    placeCam(girl,0,true); $('load').hidden=true;
    loadFlamingo('assets/').catch(err=>console.error('Could not load the flamingos',err));
    loadFeathers('assets/').catch(err=>console.error('Could not load the feather',err)); }   /* the flocks load behind the scenes; the first comes after 30 s */
  catch(err){ $('load').textContent='Could not load the kids: '+err.message; console.error(err); }
  requestAnimationFrame(frame);
})();
</script>
